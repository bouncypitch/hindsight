    <option value="missing_curb_ramp">missing_curb_ramp</option>
    <option value="scooter_cuts_across">scooter_cuts_across</option>
  </select>
  <select id="policySelect" title="Policy">
    <option value="recorded">recorded</option>
    <option value="safe">safe</option>
  </select>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================================
// URL Parameters & Scenario / Policy Configuration
// ============================================================================
const urlParams = new URLSearchParams(window.location.search);
const trajUrl = urlParams.get('traj');
let camMode = urlParams.get('cam') === 'chase' ? 'chase' : 'robot';
const isCapture = urlParams.get('capture') === '1';

const VALID_SCENARIOS = [
  'baseline',
  'truck_runs_light',
  'pedestrian_steps_out',
  'missing_curb_ramp',
  'scooter_cuts_across'
];
const rawScenario = urlParams.get('scenario') || 'baseline';
const scenario = VALID_SCENARIOS.includes(rawScenario) ? rawScenario : 'baseline';

const rawPolicy = urlParams.get('policy') || 'recorded';
const policy = (rawPolicy === 'safe') ? 'safe' : 'recorded';

const DEFAULT_CONFLICT_TIMES = {
  baseline: 12.20,
  truck_runs_light: 12.20,
  pedestrian_steps_out: 14.50,
  missing_curb_ramp: 9.60,
  scooter_cuts_across: 13.20
};

window.scenarioInfo = {
  scenario,
  policy,
  conflict_t: DEFAULT_CONFLICT_TIMES[scenario]
};

const uiEl = document.getElementById('ui');
if (isCapture) {
  uiEl.classList.add('hidden');
}

const scenarioSelectEl = document.getElementById('scenarioSelect');
const policySelectEl = document.getElementById('policySelect');
if (scenarioSelectEl) scenarioSelectEl.value = scenario;
if (policySelectEl) policySelectEl.value = policy;

const FALLBACK_TRAJ = {
  fps: 20.0,
  camera: {
    hfov_deg: 110.44766183865366,
    vfov_deg: 78.01841587930589,
    height_m: 0.456,
    aspect: 1.7777777777777777
  },
  frames: [
    { t: 0.0, x: 0.0, y: 0.0, yaw: 0.0, v: 0.0 },
    { t: 1.0, x: 0.0, y: 0.0, yaw: 0.0, v: 0.0 },
    { t: 2.0, x: 0.0, y: 0.0, yaw: -0.0001, v: -0.001 },
    { t: 3.0, x: 0.0, y: 0.0, yaw: -0.0001, v: 0.001 },
    { t: 4.0, x: 0.001, y: 0.0, yaw: -0.0001, v: 0.006 },
    { t: 5.0, x: -0.002, y: 0.0, yaw: -0.0003, v: 0.001 },
    { t: 6.0, x: -0.003, y: 0.0, yaw: -0.0002, v: 0.0 },
    { t: 7.0, x: -0.003, y: 0.0, yaw: -0.0002, v: 0.0 },
    { t: 8.0, x: 0.194, y: 0.007, yaw: 0.0827, v: 0.567 },
    { t: 9.0, x: 1.078, y: 0.175, yaw: 0.2188, v: 1.063 },
    { t: 10.0, x: 2.568, y: 0.666, yaw: 0.4077, v: 1.819 },
    { t: 11.0, x: 4.692, y: 1.53, yaw: 0.3311, v: 2.494 },
    { t: 12.0, x: 7.097, y: 2.313, yaw: 0.2675, v: 2.131 },
    { t: 13.0, x: 9.18, y: 2.917, yaw: 0.2588, v: 2.399 },
    { t: 14.0, x: 11.589, y: 3.446, yaw: 0.2051, v: 2.56 },
    { t: 15.0, x: 14.074, y: 3.854, yaw: 0.0873, v: 2.28 },
    { t: 16.0, x: 16.445, y: 4.002, yaw: 0.095, v: 1.872 },
    { t: 17.0, x: 17.957, y: 4.824, yaw: 0.7328, v: 2.241 },
    { t: 18.0, x: 19.222, y: 6.826, yaw: 1.3547, v: 1.895 }
  ]
};

let trajData = FALLBACK_TRAJ;
let pitchDeg = -2.0;

// ============================================================================
// Renderer, Scene & Camera Setup
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010204);
scene.fog = new THREE.FogExp2(0x010204, 0.0028);

const robotCamera = new THREE.PerspectiveCamera(
  78.01841587930589,
  1.7777777777777777,
  0.05,
  260
);
robotCamera.rotation.order = 'YXZ';

const chaseCamera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  260
);

// ============================================================================
// Post-Processing (Selective HDR Bloom + Camera Sensor / Lens Shader)
// ============================================================================
const renderPass = new RenderPass(scene, robotCamera);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.42, // strength
  0.38, // radius
  0.92  // threshold: only HDR emissive lights > 0.92 bloom
);

const CameraLookShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0.0 },
    uSpeed: { value: 0.0 },
    uIsRobotCam: { value: 1.0 },
    uOrbAlpha: { value: 1.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uSpeed;
    uniform float uIsRobotCam;
    uniform float uOrbAlpha;
    varying vec2 vUv;

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec2 uv = vUv;
      vec2 centered = uv - 0.5;
      float r2 = dot(centered, centered);

      // Subtle wide-angle chromatic dispersion near edges
      float ca = r2 * 0.0036 * uIsRobotCam;
      vec3 col;
      col.r = texture2D(tDiffuse, uv + centered * ca).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - centered * ca).b;

      // Directional radial motion blur on ground when robot moves at speed
      float motionFactor = clamp(uSpeed / 2.1, 0.0, 1.0) * uIsRobotCam;
      float groundMask = smoothstep(0.49, 0.05, uv.y);
      float edgeMask = smoothstep(0.10, 0.48, r2);
      float blurAmt = (motionFactor * groundMask * 0.022) + (edgeMask * 0.0024 * uIsRobotCam);

      if (blurAmt > 0.0002) {
        vec2 dir = normalize(uv - vec2(0.5, 0.52) + vec2(0.0001));
        vec3 acc = col * 0.30;
        acc += texture2D(tDiffuse, clamp(uv + dir * blurAmt * 0.45, 0.001, 0.999)).rgb * 0.24;
        acc += texture2D(tDiffuse, clamp(uv - dir * blurAmt * 0.45, 0.001, 0.999)).rgb * 0.24;
        acc += texture2D(tDiffuse, clamp(uv + dir * blurAmt * 0.95, 0.001, 0.999)).rgb * 0.11;
        acc += texture2D(tDiffuse, clamp(uv - dir * blurAmt * 0.95, 0.001, 0.999)).rgb * 0.11;
        col = acc;
      }

      // Subtle lens dust orb near top-center (u=0.538, v_top=0.062 -> uv.y=0.938)
      if (uIsRobotCam > 0.5 && uOrbAlpha > 0.01) {
        vec2 orbPos = vec2(0.538, 0.938);
        vec2 dOrb = (uv - orbPos) * vec2(1.7778, 1.0);
        float distOrb = length(dOrb);
        float orb = smoothstep(0.046, 0.018, distOrb) * (0.60 + 0.40 * smoothstep(0.015, 0.042, distOrb));
        col += vec3(0.055, 0.052, 0.048) * orb * uOrbAlpha;
      }

      // Wide-angle vignette
      float vig = 1.0 - r2 * (0.35 * uIsRobotCam + 0.10);
      col *= clamp(vig, 0.68, 1.0);

      // Contrast & color grade matching real night camera sensor
      col = pow(max(col, vec3(0.0)), vec3(1.02, 1.01, 0.99));

      // Subtle sensor noise
      float n = hash12(uv * vec2(1280.0, 720.0) + vec2(uTime * 37.0, uTime * 19.0)) - 0.5;
      col += n * 0.015;

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }
  `
};

const cameraLookPass = new ShaderPass(CameraLookShader);
const outputPass = new OutputPass();

const composer = new EffectComposer(renderer);
composer.addPass(renderPass);
composer.addPass(bloomPass);
composer.addPass(cameraLookPass);
composer.addPass(outputPass);

// ============================================================================
// Procedural Texture Generators (Canvas Only)
// ============================================================================
function createSeededRandom(seed = 12345) {
  let s = seed >>> 0;
  return function() {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function hdrColor(hex, mult = 1.0) {
  const c = new THREE.Color(hex);
  c.multiplyScalar(mult);
  return c;
}

// 1. Concrete Sidewalk Texture
function createSidewalkTextures() {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(101);

  ctx.fillStyle = '#828b96';
  ctx.fillRect(0, 0, size, size);

  // Weathering blotches & grime
  for (let i = 0; i < 1200; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const r = 6 + rng() * 50;
    const v = Math.floor(85 + rng() * 65);
    ctx.fillStyle = `rgba(${v},${v + 4},${v + 8},0.08)`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Broom finish streaks & subtle tire marks
  for (let i = 0; i < 4200; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const len = 18 + rng() * 65;
    const v = rng() > 0.48 ? 148 : 80;
    ctx.strokeStyle = `rgba(${v},${v + 3},${v + 6},0.065)`;
    ctx.lineWidth = 1 + rng() * 1.6;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len * 0.85, y + len * 0.35);
    ctx.stroke();
  }

  // Fine aggregate grain
  const imgData = ctx.getImageData(0, 0, size, size);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (rng() - 0.5) * 26;
    data[i] = Math.min(255, Math.max(0, data[i] + n));
    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n));
    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n));
  }
  ctx.putImageData(imgData, 0, 0);

  // Subtle concrete joint lines
  ctx.strokeStyle = 'rgba(28, 32, 38, 0.45)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, size * 0.52);
  ctx.lineTo(size, size * 0.49);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// 2. Yellow Tactile Warning Pad Texture + Bump Map
function createTactilePadTextures() {
  const w = 1024, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  const b = document.createElement('canvas');
  b.width = w; b.height = h;
  const bctx = b.getContext('2d');

  const rng = createSeededRandom(202);

  ctx.fillStyle = '#9c7823';
  ctx.fillRect(0, 0, w, h);

  bctx.fillStyle = '#707070';
  bctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 750; i++) {
    const x = rng() * w;
    const y = rng() * h;
    const r = 8 + rng() * 44;
    const dark = rng() > 0.32;
    ctx.fillStyle = dark ? 'rgba(34, 25, 8, 0.16)' : 'rgba(198, 160, 62, 0.11)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(26, 20, 8, 0.75)';
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, w - 8, h - 8);

  const tileCols = 4;
  for (let i = 1; i < tileCols; i++) {
    const tx = (w / tileCols) * i;
    ctx.strokeStyle = 'rgba(22, 16, 6, 0.90)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(tx, 0);
    ctx.lineTo(tx, h);
    ctx.stroke();

    bctx.strokeStyle = '#202020';
    bctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(tx, 0);
    ctx.lineTo(tx, h);
    ctx.stroke();
  }

  const cols = 42;
  const rows = 15;
  const dx = (w - 28) / cols;
  const dy = (h - 28) / rows;
  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      const cx = 14 + (col + 0.5) * dx;
      const cy = 14 + (r + 0.5) * dy;
      const rad = Math.min(dx, dy) * 0.31;

      ctx.fillStyle = 'rgba(24, 18, 5, 0.88)';
      ctx.beginPath();
      ctx.arc(cx + 1.4, cy + 1.8, rad * 1.18, 0, Math.PI * 2);
      ctx.fill();

      const grad = ctx.createRadialGradient(cx - 1.8, cy - 1.8, rad * 0.1, cx, cy, rad);
      grad.addColorStop(0, '#d8b04c');
      grad.addColorStop(0.55, '#a88228');
      grad.addColorStop(1, '#4c380c');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fill();

      const bgrad = bctx.createRadialGradient(cx, cy, rad * 0.15, cx, cy, rad * 1.05);
      bgrad.addColorStop(0, '#ffffff');
      bgrad.addColorStop(0.65, '#c4c4c4');
      bgrad.addColorStop(1, '#585858');
      bctx.fillStyle = bgrad;
      ctx.beginPath();
      bctx.arc(cx, cy, rad, 0, Math.PI * 2);
      bctx.fill();
    }
  }

  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = 16;

  const bumpMap = new THREE.CanvasTexture(b);
  bumpMap.anisotropy = 16;

  return { map, bumpMap };
}

// 3. Realistic Urban Asphalt Road Texture
function createAsphaltTextures() {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(303);

  ctx.fillStyle = '#4e5259';
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 900; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const rx = 20 + rng() * 90;
    const ry = 12 + rng() * 55;
    const v = Math.floor(55 + rng() * 48);
    ctx.fillStyle = `rgba(${v},${v + 2},${v + 5},0.10)`;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rng() * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < 3600; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const len = 45 + rng() * 150;
    const v = rng() > 0.46 ? 98 : 42;
    ctx.strokeStyle = `rgba(${v},${v + 3},${v + 6},0.065)`;
    ctx.lineWidth = 1.5 + rng() * 3.0;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y + (rng() - 0.5) * 10);
    ctx.stroke();
  }

  const imgData = ctx.getImageData(0, 0, size, size);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (rng() - 0.5) * 22;
    data[i] = Math.min(255, Math.max(0, data[i] + n));
    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n));
    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n));
  }
  ctx.putImageData(imgData, 0, 0);

  ctx.strokeStyle = 'rgba(22, 24, 28, 0.55)';
  ctx.lineWidth = 2.2;
  for (let k = 0; k < 9; k++) {
    let cx = rng() * size;
    let cy = rng() * size;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    for (let s = 0; s < 10; s++) {
      cx += (rng() - 0.25) * 50;
      cy += (rng() - 0.5) * 35;
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  const map = new THREE.CanvasTexture(c);
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(6, 6);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = 16;

  return { map };
}

// 4. Manhole & Utility Lid Textures
function createManholeTexture(style = 'iron') {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2, r = size * 0.43;

  ctx.clearRect(0, 0, size, size);

  if (style === 'fg_lid') {
    ctx.fillStyle = 'rgba(5, 7, 10, 0.98)';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#6c7c82';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#20262c';
    ctx.beginPath();
    ctx.arc(cx - 14, cy + 10, r * 0.36, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#8fa0a8';
    ctx.beginPath();
    ctx.arc(cx + 18, cy - 8, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const isDark = (style === 'dark');
    const outerGrad = ctx.createRadialGradient(cx, cy, r * 0.78, cx, cy, r * 1.12);
    outerGrad.addColorStop(0, 'rgba(8,10,14,0.96)');
    outerGrad.addColorStop(1, 'rgba(8,10,14,0)');
    ctx.fillStyle = outerGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = isDark ? '#14171c' : '#323842';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.90, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = isDark ? '#242932' : '#4a5260';
    ctx.lineWidth = 4;
    for (let k = 1; k <= 3; k++) {
      ctx.beginPath();
      ctx.arc(cx, cy, r * (0.27 * k), 0, Math.PI * 2);
      ctx.stroke();
    }
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r * 0.25, cy + Math.sin(ang) * r * 0.25);
      ctx.lineTo(cx + Math.cos(ang) * r * 0.86, cy + Math.sin(ang) * r * 0.86);
      ctx.stroke();
    }
  }

  const tex = new THREE.CanvasTexture(c);

}

// 5. Signage Texture Generator
function createSignTexture({ text, bgColor, textColor, glowColor, width = 512, height = 128, font = 'bold 76px Arial, sans-serif', drawHyundaiLogo = false, border = null }) {
  const c = document.createElement('canvas');
  c.width = width;
  c.height = height;
  const ctx = c.getContext('2d');

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, width, height);

  if (border) {
    ctx.strokeStyle = border;
    ctx.lineWidth = 6;
    ctx.strokeRect(4, 4, width - 8, height - 8);
  }

  ctx.save();
  if (glowColor) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 18;
  }
  ctx.fillStyle = textColor;
  ctx.font = font;
  ctx.textBaseline = 'middle';

  if (drawHyundaiLogo) {
    const lx = width * 0.17;
    const ly = height * 0.5;
    ctx.strokeStyle = '#75b5ff';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.ellipse(lx, ly, 46, 26, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(lx - 20, ly + 18);
    ctx.lineTo(lx - 10, ly - 18);
    ctx.moveTo(lx + 10, ly + 18);
    ctx.lineTo(lx + 20, ly - 18);
    ctx.moveTo(lx - 15, ly);
    ctx.lineTo(lx + 15, ly);
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillText(text, width * 0.30, height * 0.52);
  } else {
    ctx.textAlign = 'center';
    ctx.fillText(text, width * 0.5, height * 0.52);
    ctx.shadowBlur = 4;
    ctx.fillText(text, width * 0.5, height * 0.52);
  }
  ctx.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// 6. Tall High-Rise Residential Tower Texture
function createHighRiseTexture() {
  const w = 512, h = 1024;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(606);

  ctx.fillStyle = '#484344';
  ctx.fillRect(0, 0, w, h);

  const cols = 5;
  const colW = w / cols;
  for (let i = 0; i <= cols; i++) {
    ctx.fillStyle = '#565052';
    ctx.fillRect(i * colW - 8, 0, 16, h);
  }

  const floors = 28;
  const floorH = h / floors;
  for (let r = 0; r < floors; r++) {
    const y = r * floorH;
    ctx.fillStyle = '#524c4e';
    ctx.fillRect(0, y, w, 6);

    for (let col = 0; col < cols; col++) {
      const x = col * colW + 9;
      const ww = colW - 18;
      const wh = floorH - 9;

      const isLit = (col === 2 && (r === 21 || r === 22 || r === 15 || r === 4)) || (rng() > 0.96);
      if (isLit) {
        ctx.fillStyle = rng() > 0.35 ? '#b47870' : '#be9878';
      } else {
        ctx.fillStyle = '#111216';
      }
      ctx.fillRect(x, y + 6, ww, wh);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 7. Showroom Ceiling Downlights Texture
function createShowroomCeilingTexture() {
  const w = 512, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#c8ae96';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(90, 75, 62, 0.28)';
  ctx.lineWidth = 2;
  const step = 32;
  for (let i = 0; i <= w; i += step) {
    ctx.beginPath();
    ctx.moveTo(i, 0); ctx.lineTo(i, h);
    ctx.moveTo(0, i); ctx.lineTo(w, i);
    ctx.stroke();
  }

  for (let y = 24; y < h; y += 48) {
    for (let x = 24; x < w; x += 48) {
      const g = ctx.createRadialGradient(x, y, 1, x, y, 10);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.45, '#ffeed8');
      g.addColorStop(1, 'rgba(200,174,150,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(7, 2);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const padSegX = 24, padSegZ = 48;
const padGeo = new THREE.BufferGeometry();
const padPos = [];
const padUvs = [];
const padIdx = [];

function evalPadPoint(u, v) {
  const xNear = 0.915 * Math.pow(1 - u, 2) + 2 * 0.72 * (1 - u) * u + 0.39 * u * u;
  const zNear = -0.665 * Math.pow(1 - u, 2) + 2 * (-0.11) * (1 - u) * u + 0.29 * u * u;

  const xFar = 1.35 * Math.pow(1 - u, 2) + 2 * 1.16 * (1 - u) * u + 0.68 * u * u;
  const zFar = -0.56 * Math.pow(1 - u, 2) + 2 * 0.35 * (1 - u) * u + 0.98 * u * u;

  const x = THREE.MathUtils.lerp(xNear, xFar, v);
  const z = THREE.MathUtils.lerp(zNear, zFar, v);
  const y = 0.002 + Math.sin(v * Math.PI) * 0.0015;
  return { x, y, z };
}

for (let iz = 0; iz <= padSegZ; iz++) {
  const u = iz / padSegZ;
  for (let ix = 0; ix <= padSegX; ix++) {
    const v = ix / padSegX;
    const p = evalPadPoint(u, v);
    padPos.push(p.x, p.y, p.z);
    padUvs.push(u, v);
  }
}
for (let iz = 0; iz < padSegZ; iz++) {
  for (let ix = 0; ix < padSegX; ix++) {
    const a = iz * (padSegX + 1) + ix;
    const b = a + 1;
    const c = (iz + 1) * (padSegX + 1) + ix;
    const d = c + 1;
    padIdx.push(a, c, b, b, c, d);
  }
}
padGeo.setAttribute('position', new THREE.Float32BufferAttribute(padPos, 3));
padGeo.setAttribute('uv', new THREE.Float32BufferAttribute(padUvs, 2));
padGeo.setIndex(padIdx);

function createShowroomCar(colorHex, highlightHex, isSUV = false) {
  const car = new THREE.Group();

  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0, highlightHex);
  g.addColorStop(0.35, colorHex);
  g.addColorStop(0.50, '#ffffff');
  g.addColorStop(0.60, colorHex);
  g.addColorStop(1, '#121418');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 128);
  const bodyTex = new THREE.CanvasTexture(c);
  bodyTex.colorSpace = THREE.SRGBColorSpace;

  const bodyMat = new THREE.MeshBasicMaterial({ map: bodyTex });

  const gc = document.createElement('canvas');
  gc.width = 128; gc.height = 64;
  const gctx = gc.getContext('2d');
  const gg = gctx.createLinearGradient(0, 0, 128, 64);
  gg.addColorStop(0, '#2a323d');
  gg.addColorStop(0.45, '#8a98a8');
  gg.addColorStop(0.55, '#c8d4e0');
  gg.addColorStop(0.70, '#222832');
  gg.addColorStop(1, '#141820');
  gctx.fillStyle = gg;
  gctx.fillRect(0, 0, 128, 64);
  const glassTex = new THREE.CanvasTexture(gc);
  glassTex.colorSpace = THREE.SRGBColorSpace;
  const glassMat = new THREE.MeshBasicMaterial({ map: glassTex });

  const lower = new THREE.Mesh(new THREE.BoxGeometry(4.1, isSUV ? 0.64 : 0.54, 1.74), bodyMat);
  lower.position.y = isSUV ? 0.54 : 0.46;
  car.add(lower);

  const frontSlope = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.35, 1.66), bodyMat);
  frontSlope.position.set(1.2, isSUV ? 0.82 : 0.70, 0);
  frontSlope.rotation.z = -0.32;
  car.add(frontSlope);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(isSUV ? 2.3 : 1.9, isSUV ? 0.52 : 0.44, 1.48),
    glassMat
  );
  cabin.position.set(isSUV ? -0.25 : -0.15, isSUV ? 1.02 : 0.86, 0);
  car.add(cabin);

  const hl = new THREE.Mesh(
    new THREE.BoxGeometry(0.14, 0.12, 1.45),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  hl.position.set(2.02, 0.56, 0);
  car.add(hl);

  const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 16);
  wheelGeo.rotateX(Math.PI / 2);
  const wheelMat = new THREE.MeshBasicMaterial({ color: 0x14161a });
  const rimMat = new THREE.MeshBasicMaterial({ color: 0x9aa4b2 });
  for (const wx of [-1.28, 1.28]) {
    for (const wz of [-0.82, 0.82]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.position.set(wx, 0.32, wz);
      car.add(w);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.20, 0.24, 12), rimMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.set(wx, 0.32, wz);
      car.add(rim);
    }
  }
  return car;
}

// ============================================================================
// What-If Dynamic Actors: Articulated Pedestrian & E-Scooter Rider
// ============================================================================
function buildPedestrianActor() {
  const root = new THREE.Group();

  const skinMat = new THREE.MeshStandardMaterial({ color: 0xd8a484, roughness: 0.65 });
  const hairMat = new THREE.MeshStandardMaterial({ color: 0x1e1814, roughness: 0.85 });
  const jacketMat = new THREE.MeshStandardMaterial({ color: 0x3b6ea5, roughness: 0.62 });
  const trimMat = new THREE.MeshStandardMaterial({
    color: 0xe6eef8,
    emissive: 0x445566,
    emissiveIntensity: 0.35,
    roughness: 0.40
  });
  const shirtMat = new THREE.MeshStandardMaterial({ color: 0xe8ecf2, roughness: 0.70 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x262b34, roughness: 0.78 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0x1c2026, roughness: 0.65 });
  const soleMat = new THREE.MeshStandardMaterial({ color: 0xf0f4f8, roughness: 0.50 });

  // Pelvis pivot at hip height (~0.94 m)
  const pelvis = new THREE.Group();
  pelvis.position.set(0, 0.94, 0);
  root.add(pelvis);

  const hipBlock = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.14, 0.32), pantsMat);
  pelvis.add(hipBlock);

  // Torso pivot
  const torso = new THREE.Group();
  torso.position.set(0, 0.06, 0);
  pelvis.add(torso);

  const chestMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.48, 0.38), jacketMat);
  chestMesh.position.set(0, 0.25, 0);
  torso.add(chestMesh);

  // Inner shirt stripe & reflective safety chest bands
  const innerShirt = new THREE.Mesh(new THREE.BoxGeometry(0.256, 0.45, 0.10), shirtMat);
  innerShirt.position.set(0.004, 0.25, 0);
  torso.add(innerShirt);

  const chestTrim = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.045, 0.39), trimMat);
  chestTrim.position.set(0, 0.32, 0);
  torso.add(chestTrim);

  // Neck & Head (~1.71 m total height)
  const neck = new THREE.Group();
  neck.position.set(0, 0.52, 0);
  torso.add(neck);

  const neckCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.062, 0.09, 12), skinMat);
  neckCyl.position.y = 0.03;
  neck.add(neckCyl);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.115, 16, 14), skinMat);
  head.scale.set(1.0, 1.15, 0.95);
  head.position.set(0.01, 0.15, 0);
  neck.add(head);

  const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), hairMat);
  hairCap.scale.set(1.02, 1.05, 0.98);
  hairCap.position.set(-0.008, 0.175, 0);
  neck.add(hairCap);

  // Articulated Arms (local +X is forward walking direction, local Z is left/right)
  function createArm(sideSign) {
    const shoulder = new THREE.Group();
    shoulder.position.set(0, 0.44, sideSign * 0.23);
    torso.add(shoulder);

    const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.045, 0.28, 12), jacketMat);
    upperArm.position.y = -0.13;
    shoulder.add(upperArm);

    const cuffBand = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.048, 0.035, 12), trimMat);
    cuffBand.position.y = -0.22;
    shoulder.add(cuffBand);

    const elbow = new THREE.Group();
    elbow.position.set(0, -0.27, 0);
    shoulder.add(elbow);

    const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.043, 0.036, 0.25, 12), jacketMat);
    forearm.position.y = -0.12;
    elbow.add(forearm);

    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), skinMat);
    hand.scale.set(1.1, 1.3, 0.8);
    hand.position.y = -0.26;
    elbow.add(hand);

    return { shoulder, elbow };
  }

  const leftArm = createArm(-1);
  const rightArm = createArm(1);

  // Articulated Legs
  function createLeg(sideSign) {
    const hip = new THREE.Group();
    hip.position.set(0, -0.02, sideSign * 0.105);
    pelvis.add(hip);

    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.058, 0.43, 12), pantsMat);
    thigh.position.y = -0.21;
    hip.add(thigh);

    const knee = new THREE.Group();
    knee.position.set(0, -0.43, 0);
    hip.add(knee);

    const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.056, 0.044, 0.42, 12), pantsMat);
    shin.position.y = -0.21;
    knee.add(shin);

    const ankle = new THREE.Group();
    ankle.position.set(0, -0.43, 0);
    knee.add(ankle);

    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.075, 0.10), shoeMat);
    shoe.position.set(0.045, -0.025, 0);
    ankle.add(shoe);

    const sole = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.024, 0.105), soleMat);
    sole.position.set(0.045, -0.062, 0);
    ankle.add(sole);

    return { hip, knee, ankle };
  }

  const leftLeg = createLeg(-1);
  const rightLeg = createLeg(1);

  root.userData = {
    pelvis,
    torso,
    neck,
    leftArm,
    rightArm,
    leftLeg,
    rightLeg
  };
  return root;
}

// ============================================================================
// Trajectory Interpolation, Arc-Length Table & MuJoCo Physics Integration
// ============================================================================
let arcTable = [];
let curbEdgeInfo = {
  t_e: 9.135,
  s_e: 1.28,
  x_e: 1.28,
  y_e: 0.24,
  yaw_e: 0.245
};
let mujocoData = null;

function getPoseAtTime(t) {
  const frames = trajData.frames;
  if (!frames || frames.length === 0) {
    return { x: 0, y: 0, yaw: 0, v: 0 };
  }
  const clampedT = Math.max(frames[0].t, Math.min(t, frames[frames.length - 1].t));

  let idx = 0;
  for (let i = 0; i < frames.length - 1; i++) {
    if (clampedT >= frames[i].t && clampedT <= frames[i + 1].t) {
      idx = i;
      break;
    }
  }

  const f0 = frames[idx];
  const f1 = frames[Math.min(idx + 1, frames.length - 1)];
  const dt = f1.t - f0.t;
  const alpha = dt > 1e-6 ? (clampedT - f0.t) / dt : 0.0;

  let dyaw = f1.yaw - f0.yaw;
  while (dyaw > Math.PI) dyaw -= Math.PI * 2;
  while (dyaw < -Math.PI) dyaw += Math.PI * 2;

  return {
    x: THREE.MathUtils.lerp(f0.x, f1.x, alpha),
    y: THREE.MathUtils.lerp(f0.y, f1.y, alpha),
    yaw: f0.yaw + dyaw * alpha,
    v: THREE.MathUtils.lerp(f0.v || 0, f1.v || 0, alpha)
  };
}

function buildArcLengthTable() {
  arcTable = [];
  const frames = trajData.frames;
  if (!frames || frames.length === 0) return;

  const tMin = frames[0].t;
  const tMax = frames[frames.length - 1].t;
  const dt = 0.02;
  let s = 0.0;
  let prev = getPoseAtTime(tMin);
  arcTable.push({ t: tMin, s: 0.0, x: prev.x, y: prev.y, yaw: prev.yaw, v: prev.v });

  for (let t = tMin + dt; t <= tMax + 1e-6; t += dt) {
    const clampedT = Math.min(t, tMax);
    const cur = getPoseAtTime(clampedT);
    s += Math.hypot(cur.x - prev.x, cur.y - prev.y);
    arcTable.push({ t: clampedT, s, x: cur.x, y: cur.y, yaw: cur.yaw, v: cur.v });
    prev = cur;
  }

  // Locate curb edge crossing (x = 1.28 m along recorded path)
  const targetEdgeX = 1.28;
  for (let i = 0; i < arcTable.length - 1; i++) {
    if (arcTable[i].x <= targetEdgeX && arcTable[i + 1].x >= targetEdgeX) {
      const f = (targetEdgeX - arcTable[i].x) / Math.max(1e-6, arcTable[i + 1].x - arcTable[i].x);
      const t_e = THREE.MathUtils.lerp(arcTable[i].t, arcTable[i + 1].t, f);
      const s_e = THREE.MathUtils.lerp(arcTable[i].s, arcTable[i + 1].s, f);
      const poseE = getPoseAtTime(t_e);
      curbEdgeInfo = {
        t_e,
        s_e,
        x_e: poseE.x,
        y_e: poseE.y,
        yaw_e: poseE.yaw
      };
      break;
    }
  }
}

function getArcLengthAtTime(t) {
  if (arcTable.length === 0) return 0;
  if (t <= arcTable[0].t) return arcTable[0].s;
  if (t >= arcTable[arcTable.length - 1].t) return arcTable[arcTable.length - 1].s;
  const idx = Math.min(
    arcTable.length - 2,
    Math.max(0, Math.floor((t - arcTable[0].t) / 0.02))
  );
  const a0 = arcTable[idx];
  const a1 = arcTable[idx + 1];
  const f = (t - a0.t) / Math.max(1e-6, a1.t - a0.t);
  return THREE.MathUtils.lerp(a0.s, a1.s, f);
}

function getTimeAtArcLength(targetS) {
  if (arcTable.length === 0) return 0;
  if (targetS <= 0) return arcTable[0].t;
  if (targetS >= arcTable[arcTable.length - 1].s) return arcTable[arcTable.length - 1].t;
  let lo = 0;
  let hi = arcTable.length - 1;
  while (lo + 1 < hi) {
    const mid = (lo + hi) >> 1;
    if (arcTable[mid].s <= targetS) lo = mid;
    else hi = mid;
  }
  const a0 = arcTable[lo];
  const a1 = arcTable[hi];
  const f = (targetS - a0.s) / Math.max(1e-6, a1.s - a0.s);
  return THREE.MathUtils.lerp(a0.t, a1.t, f);
}

// ============================================================================
// Fallback MuJoCo Physics Generator (Used only if JSON fetch is unavailable)
// ============================================================================
function createFallbackMujocoData(mode) {
  const curb_height = 0.20;
  const frames = [];
  if (mode === 'recorded') {
    const edge_t = 1.0;
    const zBase = 0.095;
    for (let i = 0; i <= 140; i++) {
      const t = +(i * 0.02).toFixed(4);
      let x, y = 0, z, pitch = 0, roll = 0, yaw = 0;
      if (t <= edge_t) {
        x = (t - edge_t) * 1.35;
        z = curb_height + zBase;
      } else {
        const dt = t - edge_t;
        if (dt < 0.42) {
          const u = dt / 0.42;
          x = dt * 1.32;
          z = curb_height + zBase - 0.16 * u * u;
          pitch = 1.85 * Math.pow(u, 1.4); // Nose pitches sharply down over vertical 0.20m curb
          roll = 0.15 * u;
        } else if (dt < 0.95) {
          const u = (dt - 0.42) / 0.53;
          x = 0.55 + u * 0.45;
          const bounce = Math.sin(u * Math.PI) * 0.06;
          z = THREE.MathUtils.lerp(0.135, 0.24, u) + bounce;
          pitch = THREE.MathUtils.lerp(1.85, Math.PI - 0.04, u); // Flips onto roof
          roll = THREE.MathUtils.lerp(0.15, 0.22, u);
          yaw = -0.14 * u;
          y = -0.05 * u;
        } else {
          const u = Math.min(1, (dt - 0.95) / 0.65);
          const settle = Math.exp(-u * 5.0) * Math.sin(u * 14.0) * 0.04;
          x = 1.00 + 0.08 * (1 - Math.exp(-u * 4.0));
          y = -0.05;
          z = 0.24 + Math.abs(settle) * 0.3;
          pitch = Math.PI - 0.04 + settle;
          roll = 0.22 - settle * 0.5;
          yaw = -0.14;
        }
      }
      // Convert ZYX / Euler in MuJoCo (x-forward, y-left, z-up: pitch is +y rotation)
      const qThree = new THREE.Quaternion().setFromEuler(new THREE.Euler(roll, yaw, -pitch, 'YXZ'));
      // Inverse map from Three (qx, qz, -qy, w) -> MuJoCo [w, qx, qy, qz]
      const q = [qThree.w, qThree.x, -qThree.z, qThree.y];
      frames.push({ t, p: [x, y, z], q });
    }
    return { meta: { edge_t, world: { curb_height } }, frames };
  } else {
    // policy === 'safe': slows down, carefully drops down the curb upright, and continues
    const edge_t = 1.30;
    const zBase = 0.095;
    for (let i = 0; i <= 150; i++) {
      const t = +(i * 0.02).toFixed(4);
      let x, y = 0, z, pitch = 0, roll = 0;
      if (t <= edge_t) {
        x = (t - edge_t) * 0.72;
        z = curb_height + zBase;
      } else {
        const dt = t - edge_t;
        if (dt < 0.55) {
          const u = dt / 0.55;
          x = dt * 0.68;
          z = curb_height + zBase - curb_height * (3 * u * u - 2 * u * u * u);
          pitch = Math.sin(u * Math.PI) * 0.36; // Controlled 20-deg pitch down then level
          roll = Math.sin(u * Math.PI * 2) * 0.03;
        } else {
          const dt2 = dt - 0.55;
          const damp = Math.exp(-dt2 * 6.0) * Math.sin(dt2 * 16.0);
          x = 0.374 + dt2 * 1.25;
          z = zBase + Math.abs(damp) * 0.01;
          pitch = damp * 0.06;
          roll = damp * 0.02;
        }
      }
      const qThree = new THREE.Quaternion().setFromEuler(new THREE.Euler(roll, 0, -pitch, 'YXZ'));
      const q = [qThree.w, qThree.x, -qThree.z, qThree.y];
      frames.push({ t, p: [x, y, z], q });
    }
    return { meta: { edge_t, world: { curb_height } }, frames };
  }
}

// ============================================================================
// Safe Policy Re-Timing & Recorded Policy Contact Jolt Helpers
// ============================================================================
function getSafeEffectiveTime(t, conflictT, stopMarginMeters, resumeRealT) {
  const sConflict = getArcLengthAtTime(conflictT);
  const sStop = Math.max(0, sConflict - stopMarginMeters);
  const tRecStop = getTimeAtArcLength(sStop);

  // Robot arrives at the stop point 0.55s before conflictT
  const tStopArrive = Math.max(tRecStop + 0.35, conflictT - 0.55);
  const tDecDuration = 2.0 * (tStopArrive - tRecStop);
  const tBrakeStart = tStopArrive - tDecDuration;
  const tAccDuration = 1.20;

  if (t <= tBrakeStart) {
    return { tEff: t, speedScale: 1.0 };
  } else if (t < tStopArrive) {
    const u = (t - tBrakeStart) / Math.max(1e-6, tDecDuration);
    const tEff = tBrakeStart + tDecDuration * (u - 0.5 * u * u);
    return { tEff, speedScale: 1.0 - u };
  } else if (t <= resumeRealT) {
    return { tEff: tRecStop, speedScale: 0.0 };
  } else if (t < resumeRealT + tAccDuration) {
    const w = (t - resumeRealT) / tAccDuration;
    const tEff = tRecStop + 0.5 * tAccDuration * w * w;
    return { tEff, speedScale: w };
  } else {
    const tEff = tRecStop + 0.5 * tAccDuration + (t - (resumeRealT + tAccDuration));
    return { tEff, speedScale: 1.0 };
  }
}

function getRecordedContactJolt(t, conflictT, scenarioName) {
  if (t < conflictT) {
    return { active: false, dx: 0, dz: 0, dyaw: 0, dpitch: 0, droll: 0, speedMult: 1.0 };
  }
  const dt = t - conflictT;
  const u = Math.min(1.0, dt / 0.32);
  const shoveEnv = 1.0 - Math.pow(1.0 - u, 3);
  const wave = Math.sin(dt * 24.0) * Math.exp(-dt * 6.5);
  const speedMult = Math.max(0.0, 1.0 - dt * 5.0);

  if (scenarioName === 'truck_runs_light') {
    // Shoved to the right (+Z) and slightly back (-X) by the red pickup
    return {
      active: true,
      dx: -0.18 * shoveEnv,
      dz: 0.38 * shoveEnv,
      dyaw: -0.19 * shoveEnv + wave * 0.04,
      dpitch: -0.05 * shoveEnv + wave * 0.08,
      droll: 0.10 * shoveEnv + wave * 0.14,
      speedMult
    };
  } else if (scenarioName === 'pedestrian_steps_out') {
    // Short recoil jolt and stop when bumping the pedestrian
    return {
      active: true,
      dx: -0.16 * shoveEnv,
      dz: 0.07 * shoveEnv,
      dyaw: -0.06 * shoveEnv + wave * 0.025,
      dpitch: -0.04 * shoveEnv + wave * 0.09,
      droll: wave * 0.06,
      speedMult
    };
  } else if (scenarioName === 'scooter_cuts_across') {
    // Shoved diagonally (-X, -Z) by the e-scooter cutting from right to left
    return {
      active: true,
      dx: -0.22 * shoveEnv,
      dz: -0.20 * shoveEnv,
      dyaw: 0.15 * shoveEnv + wave * 0.035,
      dpitch: -0.04 * shoveEnv + wave * 0.08,
      droll: -0.08 * shoveEnv + wave * 0.11,
      speedMult
    };
  }
  return { active: false, dx: 0, dz: 0, dyaw: 0, dpitch: 0, droll: 0, speedMult: 1.0 };
}

let currentTime = 0.0;

function updateSceneAtTime(t) {
  currentTime = t;

  const camHeight = (trajData.camera && trajData.camera.height_m) ? trajData.camera.height_m : 0.456;
  const conflictT = window.scenarioInfo.conflict_t;

  // Reset actors visibility by default
  redPickupRunner.visible = false;
  pedestrianActor.visible = false;
  scooterActor.visible = false;
  robotVisuals.position.set(0, 0, 0);

  let rx = 0, ry = 0, rz = 0, ryaw = 0, rspeed = 0;
  let customQuat = null;
  let joltPitch = 0, joltRoll = 0;
  let zChassisOffset = 0;

  // --------------------------------------------------------------------------
  // 1. Compute Robot Pose Based on Scenario & Policy
  // --------------------------------------------------------------------------
  if (scenario === 'missing_curb_ramp' && mujocoData && mujocoData.frames && mujocoData.frames.length > 0) {
    const mjFrames = mujocoData.frames;
    const edgeT = (mujocoData.meta && typeof mujocoData.meta.edge_t === 'number') ? mujocoData.meta.edge_t : 1.0;
    const curbH = (mujocoData.meta && mujocoData.meta.world && typeof mujocoData.meta.world.curb_height === 'number')
      ? mujocoData.meta.world.curb_height
      : 0.20;
    activeCurbHeight = curbH;

    const { t_e, s_e, x_e, y_e, yaw_e } = curbEdgeInfo;
    const mjStartT = t_e - edgeT;
    const mjFirstT = mjFrames[0].t;
    const mjLastT = mjFrames[mjFrames.length - 1].t;
    const mjDuration = mjLastT - mjFirstT;
    const mjEndRealT = mjStartT + mjDuration;

    // Height of MuJoCo body origin above the sidewalk at frame 0
    const z0 = mjFrames[0].p[2];
    zChassisOffset = z0 - curbH;

    if (t < mjStartT) {
      const pose = getPoseAtTime(t);
      rx = pose.x;
      rz = -pose.y;
      ryaw = pose.yaw;
      ry = 0.0;
      rspeed = Math.abs(pose.v);
    } else if (t <= mjEndRealT || policy === 'recorded') {
      // Interpolate MuJoCo frame (clamped at end for policy=recorded so it stays where it flipped)
      const queryMjT = Math.max(mjFirstT, Math.min(mjFirstT + (t - mjStartT), mjLastT));
      let idx = 0;
      for (let i = 0; i < mjFrames.length - 1; i++) {
        if (queryMjT >= mjFrames[i].t && queryMjT <= mjFrames[i + 1].t) {
          idx = i;
          break;
        }
      }
      if (queryMjT >= mjLastT) idx = Math.max(0, mjFrames.length - 2);

      const f0 = mjFrames[idx];
      const f1 = mjFrames[Math.min(idx + 1, mjFrames.length - 1)];
      const dtMj = f1.t - f0.t;
      const alpha = dtMj > 1e-6 ? THREE.MathUtils.clamp((queryMjT - f0.t) / dtMj, 0, 1) : 0.0;

      const mx = THREE.MathUtils.lerp(f0.p[0], f1.p[0], alpha);
      const my = THREE.MathUtils.lerp(f0.p[1], f1.p[1], alpha);
      const mz = THREE.MathUtils.lerp(f0.p[2], f1.p[2], alpha);

      // Estimate speed from MuJoCo frame delta
      rspeed = (t <= mjEndRealT && dtMj > 1e-6)
        ? Math.hypot(f1.p[0] - f0.p[0], f1.p[1] - f0.p[1]) / dtMj
        : 0.0;

      // Rotate MuJoCo (x, y) by path heading at t_e
      const cosY = Math.cos(yaw_e);
      const sinY = Math.sin(yaw_e);
      const trajX = x_e + mx * cosY - my * sinY;
      const trajY = y_e + mx * sinY + my * cosY;

      let mjRx = trajX;
      let mjRz = -trajY;
      // Shift height so sidewalk heights match (sidewalk top is at y=0 in twin and z=curbH in MuJoCo)
      let mjRy = mz - curbH;

      // Convert MuJoCo quaternion [w, x, y, z] (z-up) -> Three.js quaternion (x, z, -y, w) (y-up)
      const q0 = new THREE.Quaternion(f0.q[1], f0.q[3], -f0.q[2], f0.q[0]).normalize();
      const q1 = new THREE.Quaternion(f1.q[1], f1.q[3], -f1.q[2], f1.q[0]).normalize();
      const qMjYUp = q0.slerp(q1, alpha);

      const qHeading = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw_e);
      const qComposed = qHeading.multiply(qMjYUp);

      // Smoothly blend in over the first 0.25s on the sidewalk so transition at mjStartT is C1 seamless
      const blendIn = THREE.MathUtils.smoothstep(t, mjStartT, mjStartT + 0.25);
      if (blendIn < 1.0) {
        const recPose = getPoseAtTime(t);
        rx = THREE.MathUtils.lerp(recPose.x, mjRx, blendIn);
        rz = THREE.MathUtils.lerp(-recPose.y, mjRz, blendIn);
        ry = THREE.MathUtils.lerp(0.0, mjRy - zChassisOffset, blendIn) + zChassisOffset * blendIn;
        const qRec = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), recPose.yaw);
        customQuat = qRec.slerp(qComposed, blendIn);
      } else {
        rx = mjRx;
        rz = mjRz;
        ry = mjRy;
        customQuat = qComposed;
      }
      ryaw = yaw_e;
    } else {
      // policy === 'safe' after MuJoCo frames end: resume recorded path from matching distance
      const lastF = mjFrames[mjFrames.length - 1];
      const cosY = Math.cos(yaw_e);
      const sinY = Math.sin(yaw_e);
      const endMjRx = x_e + lastF.p[0] * cosY - lastF.p[1] * sinY;
      const endMjRz = -(y_e + lastF.p[0] * sinY + lastF.p[1] * cosY);

      const distPastEdge = Math.max(0, lastF.p[0]);
      const sMatch = s_e + distPastEdge;
      const tMatch = getTimeAtArcLength(sMatch);

      const dtAfter = t - mjEndRealT;
      const tResumeTraj = tMatch + dtAfter;
      const poseAtMatch = getPoseAtTime(tMatch);
      const poseNow = getPoseAtTime(tResumeTraj);

      // Decay any tiny lateral offset between straight MuJoCo rollout and curved path over 0.6s
      const decay = Math.exp(-dtAfter * 3.5);
      const offsetRx = (endMjRx - poseAtMatch.x) * decay;
      const offsetRz = (endMjRz - (-poseAtMatch.y)) * decay;

      rx = poseNow.x + offsetRx;
      rz = -poseNow.y + offsetRz;
      ryaw = poseNow.yaw + (yaw_e - poseAtMatch.yaw) * decay;
      rspeed = Math.abs(poseNow.v);

      // Smoothly transition road height (-curbH) up onto far sidewalk after x > 15.8m
      const farClimb = THREE.MathUtils.smoothstep(rx, 15.6, 17.5);
      ry = THREE.MathUtils.lerp(-curbH, 0.044, farClimb);
      zChassisOffset = 0;
    }
  } else if (
    scenario === 'truck_runs_light' ||
    scenario === 'pedestrian_steps_out' ||
    scenario === 'scooter_cuts_across'
  ) {
    if (policy === 'safe') {
      // Safe policy: slow & yield >= 2.15m (>= 1.5m) before conflict point until actor clears
      const stopMargin = 2.15;
      const resumeMap = {
        truck_runs_light: 13.05,
        pedestrian_steps_out: 15.65,
        scooter_cuts_across: 13.95
      };
      const { tEff, speedScale } = getSafeEffectiveTime(t, conflictT, stopMargin, resumeMap[scenario]);
      const pose = getPoseAtTime(tEff);
      rx = pose.x;
      rz = -pose.y;
      ryaw = pose.yaw;
      rspeed = Math.abs(pose.v) * speedScale;
      ry = THREE.MathUtils.smoothstep(rx, 15.8, 17.5) * 0.044;
    } else {
      // Recorded policy: follow recorded path until conflict_t, then get shoved & stop
      const clampedTrajT = Math.min(t, conflictT);
      const pose = getPoseAtTime(clampedTrajT);
      const jolt = getRecordedContactJolt(t, conflictT, scenario);
      rx = pose.x + jolt.dx;
      rz = -pose.y + jolt.dz;
      ryaw = pose.yaw + jolt.dyaw;
      joltPitch = jolt.dpitch;
      joltRoll = jolt.droll;
      rspeed = Math.abs(pose.v) * jolt.speedMult;
      ry = THREE.MathUtils.smoothstep(rx, 15.8, 17.5) * 0.044;
    }
  } else {
    // Baseline scenario
    const pose = getPoseAtTime(t);
    rx = pose.x;
    rz = -pose.y;
    ryaw = pose.yaw;
    rspeed = Math.abs(pose.v);
    ry = THREE.MathUtils.smoothstep(rx, 15.8, 17.5) * 0.044;
  }

  // --------------------------------------------------------------------------
  // 2. Apply Pose to Robot & Cameras
  // --------------------------------------------------------------------------
  if (customQuat) {
    robotGroup.position.set(rx, ry, rz);
    robotGroup.quaternion.copy(customQuat);
    robotVisuals.position.set(0, -zChassisOffset, 0);

    // Camera mounted in robot frame at (0, camHeight - zChassisOffset, 0)
    const camLocalOffset = new THREE.Vector3(0, camHeight - zChassisOffset, 0).applyQuaternion(customQuat);
    const minCamY = (BASE_ROAD_Y + roadYOffset) + 0.065;
    robotCamera.position.set(
      rx + camLocalOffset.x,
      Math.max(minCamY, ry + camLocalOffset.y),
      rz + camLocalOffset.z
    );
    const qCamMount = new THREE.Quaternion().setFromEuler(
      new THREE.Euler(THREE.MathUtils.degToRad(pitchDeg), -Math.PI / 2, 0, 'YXZ')
    );
    robotCamera.quaternion.copy(customQuat).multiply(qCamMount);
  } else {
    robotGroup.position.set(rx, ry, rz);
    robotGroup.rotation.set(joltRoll, ryaw, joltPitch, 'YXZ');

    robotCamera.position.set(rx, camHeight + ry, rz);
    robotCamera.rotation.order = 'YXZ';
    robotCamera.rotation.y = ryaw - Math.PI / 2;
    robotCamera.rotation.x = THREE.MathUtils.degToRad(pitchDeg) + joltPitch;
    robotCamera.rotation.z = -joltRoll;
  }

  const wheelAngle = (rx * 1.1) / 0.095;
  for (const w of robotWheels) {
    w.rotation.z = -wheelAngle;
  }

  const moveBoost = THREE.MathUtils.smoothstep(t, 8.0, 10.5);
  headlightSpot.intensity = THREE.MathUtils.lerp(13.5, 24.0, moveBoost);

  // Pose Chase Camera (3m behind and 1.45m above the robot)
  const backDist = 3.0;
  const upDist = 1.45;
  const baseGroundY = isMissingCurbRamp ? Math.min(0, ry - zChassisOffset) : ry;
  chaseCamera.position.set(
    rx - Math.cos(ryaw) * backDist,
    baseGroundY + upDist,
    rz + Math.sin(ryaw) * backDist
  );
  chaseCamera.lookAt(
    rx + Math.cos(ryaw) * 1.2,
    baseGroundY + 0.42,
    rz - Math.sin(ryaw) * 1.2
  );

  robotVisuals.visible = (camMode === 'chase');
  renderPass.camera = (camMode === 'chase') ? chaseCamera : robotCamera;

  cameraLookPass.uniforms.uTime.value = t;
  cameraLookPass.uniforms.uSpeed.value = rspeed;
  cameraLookPass.uniforms.uIsRobotCam.value = (camMode === 'robot') ? 1.0 : 0.0;
  cameraLookPass.uniforms.uOrbAlpha.value = 1.0 - THREE.MathUtils.smoothstep(t, 12.0, 14.0);

  // --------------------------------------------------------------------------
  // 3. Animate What-If Scenario Hazard Actors
  // --------------------------------------------------------------------------
  if (scenario === 'truck_runs_light') {
    // Red pickup runs the red light across the crosswalk at conflict_t = 12.20s
    // At t = 12.20s, recorded robot is at (x = 7.51, rz = -2.43, yaw = 0.266).
    // Truck approaches along the avenue from left (-Z) to right (+Z) at 8.8 m/s,
    // intersecting right across the robot's front bumper at (X = 8.42, Z = -2.68).
    if (t >= 9.2 && t <= 18.0) {
      redPickupRunner.visible = true;
      const truckSpeed = 8.8;
      const truckYaw = -Math.PI / 2 + 0.14; // Traveling toward +Z and slightly +X
      const dirX = Math.cos(truckYaw);
      const dirZ = -Math.sin(truckYaw);

      // At conflictT (12.20s), truck front bumper (+2.4m ahead of truck center) is at the conflict point
      const hitCenterX = 8.42 - dirX * 1.35;
      const hitCenterZ = -2.68 - dirZ * 1.35;

      let travelS = 0;
      let nosePitch = 0;
      const dt = t - conflictT;
      if (policy === 'recorded' && dt >= 0) {
        // Truck brakes hard on contact over 0.42s (~1.6m stopping distance) and stays stopped
        const brakeDur = 0.42;
        const u = Math.min(1.0, dt / brakeDur);
        const decelDist = truckSpeed * brakeDur * (u - 0.5 * u * u);
        travelS = decelDist;
        nosePitch = -Math.sin(u * Math.PI) * 0.045 * Math.exp(-dt * 2.0);
      } else {
        travelS = dt * truckSpeed;
      }

      redPickupRunner.position.set(
        hitCenterX + dirX * travelS,
        BASE_ROAD_Y + roadYOffset,
        hitCenterZ + dirZ * travelS
      );
      redPickupRunner.rotation.set(0, truckYaw, nosePitch, 'YXZ');
    }
  } else if (scenario === 'pedestrian_steps_out') {
    // Pedestrian steps off the left curb and walks across the robot's path at 1.38 m/s.
    // Conflict point at conflict_t = 14.50s: recorded robot is at (x = 12.83, rz = -3.65, yaw = 0.146).
    // Pedestrian conflict point is right in front of the robot bumper at (X = 13.48, Z = -3.76).
    if (t >= 8.0 && t <= 18.0) {
      pedestrianActor.visible = true;
      const walkSpeed = 1.38;
      const pedYaw = -Math.PI / 2 + 0.12; // Walking from left curb (-Z) toward right (+Z)
      const dirX = Math.cos(pedYaw);
      const dirZ = -Math.sin(pedYaw);

      const hitX = 13.48;
      const hitZ = -3.76;
      const dt = t - conflictT;

      const { pelvis, torso, neck, leftArm, rightArm, leftLeg, rightLeg } = pedestrianActor.userData;

      if (policy === 'recorded' && dt >= 0) {
        // Contact at conflictT: pedestrian stumbles back a step (~0.46 m) and stops facing the robot
        const stumbleDur = 0.62;
        const u = Math.min(1.0, dt / stumbleDur);
        const stumbleBack = (1.0 - Math.pow(1.0 - u, 3)) * 0.46;
        const pushRight = (1.0 - Math.pow(1.0 - u, 2)) * 0.18;

        const px = hitX - dirX * stumbleBack + pushRight;
        const pz = hitZ - dirZ * stumbleBack;
        pedestrianActor.position.set(px, BASE_ROAD_Y + roadYOffset, pz);
        // Turn slightly toward the robot as they stumble back
        pedestrianActor.rotation.y = pedYaw - 0.35 * Math.min(1.0, dt * 2.5);

        // Stumble step cycle & startle arm raise
        const stepWave = Math.sin(u * Math.PI);
        pelvis.position.y = 0.94 - 0.05 * stepWave;
        torso.rotation.z = 0.18 * stepWave + 0.06; // Lean back on impact
        torso.rotation.x = -0.12 * Math.min(1.0, dt * 3.0);
        neck.rotation.y = -0.45 * Math.min(1.0, dt * 3.0); // Look at robot

        // Defensive raised arms
        const armRaise = Math.min(1.0, dt * 5.0) * Math.exp(-Math.max(0, dt - 0.5) * 0.6);
        leftArm.shoulder.rotation.z = 0.45 + 0.55 * armRaise;
        leftArm.shoulder.rotation.x = 0.35;
        leftArm.elbow.rotation.z = 0.85;

        rightArm.shoulder.rotation.z = 0.55 + 0.65 * armRaise;
        rightArm.shoulder.rotation.x = -0.35;
        rightArm.elbow.rotation.z = 0.95;

        // Backward stumble step with left leg planted back
        leftLeg.hip.rotation.z = -0.38 * stepWave - 0.18;
        leftLeg.knee.rotation.z = -0.45 * stepWave - 0.12;
        rightLeg.hip.rotation.z = 0.28 * stepWave + 0.12;
        rightLeg.knee.rotation.z = -0.25 * stepWave - 0.08;
      } else {
        // Normal articulated walking motion (steps off curb onto street)
        const walkStartT = conflictT - 2.10; // Starts walking at t = 12.40s from curb (2.9m left of conflict)
        const activeDt = Math.max(0, t - walkStartT) - (conflictT - walkStartT);
        const distFromHit = (t < walkStartT) ? -(conflictT - walkStartT) * walkSpeed : dt * walkSpeed;

        const px = hitX + dirX * distFromHit;
        const pz = hitZ + dirZ * distFromHit;

        // Curb height elevation when pedestrian is on the far sidewalk curb (pz < -5.35)
        const onCurbFactor = THREE.MathUtils.smoothstep(-pz, 5.25, 5.65);
        const groundY = THREE.MathUtils.lerp(BASE_ROAD_Y + roadYOffset, 0.045, onCurbFactor);

        pedestrianActor.position.set(px, groundY, pz);
        pedestrianActor.rotation.y = pedYaw;

        const isWalking = (t >= walkStartT);
        const phase = isWalking ? (t - walkStartT) * 5.6 : 0.0;
        const stride = isWalking ? 1.0 : 0.0;

        pelvis.position.y = 0.94 + Math.abs(Math.sin(phase)) * 0.032 * stride;
        torso.rotation.z = -0.05 * stride;
        torso.rotation.y = Math.sin(phase) * 0.08 * stride;
        torso.rotation.x = 0;
        neck.rotation.y = 0;

        // Opposite arm & leg swing
        const sL = Math.sin(phase) * stride;
        const sR = Math.sin(phase + Math.PI) * stride;

        leftLeg.hip.rotation.z = sL * 0.46;
        leftLeg.knee.rotation.z = -Math.max(0, -sL) * 0.65 - 0.05;
        leftLeg.ankle.rotation.z = Math.max(0, sL) * 0.20;

        rightLeg.hip.rotation.z = sR * 0.46;
        rightLeg.knee.rotation.z = -Math.max(0, -sR) * 0.65 - 0.05;
        rightLeg.ankle.rotation.z = Math.max(0, sR) * 0.20;

        leftArm.shoulder.rotation.z = sR * 0.36;
        leftArm.shoulder.rotation.x = 0.08;
        leftArm.elbow.rotation.z = 0.28 + Math.max(0, sR) * 0.22;

        rightArm.shoulder.rotation.z = sL * 0.36;
        rightArm.shoulder.rotation.x = -0.08;
        rightArm.elbow.rotation.z = 0.28 + Math.max(0, sL) * 0.22;
      }
    }
  } else if (scenario === 'scooter_cuts_across') {
    // E-scooter rider (~4.0 m/s) cuts diagonally across the robot's path at conflict_t = 13.20s.
    // At t = 13.20s, recorded robot is at (x = 9.66, rz = -3.02, yaw = 0.248).
    // Scooter cuts diagonally from front-right (X = 12.8, Z = +3.2) through (X = 10.30, Z = -3.18) toward front-left.
    if (t >= 9.5 && t <= 18.0) {
      scooterActor.visible = true;
      const scooterSpeed = 4.0;
      // Diagonal heading cutting across robot bow from right-front (+X, +Z) to left (-X, -Z)
      const scooterYaw = Math.PI * 0.62;
      const dirX = Math.cos(scooterYaw);
      const dirZ = -Math.sin(scooterYaw);

      const hitX = 10.30;
      const hitZ = -3.18;
      const dt = t - conflictT;

      const { scooterTiltGroup, scooterWheels, rider } = scooterActor.userData;
      const { torso, leftLeg } = rider.userData;

      let travelS = 0;
      if (policy === 'recorded' && dt >= 0) {
        // Scooter brakes to a stop over 0.38s (~0.76m) and rider plants left foot on the road
        const brakeDur = 0.38;
        const u = Math.min(1.0, dt / brakeDur);
        travelS = scooterSpeed * brakeDur * (u - 0.5 * u * u);

        scooterTiltGroup.rotation.x = -0.14 * u; // Lean slightly left onto planted foot
        scooterTiltGroup.rotation.z = -0.08 * Math.sin(u * Math.PI); // Braking nose pitch
        torso.rotation.z = -0.12 - 0.14 * Math.sin(u * Math.PI);

        // Rider extends left leg out & down to touch the ground for balance
        leftLeg.hip.rotation.x = -0.32 * u;
        leftLeg.hip.rotation.z = 0.18 * u;
        leftLeg.knee.rotation.z = -0.05 * (1 - u);
      } else {
        travelS = dt * scooterSpeed;
        scooterTiltGroup.rotation.set(0, 0, 0);
        torso.rotation.z = -0.12;
        leftLeg.hip.rotation.x = 0;
        leftLeg.hip.rotation.z = -0.10;
        leftLeg.knee.rotation.z = -0.14;
      }

      scooterActor.position.set(
        hitX + dirX * travelS,
        BASE_ROAD_Y + roadYOffset,
        hitZ + dirZ * travelS
      );
      scooterActor.rotation.y = scooterYaw;

      const sWheelAng = travelS / 0.11;
      for (const sw of scooterWheels) {
        sw.rotation.z = -sWheelAng;
      }
    }
  }

  // --------------------------------------------------------------------------
  // 4. Animate Baseline Moving Vehicles & Traffic Lights
  // --------------------------------------------------------------------------
  // 1. Silver Sedan (Frame 1 at t = 0.94)
  if (t >= -0.5 && t <= 2.5) {
    silverSedan.visible = true;
    const dt1 = t - 0.94;
    const speed1 = 8.5;
    const yaw1 = -2.02;
    const dirX = Math.cos(yaw1);
    const dirZ = -Math.sin(yaw1);
    silverSedan.position.set(
      6.15 + dirX * speed1 * dt1,
      BASE_ROAD_Y + roadYOffset,
      4.15 + dirZ * speed1 * dt1
    );
    silverSedan.rotation.y = yaw1;
  } else {
    silverSedan.visible = false;
  }

  // 2. Red Pickup Truck (Frame 2 at t = 4.12)
  if (t >= 2.6 && t <= 5.8) {
    redPickup.visible = true;
    const dt2 = t - 4.12;
    const speed2 = 10.8;
    redPickup.position.set(
      3.85 - 0.05 * speed2 * dt2,
      BASE_ROAD_Y + roadYOffset,
      -3.38 + speed2 * dt2
    );
    redPickup.rotation.y = -Math.PI / 2 - 0.05;
  } else {
    redPickup.visible = false;
  }

  // 3. Distant Car Waiting on the Right (Frame 3 at t = 7.50)
  if (t >= 5.5 && t <= 9.8) {
    distantCarGroup.visible = true;
    distantCarGroup.position.set(11.5, BASE_ROAD_Y + roadYOffset, 15.0);
    distantCarGroup.rotation.y = 0.15;
  } else {
    distantCarGroup.visible = false;
  }

  // 4. Traffic Signal Light State (RED for t < 6.2s, GREEN for t >= 6.2s)
  const isGreen = (t >= 6.2);
  centerSigLeft.material = isGreen ? centerSigMatGreen : centerSigMatRed;
  centerSigRight.material = isGreen ? centerSigMatGreen : centerSigMatRed;

  pedWalkBulb.visible = (t >= 12.0);
}

// ============================================================================
// Contract API: window.seek(t), window.duration, window.__ready
// ============================================================================
window.duration = trajData.frames[trajData.frames.length - 1].t;

window.seek = function(t) {
  updateSceneAtTime(t);
  composer.render();
  if (!isCapture) {
    scrubber.value = t;
    timeLabel.textContent = t.toFixed(2) + 's';
  }
};

// ============================================================================
// Interactive UI & Playback Loop
// ============================================================================
const playBtn = document.getElementById('playBtn');
const scrubber = document.getElementById('scrubber');
const timeLabel = document.getElementById('timeLabel');
const camBtn = document.getElementById('camBtn');
const pitchSlider = document.getElementById('pitchSlider');

let isPlaying = !isCapture;
let lastFrameWallTime = performance.now();

camBtn.textContent = `Cam: ${camMode === 'chase' ? 'Chase' : 'Robot'}`;

playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? 'Pause' : 'Play';
  lastFrameWallTime = performance.now();
});

scrubber.addEventListener('input', (e) => {
  isPlaying = false;
  playBtn.textContent = 'Play';
  window.seek(parseFloat(e.target.value));
});

camBtn.addEventListener('click', () => {
  camMode = (camMode === 'robot') ? 'chase' : 'robot';
  camBtn.textContent = `Cam: ${camMode === 'chase' ? 'Chase' : 'Robot'}`;
  window.seek(currentTime);
});

pitchSlider.addEventListener('input', (e) => {
  pitchDeg = parseFloat(e.target.value);
  window.seek(currentTime);
});

function updateUrlParamsAndReload() {
  const nextParams = new URLSearchParams(window.location.search);
  nextParams.set('scenario', scenarioSelectEl.value);
  nextParams.set('policy', policySelectEl.value);
  window.location.search = nextParams.toString();
}
if (scenarioSelectEl) scenarioSelectEl.addEventListener('change', updateUrlParamsAndReload);
if (policySelectEl) policySelectEl.addEventListener('change', updateUrlParamsAndReload);

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  chaseCamera.aspect = w / h;
  chaseCamera.updateProjectionMatrix();
  window.seek(currentTime);
});

function animate(now) {
  requestAnimationFrame(animate);
  if (!isPlaying) return;
  const dt = Math.min((now - lastFrameWallTime) / 1000, 0.1);
  lastFrameWallTime = now;
  let nextT = currentTime + dt;
  if (nextT > window.duration) nextT = 0.0;
  window.seek(nextT);
}

// ============================================================================
// Initialization (Fetch Trajectory & MuJoCo Drop JSON if needed, then render Frame 0)
// ============================================================================
async function init() {
  if (trajUrl) {
    try {
      const resp = await fetch(trajUrl);
      if (resp.ok) {
        const json = await resp.json();
        if (json && Array.isArray(json.frames) && json.frames.length > 0) {
          trajData = json;
          if (json.camera) {
            if (json.camera.vfov_deg) robotCamera.fov = json.camera.vfov_deg;
            if (json.camera.aspect) robotCamera.aspect = json.camera.aspect;
            robotCamera.updateProjectionMatrix();
          }
        }
      }
    } catch (err) {
      console.warn('Using fallback trajectory:', err);
    }
  }

  buildArcLengthTable();

  if (scenario === 'missing_curb_ramp') {
    const mjUrl = policy === 'safe'
      ? 'whatif/mujoco_drop_safe.json'
      : 'whatif/mujoco_drop_recorded.json';
    try {
      const resp = await fetch(mjUrl);
      if (resp.ok) {
        const json = await resp.json();
        if (json && Array.isArray(json.frames) && json.frames.length > 0) {
          mujocoData = json;
        }
      }
    } catch (err) {
      console.warn('Using fallback MuJoCo drop data:', err);
    }
    if (!mujocoData) {
      mujocoData = createFallbackMujocoData(policy);
    }

    // Set conflict_t for missing_curb_ramp to when the robot drops off the curb edge and peaks in tilt/impact
    const edgeT = (mujocoData.meta && typeof mujocoData.meta.edge_t === 'number')
      ? mujocoData.meta.edge_t
      : 1.0;
    window.scenarioInfo.conflict_t = +(curbEdgeInfo.t_e + 0.45).toFixed(3);

    // Adjust road elevation to match meta.world.curb_height if specified
    if (mujocoData.meta && mujocoData.meta.world && typeof mujocoData.meta.world.curb_height === 'number') {
      activeCurbHeight = mujocoData.meta.world.curb_height;
    }
  }

  window.duration = trajData.frames[trajData.frames.length - 1].t;
  scrubber.max = window.duration;

  window.seek(0.0);
  window.__ready = true;

  if (!isCapture) {
    lastFrameWallTime = performance.now();
    requestAnimationFrame(animate);
  }
}

init();
</script>
