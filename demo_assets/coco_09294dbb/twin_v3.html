<!DOCTYPE html>
<html lang="en">

<script type="importmap">

  <span id="timeLabel" class="val">0.00s</span>

  <label style="display:flex;align-items:center;gap:4px;">
    Pitch
    <input id="pitchSlider" type="range" min="-8" max="4" step="0.1" value="-2.0" style="width:70px;" />
  </label>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================================
// URL Parameters & Fallback Trajectory
// ============================================================================
const urlParams = new URLSearchParams(window.location.search);
const trajUrl = urlParams.get('traj');
let camMode = urlParams.get('cam') === 'chase' ? 'chase' : 'robot';
const isCapture = urlParams.get('capture') === '1';

const uiEl = document.getElementById('ui');
if (isCapture) {
  uiEl.classList.add('hidden');
}

const FALLBACK_TRAJ = {
  fps: 20.0,
  camera: {
    hfov_deg: 110.44766183865366,
    vfov_deg: 78.01841587930589,
    height_m: 0.456,
    aspect: 1.7777777777777777
  },
  frames: [
    { t: 0.0, x: 0.0, y: 0.0, yaw: 0.0, v: 0.0 },
    { t: 1.0, x: 0.0, y: 0.0, yaw: 0.0, v: 0.0 },
    { t: 2.0, x: 0.0, y: 0.0, yaw: -0.0001, v: -0.001 },
    { t: 3.0, x: 0.0, y: 0.0, yaw: -0.0001, v: 0.001 },
    { t: 4.0, x: 0.001, y: 0.0, yaw: -0.0001, v: 0.006 },
    { t: 5.0, x: -0.002, y: 0.0, yaw: -0.0003, v: 0.001 },
    { t: 6.0, x: -0.003, y: 0.0, yaw: -0.0002, v: 0.0 },
    { t: 7.0, x: -0.003, y: 0.0, yaw: -0.0002, v: 0.0 },
    { t: 8.0, x: 0.194, y: 0.007, yaw: 0.0827, v: 0.567 },
    { t: 9.0, x: 1.078, y: 0.175, yaw: 0.2188, v: 1.063 },
    { t: 10.0, x: 2.568, y: 0.666, yaw: 0.4077, v: 1.819 },
    { t: 11.0, x: 4.692, y: 1.53, yaw: 0.3311, v: 2.494 },
    { t: 12.0, x: 7.097, y: 2.313, yaw: 0.2675, v: 2.131 },
    { t: 13.0, x: 9.18, y: 2.917, yaw: 0.2588, v: 2.399 },
    { t: 14.0, x: 11.589, y: 3.446, yaw: 0.2051, v: 2.56 },
    { t: 15.0, x: 14.074, y: 3.854, yaw: 0.0873, v: 2.28 },
    { t: 16.0, x: 16.445, y: 4.002, yaw: 0.095, v: 1.872 },
    { t: 17.0, x: 17.957, y: 4.824, yaw: 0.7328, v: 2.241 },
    { t: 18.0, x: 19.222, y: 6.826, yaw: 1.3547, v: 1.895 }
  ]
};

let trajData = FALLBACK_TRAJ;
let pitchDeg = -2.0;

// ============================================================================
// Renderer, Scene & Camera Setup
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010204);
scene.fog = new THREE.FogExp2(0x010204, 0.0028);

const robotCamera = new THREE.PerspectiveCamera(
  78.01841587930589,
  1.7777777777777777,
  0.05,
  260
);
robotCamera.rotation.order = 'YXZ';

const chaseCamera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  260
);

// ============================================================================
// Post-Processing (Selective HDR Bloom + Camera Sensor / Lens Shader)
// ============================================================================
const renderPass = new RenderPass(scene, robotCamera);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.42, // strength
  0.38, // radius
  0.92  // threshold: only HDR emissive lights > 0.92 bloom
);

const CameraLookShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0.0 },
    uSpeed: { value: 0.0 },
    uIsRobotCam: { value: 1.0 },
    uOrbAlpha: { value: 1.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uSpeed;
    uniform float uIsRobotCam;
    uniform float uOrbAlpha;
    varying vec2 vUv;

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec2 uv = vUv;
      vec2 centered = uv - 0.5;
      float r2 = dot(centered, centered);

      // Subtle wide-angle chromatic dispersion near edges
      float ca = r2 * 0.0036 * uIsRobotCam;
      vec3 col;
      col.r = texture2D(tDiffuse, uv + centered * ca).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - centered * ca).b;

      // Directional radial motion blur on ground when robot moves at speed
      float motionFactor = clamp(uSpeed / 2.1, 0.0, 1.0) * uIsRobotCam;
      float groundMask = smoothstep(0.49, 0.05, uv.y);
      float edgeMask = smoothstep(0.10, 0.48, r2);
      float blurAmt = (motionFactor * groundMask * 0.022) + (edgeMask * 0.0024 * uIsRobotCam);

      if (blurAmt > 0.0002) {
        vec2 dir = normalize(uv - vec2(0.5, 0.52) + vec2(0.0001));
        vec3 acc = col * 0.30;
        acc += texture2D(tDiffuse, clamp(uv + dir * blurAmt * 0.45, 0.001, 0.999)).rgb * 0.24;
        acc += texture2D(tDiffuse, clamp(uv - dir * blurAmt * 0.45, 0.001, 0.999)).rgb * 0.24;
        acc += texture2D(tDiffuse, clamp(uv + dir * blurAmt * 0.95, 0.001, 0.999)).rgb * 0.11;
        acc += texture2D(tDiffuse, clamp(uv - dir * blurAmt * 0.95, 0.001, 0.999)).rgb * 0.11;
        col = acc;
      }

      // Subtle lens dust orb near top-center (u=0.538, v_top=0.062 -> uv.y=0.938)
      if (uIsRobotCam > 0.5 && uOrbAlpha > 0.01) {
        vec2 orbPos = vec2(0.538, 0.938);
        vec2 dOrb = (uv - orbPos) * vec2(1.7778, 1.0);
        float distOrb = length(dOrb);
        float orb = smoothstep(0.046, 0.018, distOrb) * (0.60 + 0.40 * smoothstep(0.015, 0.042, distOrb));
        col += vec3(0.055, 0.052, 0.048) * orb * uOrbAlpha;
      }

      // Wide-angle vignette
      float vig = 1.0 - r2 * (0.35 * uIsRobotCam + 0.10);
      col *= clamp(vig, 0.68, 1.0);

      // Contrast & color grade matching real night camera sensor
      col = pow(max(col, vec3(0.0)), vec3(1.02, 1.01, 0.99));

      // Subtle sensor noise
      float n = hash12(uv * vec2(1280.0, 720.0) + vec2(uTime * 37.0, uTime * 19.0)) - 0.5;
      col += n * 0.015;

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }
  `
};

const cameraLookPass = new ShaderPass(CameraLookShader);
const outputPass = new OutputPass();

const composer = new EffectComposer(renderer);
composer.addPass(renderPass);
composer.addPass(bloomPass);
composer.addPass(cameraLookPass);
composer.addPass(outputPass);

// ============================================================================
// Procedural Texture Generators (Canvas Only)
// ============================================================================
function createSeededRandom(seed = 12345) {
  let s = seed >>> 0;
  return function() {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function hdrColor(hex, mult = 1.0) {
  const c = new THREE.Color(hex);
  c.multiplyScalar(mult);
  return c;
}

// 1. Concrete Sidewalk Texture
function createSidewalkTextures() {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(101);

  ctx.fillStyle = '#828b96';
  ctx.fillRect(0, 0, size, size);

  // Weathering blotches & grime
  for (let i = 0; i < 1200; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const r = 6 + rng() * 50;
    const v = Math.floor(85 + rng() * 65);
    ctx.fillStyle = `rgba(${v},${v + 4},${v + 8},0.08)`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Broom finish streaks & subtle tire marks
  for (let i = 0; i < 4200; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const len = 18 + rng() * 65;
    const v = rng() > 0.48 ? 148 : 80;
    ctx.strokeStyle = `rgba(${v},${v + 3},${v + 6},0.065)`;
    ctx.lineWidth = 1 + rng() * 1.6;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len * 0.85, y + len * 0.35);
    ctx.stroke();
  }

  // Fine aggregate grain
  const imgData = ctx.getImageData(0, 0, size, size);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (rng() - 0.5) * 26;
    data[i] = Math.min(255, Math.max(0, data[i] + n));
    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n));
    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n));
  }
  ctx.putImageData(imgData, 0, 0);

  // Subtle concrete joint lines
  ctx.strokeStyle = 'rgba(28, 32, 38, 0.45)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, size * 0.52);
  ctx.lineTo(size, size * 0.49);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// 2. Yellow Tactile Warning Pad Texture + Bump Map (Weathered Ochre-Gold with Dark Grime Rings)
function createTactilePadTextures() {
  const w = 1024, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  const b = document.createElement('canvas');
  b.width = w; b.height = h;
  const bctx = b.getContext('2d');

  const rng = createSeededRandom(202);

  // Weathered golden-brass base matching Real Frames 1-3
  ctx.fillStyle = '#9c7823';
  ctx.fillRect(0, 0, w, h);

  bctx.fillStyle = '#707070';
  bctx.fillRect(0, 0, w, h);

  // Heavy street dirt & weathering blotches across the tactile mat
  for (let i = 0; i < 750; i++) {
    const x = rng() * w;
    const y = rng() * h;
    const r = 8 + rng() * 44;
    const dark = rng() > 0.32;
    ctx.fillStyle = dark ? 'rgba(34, 25, 8, 0.16)' : 'rgba(198, 160, 62, 0.11)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Subtle recessed border around the pad
  ctx.strokeStyle = 'rgba(26, 20, 8, 0.75)';
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, w - 8, h - 8);

  // 4 Tile segments with prominent diagonal/transverse seams (visible at u=0.45 and u=0.68 in Real Frames 1-3)
  const tileCols = 4;
  for (let i = 1; i < tileCols; i++) {
    const tx = (w / tileCols) * i;
    ctx.strokeStyle = 'rgba(22, 16, 6, 0.90)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(tx, 0);
    ctx.lineTo(tx, h);
    ctx.stroke();

    bctx.strokeStyle = '#202020';
    bctx.lineWidth = 8;
    ctx.beginPath();
    bctx.moveTo(tx, 0);
    bctx.lineTo(tx, h);
    bctx.stroke();
  }

  // Truncated dome grid with dark recessed grime rings around each dome base
  const cols = 42;
  const rows = 15;
  const dx = (w - 28) / cols;
  const dy = (h - 28) / rows;
  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      const cx = 14 + (col + 0.5) * dx;
      const cy = 14 + (r + 0.5) * dy;
      const rad = Math.min(dx, dy) * 0.31;

      // Dark grime shadow ring on the grazing side of each dome
      ctx.fillStyle = 'rgba(24, 18, 5, 0.88)';
      ctx.beginPath();
      ctx.arc(cx + 1.4, cy + 1.8, rad * 1.18, 0, Math.PI * 2);
      ctx.fill();

      // Dome top highlight + ochre body
      const grad = ctx.createRadialGradient(cx - 1.8, cy - 1.8, rad * 0.1, cx, cy, rad);
      grad.addColorStop(0, '#d8b04c');
      grad.addColorStop(0.55, '#a88228');
      grad.addColorStop(1, '#4c380c');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fill();

      // Bump map dome
      const bgrad = bctx.createRadialGradient(cx, cy, rad * 0.15, cx, cy, rad * 1.05);
      bgrad.addColorStop(0, '#ffffff');
      bgrad.addColorStop(0.65, '#c4c4c4');
      bgrad.addColorStop(1, '#585858');
      bctx.fillStyle = bgrad;
      bctx.beginPath();
      bctx.arc(cx, cy, rad, 0, Math.PI * 2);
      bctx.fill();
    }
  }

  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = 16;

  const bumpMap = new THREE.CanvasTexture(b);
  bumpMap.anisotropy = 16;

  return { map, bumpMap };
}

// 3. Realistic Urban Asphalt Road Texture (Higher Albedo for Realistic Headlight Pool)
function createAsphaltTextures() {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(303);

  // Medium-grey weathered asphalt base so robot headlight creates the bright cool-white pool seen in Frame 4 & 5
  ctx.fillStyle = '#4e5259';
  ctx.fillRect(0, 0, size, size);

  // Broad asphalt color variations & wear patches
  for (let i = 0; i < 900; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const rx = 20 + rng() * 90;
    const ry = 12 + rng() * 55;
    const v = Math.floor(55 + rng() * 48);
    ctx.fillStyle = `rgba(${v},${v + 2},${v + 5},0.10)`;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rng() * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Longitudinal tire wear streaks
  for (let i = 0; i < 3600; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const len = 45 + rng() * 150;
    const v = rng() > 0.46 ? 98 : 42;
    ctx.strokeStyle = `rgba(${v},${v + 3},${v + 6},0.065)`;
    ctx.lineWidth = 1.5 + rng() * 3.0;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y + (rng() - 0.5) * 10);
    ctx.stroke();
  }

  // Subtle aggregate grain
  const imgData = ctx.getImageData(0, 0, size, size);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (rng() - 0.5) * 22;
    data[i] = Math.min(255, Math.max(0, data[i] + n));
    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n));
    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n));
  }
  ctx.putImageData(imgData, 0, 0);

  // Tar crack lines
  ctx.strokeStyle = 'rgba(22, 24, 28, 0.55)';
  ctx.lineWidth = 2.2;
  for (let k = 0; k < 9; k++) {
    let cx = rng() * size;
    let cy = rng() * size;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    for (let s = 0; s < 10; s++) {
      cx += (rng() - 0.25) * 50;
      cy += (rng() - 0.5) * 35;
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  const map = new THREE.CanvasTexture(c);
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(6, 6);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = 16;

  return { map };
}

// 4. Manhole & Utility Lid Textures
function createManholeTexture(style = 'iron') {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2, r = size * 0.43;

  ctx.clearRect(0, 0, size, size);

  if (style === 'fg_lid') {
    // Prominent dark recessed circular ring with mottled grey/greenish concrete center (u=0.07, v=0.77 in Frames 1-3)
    ctx.fillStyle = 'rgba(5, 7, 10, 0.98)';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#6c7c82';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#20262c';
    ctx.beginPath();
    ctx.arc(cx - 14, cy + 10, r * 0.36, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#8fa0a8';
    ctx.beginPath();
    ctx.arc(cx + 18, cy - 8, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const isDark = (style === 'dark');
    const outerGrad = ctx.createRadialGradient(cx, cy, r * 0.78, cx, cy, r * 1.12);
    outerGrad.addColorStop(0, 'rgba(8,10,14,0.96)');
    outerGrad.addColorStop(1, 'rgba(8,10,14,0)');
    ctx.fillStyle = outerGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = isDark ? '#14171c' : '#323842';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.90, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = isDark ? '#242932' : '#4a5260';
    ctx.lineWidth = 4;
    for (let k = 1; k <= 3; k++) {
      ctx.beginPath();
      ctx.arc(cx, cy, r * (0.27 * k), 0, Math.PI * 2);
      ctx.stroke();
    }
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r * 0.25, cy + Math.sin(ang) * r * 0.25);
      ctx.lineTo(cx + Math.cos(ang) * r * 0.86, cy + Math.sin(ang) * r * 0.86);
      ctx.stroke();
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 5. Signage Texture Generator
function createSignTexture({ text, bgColor, textColor, glowColor, width = 512, height = 128, font = 'bold 76px Arial, sans-serif', drawHyundaiLogo = false, border = null }) {
  const c = document.createElement('canvas');
  c.width = width;
  c.height = height;
  const ctx = c.getContext('2d');

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, width, height);

  if (border) {
    ctx.strokeStyle = border;
    ctx.lineWidth = 6;
    ctx.strokeRect(4, 4, width - 8, height - 8);
  }

  ctx.save();
  if (glowColor) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 18;
  }
  ctx.fillStyle = textColor;
  ctx.font = font;
  ctx.textBaseline = 'middle';

  if (drawHyundaiLogo) {
    const lx = width * 0.17;
    const ly = height * 0.5;
    ctx.strokeStyle = '#75b5ff';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.ellipse(lx, ly, 46, 26, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(lx - 20, ly + 18);
    ctx.lineTo(lx - 10, ly - 18);
    ctx.moveTo(lx + 10, ly + 18);
    ctx.lineTo(lx + 20, ly - 18);
    ctx.moveTo(lx - 15, ly);
    ctx.lineTo(lx + 15, ly);
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillText(text, width * 0.30, height * 0.52);
  } else {
    ctx.textAlign = 'center';
    ctx.fillText(text, width * 0.5, height * 0.52);
    ctx.shadowBlur = 4;
    ctx.fillText(text, width * 0.5, height * 0.52);
  }
  ctx.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// 6. Tall High-Rise Residential Tower Texture (Clearly visible at u=0.40..0.50 in Frames 1-5)
function createHighRiseTexture() {
  const w = 512, h = 1024;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(606);

  // Warm-grey concrete facade clearly visible against the black sky
  ctx.fillStyle = '#484344';
  ctx.fillRect(0, 0, w, h);

  // Vertical structural columns
  const cols = 5;
  const colW = w / cols;
  for (let i = 0; i <= cols; i++) {
    ctx.fillStyle = '#565052';
    ctx.fillRect(i * colW - 8, 0, 16, h);
  }

  // Floors & dark recessed balcony windows
  const floors = 28;
  const floorH = h / floors;
  for (let r = 0; r < floors; r++) {
    const y = r * floorH;
    ctx.fillStyle = '#524c4e';
    ctx.fillRect(0, y, w, 6);

    for (let col = 0; col < cols; col++) {
      const x = col * colW + 9;
      const ww = colW - 18;
      const wh = floorH - 9;

      // Subtle warm/pinkish lit windows on center column matching reference footage
      const isLit = (col === 2 && (r === 21 || r === 22 || r === 15 || r === 4)) || (rng() > 0.96);
      if (isLit) {
        ctx.fillStyle = rng() > 0.35 ? '#b47870' : '#be9878';
      } else {
        ctx.fillStyle = '#111216';
      }
      ctx.fillRect(x, y + 6, ww, wh);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 7. Showroom Ceiling Downlights Texture
function createShowroomCeilingTexture() {
  const w = 512, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#c8ae96';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(90, 75, 62, 0.28)';
  ctx.lineWidth = 2;
  const step = 32;
  for (let i = 0; i <= w; i += step) {
    ctx.beginPath();
    ctx.moveTo(i, 0); ctx.lineTo(i, h);
    ctx.moveTo(0, i); ctx.lineTo(w, i);
    ctx.stroke();
  }

  for (let y = 24; y < h; y += 48) {
    for (let x = 24; x < w; x += 48) {
      const g = ctx.createRadialGradient(x, y, 1, x, y, 10);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.45, '#ffeed8');
      g.addColorStop(1, 'rgba(200,174,150,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(7, 2);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Calibrated so front edge goes from (u=0.25, v=0.79) -> (u=0.69, v=1.00)
// and back edge goes from (u=0.35, v=0.69) -> (u=1.00, v=0.88)
const padSegX = 24, padSegZ = 48;
const padGeo = new THREE.BufferGeometry();
const padPos = [];
const padUvs = [];
const padIdx = [];

function evalPadPoint(u, v) {
  // Near boundary (v=0): from (0.915, -0.665) [u=0.25, v=0.79] -> (0.71, -0.05) -> (0.39, 0.29) [u=0.69, v=1.00]
  const xNear = 0.915 * Math.pow(1 - u, 2) + 2 * 0.72 * (1 - u) * u + 0.39 * u * u;
  const zNear = -0.665 * Math.pow(1 - u, 2) + 2 * (-0.11) * (1 - u) * u + 0.29 * u * u;

  // Far boundary (v=1): from (1.35, -0.56) [u=0.35, v=0.69] -> (1.16, 0.35) -> (0.68, 0.98) [u=1.00, v=0.88]
  const xFar = 1.35 * Math.pow(1 - u, 2) + 2 * 1.16 * (1 - u) * u + 0.68 * u * u;
  const zFar = -0.56 * Math.pow(1 - u, 2) + 2 * 0.35 * (1 - u) * u + 0.98 * u * u;

  const x = THREE.MathUtils.lerp(xNear, xFar, v);
  const z = THREE.MathUtils.lerp(zNear, zFar, v);
  const y = 0.002 + Math.sin(v * Math.PI) * 0.0015;
  return { x, y, z };
}

for (let iz = 0; iz <= padSegZ; iz++) {
  const u = iz / padSegZ;
  for (let ix = 0; ix <= padSegX; ix++) {
    const v = ix / padSegX;
    const p = evalPadPoint(u, v);
    padPos.push(p.x, p.y, p.z);
    padUvs.push(u, v);
  }
}
for (let iz = 0; iz < padSegZ; iz++) {
  for (let ix = 0; ix < padSegX; ix++) {
    const a = iz * (padSegX + 1) + ix;
    const b = a + 1;
    const c = (iz + 1) * (padSegX + 1) + ix;
    const d = c + 1;
    padIdx.push(a, c, b, b, c, d);
  }
}
padGeo.setAttribute('position', new THREE.Float32BufferAttribute(padPos, 3));
padGeo.setAttribute('uv', new THREE.Float32BufferAttribute(padUvs, 2));
padGeo.setIndex(padIdx);

// Sleek Contoured Showroom Cars Parked Inside Behind the Glass
function createShowroomCar(colorHex, highlightHex, isSUV = false) {
  const car = new THREE.Group();

  // Procedural glossy car body texture with showroom ceiling reflections
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0, highlightHex);
  g.addColorStop(0.35, colorHex);
  g.addColorStop(0.50, '#ffffff'); // Specular beltline reflection
  g.addColorStop(0.60, colorHex);
  g.addColorStop(1, '#121418');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 128);
  const bodyTex = new THREE.CanvasTexture(c);
  bodyTex.colorSpace = THREE.SRGBColorSpace;

  const bodyMat = new THREE.MeshBasicMaterial({ map: bodyTex });

  // Glossy windshield/cabin with bright ceiling reflection streaks
  const gc = document.createElement('canvas');
  gc.width = 128; gc.height = 64;
  const gctx = gc.getContext('2d');
  const gg = gctx.createLinearGradient(0, 0, 128, 64);
  gg.addColorStop(0, '#2a323d');
  gg.addColorStop(0.45, '#8a98a8');
  gg.addColorStop(0.55, '#c8d4e0');
  gg.addColorStop(0.70, '#222832');
  gg.addColorStop(1, '#141820');
  gctx.fillStyle = gg;
  gctx.fillRect(0, 0, 128, 64);
  const glassTex = new THREE.CanvasTexture(gc);
  glassTex.colorSpace = THREE.SRGBColorSpace;
  const glassMat = new THREE.MeshBasicMaterial({ map: glassTex });

  const lower = new THREE.Mesh(new THREE.BoxGeometry(4.1, isSUV ? 0.64 : 0.54, 1.74), bodyMat);
  lower.position.y = isSUV ? 0.54 : 0.46;
  car.add(lower);

  // Sloped front hood & rear deck
  const frontSlope = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.35, 1.66), bodyMat);
  frontSlope.position.set(1.2, isSUV ? 0.82 : 0.70, 0);
  frontSlope.rotation.z = -0.32;
  car.add(frontSlope);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(isSUV ? 2.3 : 1.9, isSUV ? 0.52 : 0.44, 1.48),
    glassMat
  );
  cabin.position.set(isSUV ? -0.25 : -0.15, isSUV ? 1.02 : 0.86, 0);
  car.add(cabin);

  // Headlight & chrome accents
  const hl = new THREE.Mesh(
    new THREE.BoxGeometry(0.14, 0.12, 1.45),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  hl.position.set(2.02, 0.56, 0);
  car.add(hl);

  const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 16);
  wheelGeo.rotateX(Math.PI / 2);
  const wheelMat = new THREE.MeshBasicMaterial({ color: 0x14161a });
  const rimMat = new THREE.MeshBasicMaterial({ color: 0x9aa4b2 });
  for (const wx of [-1.28, 1.28]) {
    for (const wz of [-0.82, 0.82]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.position.set(wx, 0.32, wz);
      car.add(w);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.20, 0.24, 12), rimMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.set(wx, 0.32, wz);
      car.add(rim);
    }
  }
  return car;
}

// ============================================================================
// Trajectory Interpolation & Scene Posing (window.seek)
// ============================================================================
function getPoseAtTime(t) {
  const frames = trajData.frames;
  if (!frames || frames.length === 0) {
    return { x: 0, y: 0, yaw: 0, v: 0 };
  }
  const clampedT = Math.max(frames[0].t, Math.min(t, frames[frames.length - 1].t));

  let idx = 0;
  for (let i = 0; i < frames.length - 1; i++) {
    if (clampedT >= frames[i].t && clampedT <= frames[i + 1].t) {
      idx = i;
      break;
    }
  }

  const f0 = frames[idx];
  const f1 = frames[Math.min(idx + 1, frames.length - 1)];
  const dt = f1.t - f0.t;
  const alpha = dt > 1e-6 ? (clampedT - f0.t) / dt : 0.0;

  let dyaw = f1.yaw - f0.yaw;
  while (dyaw > Math.PI) dyaw -= Math.PI * 2;
  while (dyaw < -Math.PI) dyaw += Math.PI * 2;

  return {
    x: THREE.MathUtils.lerp(f0.x, f1.x, alpha),
    y: THREE.MathUtils.lerp(f0.y, f1.y, alpha),
    yaw: f0.yaw + dyaw * alpha,
    v: THREE.MathUtils.lerp(f0.v || 0, f1.v || 0, alpha)
  };
}

let currentTime = 0.0;

function updateSceneAtTime(t) {
  currentTime = t;
  const pose = getPoseAtTime(t);

  // Convert sim (x, y, z=0) -> three (x, 0, -y)
  const rx = pose.x;
  const rz = -pose.y;
  const ryaw = pose.yaw;

  // Elevate robot smoothly onto the far sidewalk after x > 15.8m
  const sidewalkLift = THREE.MathUtils.smoothstep(rx, 15.8, 17.5) * 0.044;

  robotGroup.position.set(rx, sidewalkLift, rz);
  robotGroup.rotation.y = ryaw;

  const wheelAngle = (rx * 1.1) / 0.095;
  for (const w of robotWheels) {
    w.rotation.z = -wheelAngle;
  }

  const camHeight = (trajData.camera && trajData.camera.height_m) ? trajData.camera.height_m : 0.456;
  robotCamera.position.set(rx, camHeight + sidewalkLift, rz);
  robotCamera.rotation.y = ryaw - Math.PI / 2;
  robotCamera.rotation.x = THREE.MathUtils.degToRad(pitchDeg);
  robotCamera.rotation.z = 0;

  // Boost headlight intensity slightly when robot is crossing the dark asphalt or on the far sidewalk
  const moveBoost = THREE.MathUtils.smoothstep(t, 8.0, 10.5);
  headlightSpot.intensity = THREE.MathUtils.lerp(13.5, 24.0, moveBoost);

  // Pose Chase Camera (3m behind and 1.45m above the robot)
  const backDist = 3.0;
  const upDist = 1.45;
  chaseCamera.position.set(
    rx - Math.cos(ryaw) * backDist,
    sidewalkLift + upDist,
    rz + Math.sin(ryaw) * backDist
  );
  chaseCamera.lookAt(
    rx + Math.cos(ryaw) * 1.5,
    sidewalkLift + 0.45,
    rz - Math.sin(ryaw) * 1.5
  );

  robotVisuals.visible = (camMode === 'chase');
  renderPass.camera = (camMode === 'chase') ? chaseCamera : robotCamera;

  cameraLookPass.uniforms.uTime.value = t;
  cameraLookPass.uniforms.uSpeed.value = Math.abs(pose.v);
  cameraLookPass.uniforms.uIsRobotCam.value = (camMode === 'robot') ? 1.0 : 0.0;
  cameraLookPass.uniforms.uOrbAlpha.value = 1.0 - THREE.MathUtils.smoothstep(t, 12.0, 14.0);

  // ==========================================================================
  // Animate Moving Vehicles & Traffic Lights
  // ==========================================================================
  // 1. Silver Sedan (Frame 1 at t = 0.94):
  // Oriented in 3/4 front view (rotation.y = -2.02 rad) so its right fender/doors are at u=0.68..0.78
  // and its front hood, headlights, and black grille are at u=0.78..0.93!
  if (t >= -0.5 && t <= 2.5) {
    silverSedan.visible = true;
    const dt1 = t - 0.94;
    const speed1 = 8.5;
    const yaw1 = -2.02;
    const dirX = Math.cos(yaw1);
    const dirZ = -Math.sin(yaw1);
    silverSedan.position.set(
      6.15 + dirX * speed1 * dt1,
      -0.022,
      4.15 + dirZ * speed1 * dt1
    );
    silverSedan.rotation.y = yaw1;
  } else {
    silverSedan.visible = false;
  }

  // 2. Red Pickup Truck (Frame 2 at t = 4.12):
  // Moving from left to right (+Z) at X = 3.85m, positioned at Z = -3.38m at t=4.12
  // so its front bumper ends at u=0.41, revealing the 'AN' of BRAMAN just above the hood!
  if (t >= 2.6 && t <= 5.8) {
    redPickup.visible = true;
    const dt2 = t - 4.12;
    const speed2 = 10.8;
    redPickup.position.set(
      3.85 - 0.05 * speed2 * dt2,
      -0.022,
      -3.38 + speed2 * dt2
    );
    redPickup.rotation.y = -Math.PI / 2 - 0.05;
  } else {
    redPickup.visible = false;
  }

  // 3. Distant Car Waiting on the Right (Frame 3 at t = 7.50)
  if (t >= 5.5 && t <= 9.8) {
    distantCarGroup.visible = true;
    distantCarGroup.position.set(11.5, -0.022, 15.0);
    distantCarGroup.rotation.y = 0.15;
  } else {
    distantCarGroup.visible = false;
  }

  // 4. Traffic Signal Light State (RED for t < 6.2s, GREEN for t >= 6.2s)
  const isGreen = (t >= 6.2);
  centerSigLeft.material = isGreen ? centerSigMatGreen : centerSigMatRed;
  centerSigRight.material = isGreen ? centerSigMatGreen : centerSigMatRed;

  pedWalkBulb.visible = (t >= 12.0);
}

// ============================================================================
// Contract API: window.seek(t), window.duration, window.__ready
// ============================================================================
window.duration = trajData.frames[trajData.frames.length - 1].t;

window.seek = function(t) {
  updateSceneAtTime(t);
  composer.render();
  if (!isCapture) {
    scrubber.value = t;
    timeLabel.textContent = t.toFixed(2) + 's';
  }
};

// ============================================================================
// Interactive UI & Playback Loop
// ============================================================================
const playBtn = document.getElementById('playBtn');
const scrubber = document.getElementById('scrubber');
const timeLabel = document.getElementById('timeLabel');
const camBtn = document.getElementById('camBtn');
const pitchSlider = document.getElementById('pitchSlider');

let isPlaying = !isCapture;
let lastFrameWallTime = performance.now();

camBtn.textContent = `Cam: ${camMode === 'chase' ? 'Chase' : 'Robot'}`;

playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? 'Pause' : 'Play';
  lastFrameWallTime = performance.now();
});

scrubber.addEventListener('input', (e) => {
  isPlaying = false;
  playBtn.textContent = 'Play';
  window.seek(parseFloat(e.target.value));
});

camBtn.addEventListener('click', () => {
  camMode = (camMode === 'robot') ? 'chase' : 'robot';
  camBtn.textContent = `Cam: ${camMode === 'chase' ? 'Chase' : 'Robot'}`;
  window.seek(currentTime);
});

pitchSlider.addEventListener('input', (e) => {
  pitchDeg = parseFloat(e.target.value);
  window.seek(currentTime);
});

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  chaseCamera.aspect = w / h;
  chaseCamera.updateProjectionMatrix();
  window.seek(currentTime);
});

function animate(now) {
  requestAnimationFrame(animate);
  if (!isPlaying) return;
  const dt = Math.min((now - lastFrameWallTime) / 1000, 0.1);
  lastFrameWallTime = now;
  let nextT = currentTime + dt;
  if (nextT > window.duration) nextT = 0.0;
  window.seek(nextT);
}

// ============================================================================
// Initialization (Fetch Trajectory if URL param provided, then render Frame 0)
// ============================================================================
async function init() {
  if (trajUrl) {
    try {
      const resp = await fetch(trajUrl);
      if (resp.ok) {
        const json = await resp.json();
        if (json && Array.isArray(json.frames) && json.frames.length > 0) {
          trajData = json;
          if (json.camera) {
            if (json.camera.vfov_deg) robotCamera.fov = json.camera.vfov_deg;
            if (json.camera.aspect) robotCamera.aspect = json.camera.aspect;
            robotCamera.updateProjectionMatrix();
          }
        }
      }
    } catch (err) {
      console.warn('Using fallback trajectory:', err);
    }
  }

  window.duration = trajData.frames[trajData.frames.length - 1].t;
  scrubber.max = window.duration;

  window.seek(0.0);
  window.__ready = true;

  if (!isCapture) {
    lastFrameWallTime = performance.now();
    requestAnimationFrame(animate);
  }
}

init();
</script>
