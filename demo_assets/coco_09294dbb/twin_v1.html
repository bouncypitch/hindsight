<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coco Robotics Digital Twin</title>
<style>

    margin: 0;

</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <button id="playBtn">Pause</button>
  <input id="scrubber" type="range" min="0" max="18" step="0.01" value="0" />
  <span id="timeLabel" class="val">0.00s</span>
  <button id="camBtn">Cam: Robot</button>
  <label style="display:flex;align-items:center;gap:4px;">
    Pitch
    <input id="pitchSlider" type="range" min="-8" max="4" step="0.1" value="-2.0" style="width:70px;" />
  </label>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================================
// URL Parameters & Fallback Trajectory
// ============================================================================
const urlParams = new URLSearchParams(window.location.search);
const trajUrl = urlParams.get('traj');
let camMode = urlParams.get('cam') === 'chase' ? 'chase' : 'robot';
const isCapture = urlParams.get('capture') === '1';

const uiEl = document.getElementById('ui');
if (isCapture) {
  uiEl.classList.add('hidden');
}

const FALLBACK_TRAJ = {
  fps: 20.0,
  camera: {
    hfov_deg: 110.44766183865366,
    vfov_deg: 78.01841587930589,
    height_m: 0.456,
    aspect: 1.7777777777777777
  },
  frames: [
    { t: 0.0, x: 0.0, y: 0.0, yaw: 0.0, v: 0.0 },
    { t: 1.0, x: 0.0, y: 0.0, yaw: 0.0, v: 0.0 },
    { t: 2.0, x: 0.0, y: 0.0, yaw: -0.0001, v: -0.001 },
    { t: 3.0, x: 0.0, y: 0.0, yaw: -0.0001, v: 0.001 },
    { t: 4.0, x: 0.001, y: 0.0, yaw: -0.0001, v: 0.006 },
    { t: 5.0, x: -0.002, y: 0.0, yaw: -0.0003, v: 0.001 },
    { t: 6.0, x: -0.003, y: 0.0, yaw: -0.0002, v: 0.0 },
    { t: 7.0, x: -0.003, y: 0.0, yaw: -0.0002, v: 0.0 },
    { t: 8.0, x: 0.194, y: 0.007, yaw: 0.0827, v: 0.567 },
    { t: 9.0, x: 1.078, y: 0.175, yaw: 0.2188, v: 1.063 },
    { t: 10.0, x: 2.568, y: 0.666, yaw: 0.4077, v: 1.819 },
    { t: 11.0, x: 4.692, y: 1.53, yaw: 0.3311, v: 2.494 },
    { t: 12.0, x: 7.097, y: 2.313, yaw: 0.2675, v: 2.131 },
    { t: 13.0, x: 9.18, y: 2.917, yaw: 0.2588, v: 2.399 },
    { t: 14.0, x: 11.589, y: 3.446, yaw: 0.2051, v: 2.56 },
    { t: 15.0, x: 14.074, y: 3.854, yaw: 0.0873, v: 2.28 },
    { t: 16.0, x: 16.445, y: 4.002, yaw: 0.095, v: 1.872 },
    { t: 17.0, x: 17.957, y: 4.824, yaw: 0.7328, v: 2.241 },
    { t: 18.0, x: 19.222, y: 6.826, yaw: 1.3547, v: 1.895 }
  ]
};

let trajData = FALLBACK_TRAJ;
let pitchDeg = -2.0;

// Coordinate conversion helper: sim (x, y, z) -> three (x, z, -y)
function simToThree(x, y, z = 0) {
  return new THREE.Vector3(x, z, -y);
}

// ============================================================================
// Renderer, Scene & Camera Setup
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010204);
scene.fog = new THREE.FogExp2(0x020307, 0.0085);

const robotCamera = new THREE.PerspectiveCamera(
  78.01841587930589,
  1.7777777777777777,
  0.08,
  250
);
robotCamera.rotation.order = 'YXZ';

const chaseCamera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  250
);

// ============================================================================
// Post-Processing (Bloom + Camera Sensor / Lens Shader)
// ============================================================================
const renderPass = new RenderPass(scene, robotCamera);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.52, // strength
  0.42, // radius
  0.76  // threshold
);

const CameraLookShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0.0 },
    uSpeed: { value: 0.0 },
    uIsRobotCam: { value: 1.0 },
    uOrbAlpha: { value: 1.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uSpeed;
    uniform float uIsRobotCam;
    uniform float uOrbAlpha;
    varying vec2 vUv;

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec2 uv = vUv;
      vec2 centered = uv - 0.5;
      float r2 = dot(centered, centered);

      // Subtle wide-angle chromatic dispersion & radial softness near edges
      float ca = r2 * 0.0045 * uIsRobotCam;
      vec3 col;
      col.r = texture2D(tDiffuse, uv + centered * ca).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - centered * ca).b;

      // Slight radial blur & ground motion blur when moving fast at night
      float motionFactor = clamp(uSpeed / 2.4, 0.0, 1.0) * uIsRobotCam;
      float groundMask = smoothstep(0.45, 0.12, uv.y); // bottom of screen is uv.y < 0.5
      float edgeMask = smoothstep(0.08, 0.45, r2);
      float blurAmt = (motionFactor * groundMask * 0.014) + (edgeMask * 0.003 * uIsRobotCam);

      if (blurAmt > 0.0002) {
        vec2 dir = normalize(uv - vec2(0.5, 0.48) + vec2(0.0001));
        vec3 acc = col * 0.36;
        acc += texture2D(tDiffuse, clamp(uv + dir * blurAmt * 0.45, 0.001, 0.999)).rgb * 0.24;
        acc += texture2D(tDiffuse, clamp(uv - dir * blurAmt * 0.45, 0.001, 0.999)).rgb * 0.20;
        acc += texture2D(tDiffuse, clamp(uv + dir * blurAmt * 0.95, 0.001, 0.999)).rgb * 0.10;
        acc += texture2D(tDiffuse, clamp(uv - dir * blurAmt * 0.95, 0.001, 0.999)).rgb * 0.10;
        col = acc;
      }

      // Subtle lens dust orb near top-center (seen in real footage at u=0.538, v_top=0.062 -> uv.y=0.938)
      if (uIsRobotCam > 0.5 && uOrbAlpha > 0.01) {
        vec2 orbPos = vec2(0.538, 0.938);
        vec2 dOrb = (uv - orbPos) * vec2(1.7778, 1.0);
        float distOrb = length(dOrb);
        float orb = smoothstep(0.048, 0.018, distOrb) * (0.65 + 0.35 * smoothstep(0.015, 0.042, distOrb));
        col += vec3(0.075, 0.072, 0.068) * orb * uOrbAlpha;
      }

      // Vignette matching wide-angle robot lens
      float vig = 1.0 - r2 * (0.38 * uIsRobotCam + 0.15);
      col *= clamp(vig, 0.65, 1.0);

      // Slight shadow lift and night-camera color grade
      col = pow(max(col, vec3(0.0)), vec3(0.96, 0.97, 0.99));

      // Deterministic sensor grain
      float n = hash12(uv * vec2(1280.0, 720.0) + vec2(uTime * 37.0, uTime * 19.0)) - 0.5;
      col += n * 0.018;

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }
  `
};

const cameraLookPass = new ShaderPass(CameraLookShader);
const outputPass = new OutputPass();

const composer = new EffectComposer(renderer);
composer.addPass(renderPass);
composer.addPass(bloomPass);
composer.addPass(cameraLookPass);
composer.addPass(outputPass);

// ============================================================================
// Procedural Texture Generators (Canvas Only)
// ============================================================================
function createSeededRandom(seed = 12345) {
  let s = seed >>> 0;
  return function() {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// 1. Foreground Sidewalk & Curb Concrete Texture
function createSidewalkTextures() {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(101);

  ctx.fillStyle = '#8b929a';
  ctx.fillRect(0, 0, size, size);

  // Subtle blotches
  for (let i = 0; i < 900; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const r = 8 + rng() * 45;
    const v = Math.floor(120 + rng() * 45);
    ctx.fillStyle = `rgba(${v},${v + 3},${v + 6},0.08)`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Broom finish horizontal/diagonal fine streaks
  for (let i = 0; i < 4500; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const len = 15 + rng() * 65;
    const v = rng() > 0.5 ? 165 : 105;
    ctx.strokeStyle = `rgba(${v},${v + 2},${v + 5},0.07)`;
    ctx.lineWidth = 1 + rng() * 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len * 0.3, y + len);
    ctx.stroke();
  }

  // Fine speckle grain
  const imgData = ctx.getImageData(0, 0, size, size);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (rng() - 0.5) * 26;
    data[i] = Math.min(255, Math.max(0, data[i] + n));
    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n));
    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n));
  }
  ctx.putImageData(imgData, 0, 0);

  // Expansion joints & cracks
  ctx.strokeStyle = 'rgba(30, 32, 35, 0.55)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, size * 0.48);
  ctx.lineTo(size, size * 0.52);
  ctx.moveTo(size * 0.32, 0);
  ctx.lineTo(size * 0.28, size);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// 2. Yellow Tactile Warning Pad Texture + Bump Map
function createTactilePadTextures() {
  const w = 1024, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  const b = document.createElement('canvas');
  b.width = w; b.height = h;
  const bctx = b.getContext('2d');

  const rng = createSeededRandom(202);

  // Base yellow/ochre rubber-plastic tone
  ctx.fillStyle = '#c89d32';
  ctx.fillRect(0, 0, w, h);

  bctx.fillStyle = '#808080';
  bctx.fillRect(0, 0, w, h);

  // Grime & weathering patches
  for (let i = 0; i < 400; i++) {
    const x = rng() * w;
    const y = rng() * h;
    const r = 6 + rng() * 35;
    const dark = rng() > 0.35;
    ctx.fillStyle = dark ? 'rgba(55, 42, 15, 0.11)' : 'rgba(235, 198, 95, 0.09)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Dark border & tile seams
  ctx.strokeStyle = 'rgba(25, 20, 10, 0.85)';
  ctx.lineWidth = 10;
  ctx.strokeRect(4, 4, w - 8, h - 8);

  // Vertical tile joint breaks
  const tileCols = 4;
  for (let i = 1; i < tileCols; i++) {
    const tx = (w / tileCols) * i;
    ctx.strokeStyle = 'rgba(30, 24, 10, 0.75)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tx, 0);
    ctx.lineTo(tx, h);
    ctx.stroke();

    bctx.strokeStyle = '#303030';
    bctx.lineWidth = 5;
    bctx.beginPath();
    bctx.moveTo(tx, 0);
    bctx.lineTo(tx, h);
    bctx.stroke();
  }

  // Truncated dome grid
  const cols = 44;
  const rows = 18;
  const dx = (w - 36) / cols;
  const dy = (h - 36) / rows;
  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      const cx = 18 + (col + 0.5) * dx;
      const cy = 18 + (r + 0.5) * dy;
      const rad = Math.min(dx, dy) * 0.32;

      // Dark shadow ring on bottom/right of each dome
      ctx.fillStyle = 'rgba(38, 28, 8, 0.65)';
      ctx.beginPath();
      ctx.arc(cx + 1.5, cy + 1.8, rad * 1.05, 0, Math.PI * 2);
      ctx.fill();

      // Dome body
      const grad = ctx.createRadialGradient(cx - 1.5, cy - 1.5, rad * 0.1, cx, cy, rad);
      grad.addColorStop(0, '#f0ca62');
      grad.addColorStop(0.65, '#cfa235');
      grad.addColorStop(1, '#7a5c18');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fill();

      // Bump map dome
      const bgrad = bctx.createRadialGradient(cx, cy, rad * 0.2, cx, cy, rad * 1.1);
      bgrad.addColorStop(0, '#ffffff');
      bgrad.addColorStop(0.65, '#d0d0d0');
      bgrad.addColorStop(1, '#707070');
      bctx.fillStyle = bgrad;
      bctx.beginPath();
      bctx.arc(cx, cy, rad * 1.05, 0, Math.PI * 2);
      bctx.fill();
    }
  }

  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = 8;

  const bumpMap = new THREE.CanvasTexture(b);
  bumpMap.anisotropy = 8;

  return { map, bumpMap };
}

// 3. Asphalt Road Texture + Bump/Roughness Map
function createAsphaltTextures() {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(303);

  ctx.fillStyle = '#2d3035';
  ctx.fillRect(0, 0, size, size);

  // Road patch variations
  for (let i = 0; i < 650; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const r = 12 + rng() * 70;
    const v = Math.floor(32 + rng() * 30);
    ctx.fillStyle = `rgba(${v},${v + 2},${v + 4},0.12)`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Linear streaks along traffic/robot direction
  for (let i = 0; i < 3500; i++) {
    const x = rng() * size;
    const y = rng() * size;
    const len = 30 + rng() * 120;
    const v = rng() > 0.45 ? 65 : 22;
    ctx.strokeStyle = `rgba(${v},${v + 2},${v + 5},0.075)`;
    ctx.lineWidth = 1 + rng() * 2.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y + (rng() - 0.5) * 8);
    ctx.stroke();
  }

  // High-frequency aggregate noise
  const imgData = ctx.getImageData(0, 0, size, size);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (rng() - 0.5) * 38;
    const sparkle = rng() > 0.97 ? 28 : 0;
    data[i] = Math.min(255, Math.max(0, data[i] + n + sparkle));
    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n + sparkle));
    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n + sparkle));
  }
  ctx.putImageData(imgData, 0, 0);

  // Subtle tar crack lines
  ctx.strokeStyle = 'rgba(14, 15, 18, 0.55)';
  ctx.lineWidth = 2.0;
  for (let k = 0; k < 10; k++) {
    let cx = rng() * size;
    let cy = rng() * size;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    for (let s = 0; s < 12; s++) {
      cx += (rng() - 0.3) * 40;
      cy += (rng() - 0.5) * 40;
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  const map = new THREE.CanvasTexture(c);
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(10, 10);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = 16;

  const bumpMap = new THREE.CanvasTexture(c);
  bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
  bumpMap.repeat.set(10, 10);
  bumpMap.anisotropy = 8;

  return { map, bumpMap };
}

// 4. Manhole Cover Texture
function createManholeTexture(isDark = false) {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(isDark ? 404 : 505);

  ctx.clearRect(0, 0, size, size);

  const cx = size / 2, cy = size / 2, r = size * 0.44;
  // Outer asphalt collar
  const outerGrad = ctx.createRadialGradient(cx, cy, r * 0.85, cx, cy, r * 1.12);
  outerGrad.addColorStop(0, isDark ? 'rgba(12,14,16,0.95)' : 'rgba(24,26,30,0.9)');
  outerGrad.addColorStop(1, 'rgba(24,26,30,0)');
  ctx.fillStyle = outerGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.12, 0, Math.PI * 2);
  ctx.fill();

  // Cast iron lid
  ctx.fillStyle = isDark ? '#181c20' : '#3d424b';
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2);
  ctx.fill();

  // Concentric iron rings & waffle pattern
  ctx.strokeStyle = isDark ? '#2d333b' : '#58606d';
  ctx.lineWidth = 4;
  for (let k = 1; k <= 3; k++) {
    ctx.beginPath();
    ctx.arc(cx, cy, r * (0.28 * k), 0, Math.PI * 2);
    ctx.stroke();
  }

  for (let i = 0; i < 16; i++) {
    const ang = (i / 16) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r * 0.25, cy + Math.sin(ang) * r * 0.25);
    ctx.lineTo(cx + Math.cos(ang) * r * 0.88, cy + Math.sin(ang) * r * 0.88);
    ctx.stroke();
  }

  // Rim highlight
  ctx.strokeStyle = isDark ? 'rgba(110,120,130,0.45)' : 'rgba(150,160,175,0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 5. Text Sign Texture Generator ("BRAMAN", "HYUNDAI", Street Signs)
function createSignTexture({ text, bgColor, textColor, glowColor, width = 512, height = 128, font = 'bold 76px Arial, sans-serif', letterSpacing = 4, drawHyundaiLogo = false, border = null }) {
  const c = document.createElement('canvas');
  c.width = width;
  c.height = height;
  const ctx = c.getContext('2d');

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, width, height);

  if (border) {
    ctx.strokeStyle = border;
    ctx.lineWidth = 6;
    ctx.strokeRect(4, 4, width - 8, height - 8);
  }

  ctx.save();
  if (glowColor) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 18;
  }
  ctx.fillStyle = textColor;
  ctx.font = font;
  ctx.textBaseline = 'middle';

  let startX = width * 0.5;
  if (drawHyundaiLogo) {
    // Draw stylized oval H logo on the left
    const lx = width * 0.17;
    const ly = height * 0.5;
    ctx.strokeStyle = '#68a8ff';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.ellipse(lx, ly, 46, 26, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(lx - 20, ly + 18);
    ctx.lineTo(lx - 10, ly - 18);
    ctx.moveTo(lx + 10, ly + 18);
    ctx.lineTo(lx + 20, ly - 18);
    ctx.moveTo(lx - 15, ly);
    ctx.lineTo(lx + 15, ly);
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillText(text, width * 0.30, height * 0.52);
  } else {
    ctx.textAlign = 'center';
    ctx.fillText(text, startX, height * 0.52);
    // Double pass for crisp inner core
    ctx.shadowBlur = 4;
    ctx.fillText(text, startX, height * 0.52);
  }
  ctx.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// 6. High-Rise Residential Tower Facade Texture
function createHighRiseTexture() {
  const w = 512, h = 1024;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rng = createSeededRandom(606);

  // Pale concrete base
  ctx.fillStyle = '#383a40';
  ctx.fillRect(0, 0, w, h);

  // Vertical structural pilasters
  const cols = 6;
  const colW = w / cols;
  for (let i = 0; i <= cols; i++) {
    ctx.fillStyle = '#474952';
    ctx.fillRect(i * colW - 6, 0, 12, h);
  }

  // Floors & recessed dark balcony windows
  const floors = 32;
  const floorH = h / floors;
  for (let r = 0; r < floors; r++) {
    const y = r * floorH;
    // Floor slab band
    ctx.fillStyle = '#4a4c54';
    ctx.fillRect(0, y, w, 5);

    for (let col = 0; col < cols; col++) {
      const x = col * colW + 8;
      const ww = colW - 16;
      const wh = floorH - 8;

      // Mostly dark windows with a few warm/pinkish lit ones matching reference frames
      const isLit = (col === 2 && (r === 24 || r === 25 || r === 12 || r === 5)) || (rng() > 0.93);
      if (isLit) {
        ctx.fillStyle = rng() > 0.4 ? '#8a5d55' : '#967c62';
      } else {
        ctx.fillStyle = '#0f1115';
      }
      ctx.fillRect(x, y + 6, ww, wh);

      // Balcony railing shadow
      ctx.fillStyle = 'rgba(20, 22, 26, 0.7)';
      ctx.fillRect(x, y + 6 + wh * 0.55, ww, 3);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 7. Showroom Ceiling Downlights Texture
function createShowroomCeilingTexture() {
  const w = 512, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#bfa68f';
  ctx.fillRect(0, 0, w, h);

  // Subtle ceiling tile grid
  ctx.strokeStyle = 'rgba(90, 75, 62, 0.35)';
  ctx.lineWidth = 2;
  const step = 32;
  for (let i = 0; i <= w; i += step) {
    ctx.beginPath();
    ctx.moveTo(i, 0); ctx.lineTo(i, h);
    ctx.moveTo(0, i); ctx.lineTo(w, i);
    ctx.stroke();
  }

  // Recessed bright downlight dots
  for (let y = 32; y < h; y += 64) {
    for (let x = 32; x < w; x += 64) {
      const g = ctx.createRadialGradient(x, y, 1, x, y, 14);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, '#ffeed8');
      g.addColorStop(1, 'rgba(191,166,143,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 14, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 2);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const padSegX = 20, padSegZ = 40;

const padPos = [];
const padUvs = [];
const padIdx = [];

// Parameterize tactile pad from u (0=left tip to 1=right bottom) and v (0=near edge to 1=far curb edge)
function evalPadPoint(u, v) {
  // Left edge (u=0): near=(0.90, -0.56), far=(1.36, -0.60)
  // Mid (u=0.45): near=(0.74, 0.02), far=(1.34, 0.08)
  // Right (u=1.0): near=(0.35, 0.65), far=(0.75, 1.08)
  const zNear = -0.56 + u * 1.18 + Math.pow(u, 2) * 0.08;
  const xNear = 0.90 - u * 0.22 - Math.pow(u, 2.2) * 0.32;

  const zFar = -0.60 + u * 1.32 + Math.pow(u, 1.8) * 0.36;
  const xFar = 1.36 - u * 0.05 - Math.pow(u, 2.1) * 0.56;

  const x = THREE.MathUtils.lerp(xNear, xFar, v);
  const z = THREE.MathUtils.lerp(zNear, zFar, v);
  const y = 0.026 + Math.sin(v * Math.PI) * 0.003;
  return { x, y, z };
}

for (let iz = 0; iz <= padSegZ; iz++) {
  const u = iz / padSegZ;
  for (let ix = 0; ix <= padSegX; ix++) {
    const v = ix / padSegX;
    const p = evalPadPoint(u, v);
    padPos.push(p.x, p.y, p.z);
    padUvs.push(u, v);
  }
}
for (let iz = 0; iz < padSegZ; iz++) {
  for (let ix = 0; ix < padSegX; ix++) {
    const a = iz * (padSegX + 1) + ix;
    const b = a + 1;
    const c = (iz + 1) * (padSegX + 1) + ix;
    const d = c + 1;
    padIdx.push(a, c, b, b, c, d);
  }
}
padGeo.setAttribute('position', new THREE.Float32BufferAttribute(padPos, 3));
padGeo.setAttribute('uv', new THREE.Float32BufferAttribute(padUvs, 2));
padGeo.setIndex(padIdx);
padGeo.computeVertexNormals();

// Showroom Cars Parked Inside Behind the Glass (Blue, Red, White, Silver)
function createShowroomCar(colorHex, isSUV = false) {
  const car = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({
    color: colorHex,
    roughness: 0.2,
    metalness: 0.65
  });
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x11161d,
    roughness: 0.1,
    metalness: 0.8
  });

  const lower = new THREE.Mesh(new THREE.BoxGeometry(4.2, isSUV ? 0.82 : 0.68, 1.78), bodyMat);
  lower.position.y = isSUV ? 0.62 : 0.52;
  car.add(lower);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(isSUV ? 2.6 : 2.2, isSUV ? 0.68 : 0.56, 1.56),
    glassMat
  );
  cabin.position.set(isSUV ? -0.2 : -0.1, isSUV ? 1.25 : 1.05, 0);
  car.add(cabin);

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(isSUV ? 2.4 : 1.9, 0.08, 1.52),
    bodyMat
  );
  roof.position.set(isSUV ? -0.2 : -0.1, isSUV ? 1.60 : 1.34, 0);
  car.add(roof);

  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 16);
  wheelGeo.rotateX(Math.PI / 2);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
  for (const wx of [-1.3, 1.3]) {
    for (const wz of [-0.85, 0.85]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.position.set(wx, 0.32, wz);
      car.add(w);
    }
  }
  return car;
}

// ============================================================================
// Trajectory Interpolation & Scene Posing (window.seek)
// ============================================================================
function getPoseAtTime(t) {
  const frames = trajData.frames;
  if (!frames || frames.length === 0) {
    return { x: 0, y: 0, yaw: 0, v: 0 };
  }
  const clampedT = Math.max(frames[0].t, Math.min(t, frames[frames.length - 1].t));

  // Binary search or linear scan for interval
  let idx = 0;
  for (let i = 0; i < frames.length - 1; i++) {
    if (clampedT >= frames[i].t && clampedT <= frames[i + 1].t) {
      idx = i;
      break;
    }
  }

  const f0 = frames[idx];
  const f1 = frames[Math.min(idx + 1, frames.length - 1)];
  const dt = f1.t - f0.t;
  const alpha = dt > 1e-6 ? (clampedT - f0.t) / dt : 0.0;

  // Shortest-angle interpolation for yaw
  let dyaw = f1.yaw - f0.yaw;
  while (dyaw > Math.PI) dyaw -= Math.PI * 2;
  while (dyaw < -Math.PI) dyaw += Math.PI * 2;

  return {
    x: THREE.MathUtils.lerp(f0.x, f1.x, alpha),
    y: THREE.MathUtils.lerp(f0.y, f1.y, alpha),
    yaw: f0.yaw + dyaw * alpha,
    v: THREE.MathUtils.lerp(f0.v || 0, f1.v || 0, alpha)
  };
}

let currentTime = 0.0;

function updateSceneAtTime(t) {
  currentTime = t;
  const pose = getPoseAtTime(t);

  // Convert sim (x, y, z=0) -> three (x, 0, -y)
  const rx = pose.x;
  const rz = -pose.y;
  const ryaw = pose.yaw;

  // Slightly elevate robot as it mounts the far sidewalk after x > 16.2m
  const sidewalkLift = THREE.MathUtils.smoothstep(rx, 16.0, 17.5) * 0.055;

  // Pose Robot Group
  robotGroup.position.set(rx, sidewalkLift, rz);
  robotGroup.rotation.y = ryaw;

  // Spin robot wheels proportionally to x+y distance
  const wheelAngle = (rx * 1.1) / 0.095;
  for (const w of robotWheels) {
    w.rotation.z = -wheelAngle;
  }

  // Pose Robot First-Person Camera
  const camHeight = (trajData.camera && trajData.camera.height_m) ? trajData.camera.height_m : 0.456;
  robotCamera.position.set(rx, camHeight + sidewalkLift, rz);
  robotCamera.rotation.y = ryaw - Math.PI / 2;
  robotCamera.rotation.x = THREE.MathUtils.degToRad(pitchDeg);
  robotCamera.rotation.z = 0;

  // Pose Chase Camera (3m behind and 1.4m above the robot)
  const backDist = 3.0;
  const upDist = 1.45;
  chaseCamera.position.set(
    rx - Math.cos(ryaw) * backDist,
    sidewalkLift + upDist,
    rz + Math.sin(ryaw) * backDist
  );
  chaseCamera.lookAt(
    rx + Math.cos(ryaw) * 1.5,
    sidewalkLift + 0.45,
    rz - Math.sin(ryaw) * 1.5
  );

  // Toggle robot mesh visibility
  robotVisuals.visible = (camMode === 'chase');
  renderPass.camera = (camMode === 'chase') ? chaseCamera : robotCamera;

  // Update Shader Uniforms
  cameraLookPass.uniforms.uTime.value = t;
  cameraLookPass.uniforms.uSpeed.value = Math.abs(pose.v);
  cameraLookPass.uniforms.uIsRobotCam.value = (camMode === 'robot') ? 1.0 : 0.0;
  // Lens dust orb is visible before the robot reaches the far curb
  cameraLookPass.uniforms.uOrbAlpha.value = 1.0 - THREE.MathUtils.smoothstep(t, 12.0, 14.0);

  // ==========================================================================
  // Animate Moving Vehicles & Traffic Lights
  // ==========================================================================
  // 1. Silver Sedan (Frame 1 at t = 0.94):
  // At t = 0.94: center at (X = 6.75, Z = +5.35), angled towards +Z and slightly -X
  if (t >= -0.5 && t <= 2.6) {
    silverSedan.visible = true;
    const dt1 = t - 0.94;
    const speed1 = 9.2;
    const dirX = -0.26;
    const dirZ = 0.965;
    silverSedan.position.set(
      6.75 + dirX * speed1 * dt1,
      0.0,
      5.35 + dirZ * speed1 * dt1
    );
    silverSedan.rotation.y = Math.atan2(-dirZ, dirX);
  } else {
    silverSedan.visible = false;
  }

  // 2. Red Pickup Truck (Frame 2 at t = 4.12):
  // At t = 4.12: center at (X = 3.95, Z = -3.35), moving along +Z (left-to-right across screen)
  if (t >= 2.6 && t <= 5.8) {
    redPickup.visible = true;
    const dt2 = t - 4.12;
    const speed2 = 10.8;
    redPickup.position.set(
      3.95 - 0.08 * speed2 * dt2,
      0.0,
      -3.35 + speed2 * dt2
    );
    redPickup.rotation.y = -Math.PI / 2 - 0.08;
  } else {
    redPickup.visible = false;
  }

  // 3. Distant Car Waiting on the Right (Frame 3 at t = 7.50)
  if (t >= 5.5 && t <= 9.8) {
    distantCarGroup.visible = true;
    distantCarGroup.position.set(11.5, 0.0, 15.2);
    distantCarGroup.rotation.y = 0.15;
  } else {
    distantCarGroup.visible = false;
  }

  // 4. Traffic Signal Light State (RED for t < 6.2s, GREEN for t >= 6.2s)
  const isGreen = (t >= 6.2);
  centerSigLeft.material = isGreen ? centerSigMatGreen : centerSigMatRed;
  centerSigRight.material = isGreen ? centerSigMatGreen : centerSigMatRed;

  // Pedestrian WALK signal on far corner pole (turns white WALK in Frame 5)
  pedWalkBulb.visible = (t >= 12.0);
}

// ============================================================================
// Contract API: window.seek(t), window.duration, window.__ready
// ============================================================================
window.duration = trajData.frames[trajData.frames.length - 1].t;

window.seek = function(t) {
  updateSceneAtTime(t);
  composer.render();
  if (!isCapture) {
    scrubber.value = t;
    timeLabel.textContent = t.toFixed(2) + 's';
  }
};

// ============================================================================
// Interactive UI & Playback Loop
// ============================================================================
const playBtn = document.getElementById('playBtn');
const scrubber = document.getElementById('scrubber');
const timeLabel = document.getElementById('timeLabel');
const camBtn = document.getElementById('camBtn');
const pitchSlider = document.getElementById('pitchSlider');

let isPlaying = !isCapture;
let lastFrameWallTime = performance.now();

camBtn.textContent = `Cam: ${camMode === 'chase' ? 'Chase' : 'Robot'}`;

playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? 'Pause' : 'Play';
  lastFrameWallTime = performance.now();
});

scrubber.addEventListener('input', (e) => {
  isPlaying = false;
  playBtn.textContent = 'Play';
  window.seek(parseFloat(e.target.value));
});

camBtn.addEventListener('click', () => {
  camMode = (camMode === 'robot') ? 'chase' : 'robot';
  camBtn.textContent = `Cam: ${camMode === 'chase' ? 'Chase' : 'Robot'}`;
  window.seek(currentTime);
});

pitchSlider.addEventListener('input', (e) => {
  pitchDeg = parseFloat(e.target.value);
  window.seek(currentTime);
});

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  chaseCamera.aspect = w / h;
  chaseCamera.updateProjectionMatrix();
  window.seek(currentTime);
});

function animate(now) {
  requestAnimationFrame(animate);
  if (!isPlaying) return;
  const dt = Math.min((now - lastFrameWallTime) / 1000, 0.1);
  lastFrameWallTime = now;
  let nextT = currentTime + dt;
  if (nextT > window.duration) nextT = 0.0;
  window.seek(nextT);
}

// ============================================================================
// Initialization (Fetch Trajectory if URL param provided, then render Frame 0)
// ============================================================================
async function init() {
  if (trajUrl) {
    try {
      const resp = await fetch(trajUrl);
      if (resp.ok) {
        const json = await resp.json();
        if (json && Array.isArray(json.frames) && json.frames.length > 0) {
          trajData = json;
          if (json.camera) {
            if (json.camera.vfov_deg) robotCamera.fov = json.camera.vfov_deg;
            if (json.camera.aspect) robotCamera.aspect = json.camera.aspect;
            robotCamera.updateProjectionMatrix();
          }
        }
      }
    } catch (err) {
      console.warn('Using fallback trajectory:', err);
    }
  }

  window.duration = trajData.frames[trajData.frames.length - 1].t;
  scrubber.max = window.duration;

  // Render initial frame synchronously and mark ready
  window.seek(0.0);
  window.__ready = true;

  if (!isCapture) {
    lastFrameWallTime = performance.now();
    requestAnimationFrame(animate);
  }
}

init();
