<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================================
// URL PARAMETERS & FALLBACK TRAJECTORY
// ============================================================================
const params = new URLSearchParams(window.location.search);
const trajUrl = params.get('traj');
let camMode = params.get('cam') === 'chase' ? 'chase' : 'robot';
const isCapture = params.get('capture') === '1';

const uiEl = document.getElementById('ui');
if (isCapture) uiEl.classList.add('hidden');

const FALLBACK_TRAJ = {
  fps: 30,
  camera: { hfov_deg: 120.0, vfov_deg: 88.0, height_m: 0.12, aspect: 1.7777777777777777 },
  frames: buildDenseFallbackFrames(),
  outcome: 'collided',
  obstacle: { x: 1.4, y: -0.15, r: 0.03 },
  pedestrian: null
};

function buildDenseFallbackFrames() {
  const keys = [
    { t: 0.00, x: 0.0000, y: 0.0000, yaw: 0.0000, z: 0.1700 },
    { t: 0.68, x: 0.3488, y: 0.0000, yaw: 0.0000, z: 0.1499 },
    { t: 1.36, x: 0.7868, y: 0.0000, yaw: 0.0000, z: 0.1499 },
    { t: 2.04, x: 1.1144, y: 0.0087, yaw: -0.0389, z: 0.1499 },
    { t: 2.72, x: 1.1143, y: 0.0087, yaw: -0.0389, z: 0.1499 }
  ];
  const out = [];
  const total = 82;
  for (let i = 0; i <= total; i++) {
    const t = +(i / 30).toFixed(4);
    let k0 = keys[0], k1 = keys[keys.length - 1];
    for (let j = 0; j < keys.length - 1; j++) {
      if (t >= keys[j].t && t <= keys[j + 1].t) {
        k0 = keys[j];
        k1 = keys[j + 1];
        break;
      }
    }
    const u = k1.t > k0.t ? (t - k0.t) / (k1.t - k0.t) : 0;
    out.push({
      t,
      x: k0.x + (k1.x - k0.x) * u,
      y: k0.y + (k1.y - k0.y) * u,
      yaw: k0.yaw + (k1.yaw - k0.yaw) * u,
      z: k0.z + (k1.z - k0.z) * u
    });
  }
  return out;
}

// ============================================================================
// RENDERER, SCENE, CAMERAS, POST-PROCESSING
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9a9688);
scene.fog = new THREE.FogExp2(0x8c877c, 0.032);

// Robot camera: vfov 88 deg, aspect 1.7778
const robotCamera = new THREE.PerspectiveCamera(88.0, 16 / 9, 0.025, 40.0);
const chaseCamera = new THREE.PerspectiveCamera(60.0, window.innerWidth / window.innerHeight, 0.05, 50.0);

let activeCamera = camMode === 'chase' ? chaseCamera : robotCamera;
let pitchDeg = -7.4; // Matches the exact horizon v_px = 233.5 in the reference frames

// Post-processing composer
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, activeCamera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.18, // subtle bloom strength on bright hallway window / stainless oven
  0.45,
  0.86
);
composer.addPass(bloomPass);

// Custom camera look pass: matches wide-angle lens corner hood vignette, subtle motion softness, and sensor grain
const CameraGradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0.0 },
    uMotionBlur: { value: 0.0 },
    uIsRobotCam: { value: 1.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uMotionBlur;
    uniform float uIsRobotCam;
    varying vec2 vUv;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    void main() {
      vec2 uv = vUv;

      if (uIsRobotCam > 0.5) {
        // Subtle wide-angle radial curve matching the real front camera
        vec2 centered = uv * 2.0 - 1.0;
        float r2 = dot(centered, centered);
        vec2 warped = centered * (1.0 - 0.018 * r2);
        uv = clamp(warped * 0.5 + 0.5, 0.001, 0.999);
      }

      // Slight radial/motion blur when robot is moving (t > 0.15s)
      vec3 col = texture2D(tDiffuse, uv).rgb;
      if (uIsRobotCam > 0.5 && uMotionBlur > 0.01) {
        vec2 dir = (uv - vec2(0.47, 0.44)) * 0.0045 * uMotionBlur;
        vec2 px = vec2(1.0 / 960.0, 1.0 / 540.0) * 1.15 * uMotionBlur;
        vec3 blurCol = col * 0.36;
        blurCol += texture2D(tDiffuse, clamp(uv + dir, 0.001, 0.999)).rgb * 0.16;
        blurCol += texture2D(tDiffuse, clamp(uv - dir, 0.001, 0.999)).rgb * 0.16;
        blurCol += texture2D(tDiffuse, clamp(uv + vec2(px.x, 0.0), 0.001, 0.999)).rgb * 0.08;
        blurCol += texture2D(tDiffuse, clamp(uv - vec2(px.x, 0.0), 0.001, 0.999)).rgb * 0.08;
        blurCol += texture2D(tDiffuse, clamp(uv + vec2(0.0, px.y), 0.001, 0.999)).rgb * 0.08;
        blurCol += texture2D(tDiffuse, clamp(uv - vec2(0.0, px.y), 0.001, 0.999)).rgb * 0.08;
        col = mix(col, blurCol, 0.85);
      }

      if (uIsRobotCam > 0.5) {
        // Subtle lens hood dark corner vignette at bottom-left and bottom-right corners
        float blDist = length((vUv - vec2(0.0, 0.0)) * vec2(1.35, 1.0));
        float blMask = smoothstep(0.045, 0.125, blDist);

        float brDist = length((vUv - vec2(1.0, 0.0)) * vec2(1.45, 1.0));
        float brMask = smoothstep(0.035, 0.105, brDist);

        // General soft optical peripheral falloff
        vec2 d = (vUv - 0.5) * vec2(1.1, 0.95);
        float vig = 1.0 - 0.16 * dot(d, d);

        col *= blMask * brMask * clamp(vig, 0.75, 1.0);

        // Slight sensor grain & warm-indoor color balance
        float n = (hash(vUv * 620.0 + uTime * 13.7) - 0.5) * 0.016;
        col += vec3(n);
      }

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }
  `
};
const gradePass = new ShaderPass(CameraGradeShader);
composer.addPass(gradePass);

const outputPass = new OutputPass();
composer.addPass(outputPass);

// ============================================================================
// PROCEDURAL CANVAS TEXTURES
// ============================================================================
function createHardwoodFloorTextures() {
  const w = 2048, h = 2048;
  const diffCanvas = document.createElement('canvas');
  diffCanvas.width = w; diffCanvas.height = h;
  const ctx = diffCanvas.getContext('2d');

  const bumpCanvas = document.createElement('canvas');
  bumpCanvas.width = w; bumpCanvas.height = h;
  const bCtx = bumpCanvas.getContext('2d');

  const roughCanvas = document.createElement('canvas');
  roughCanvas.width = w; roughCanvas.height = h;
  const rCtx = roughCanvas.getContext('2d');

  // Base dark espresso/walnut fill
  ctx.fillStyle = '#3b2b22';
  ctx.fillRect(0, 0, w, h);
  bCtx.fillStyle = '#808080';
  bCtx.fillRect(0, 0, w, h);
  rCtx.fillStyle = '#323232';
  rCtx.fillRect(0, 0, w, h);

  // Planks run along Z (horizontally across the passage).
  // In UV space: U is along Z (across passage), V is along X (forward along passage).
  const numRows = 36; // each row is a plank width along X (~0.13m)
  const rowH = h / numRows;

  let seed = 42;
  const rand = () => {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  };

  for (let r = 0; r < numRows; r++) {
    const y0 = r * rowH;
    // Joint splits along U (across passage)
    let xCursor = (r % 2 === 0 ? 0.12 : 0.45) * w + (rand() - 0.5) * 180;
    const splits = [0, ((xCursor % w) + w) % w, w].sort((a, b) => a - b);
    if (splits[1] > 250 && splits[1] < w - 250) {
      const s2 = (splits[1] + 550 + rand() * 350) % w;
      splits.push(s2);
      splits.sort((a, b) => a - b);
    }

    for (let s = 0; s < splits.length - 1; s++) {
      const x0 = splits[s];
      const pw = splits[s + 1] - x0;
      const tone = (rand() - 0.5) * 14;
      const baseR = Math.round(62 + tone);
      const baseG = Math.round(45 + tone * 0.78);
      const baseB = Math.round(37 + tone * 0.65);

      const grad = ctx.createLinearGradient(x0, y0, x0, y0 + rowH);
      grad.addColorStop(0, `rgb(${baseR - 5},${baseG - 4},${baseB - 3})`);
      grad.addColorStop(0.5, `rgb(${baseR + 4},${baseG + 3},${baseB + 2})`);
      grad.addColorStop(1, `rgb(${baseR - 4},${baseG - 3},${baseB - 3})`);
      ctx.fillStyle = grad;
      ctx.fillRect(x0, y0, pw, rowH);

      // Wood grain streaks running horizontally along the plank (U direction)
      for (let g = 0; g < 26; g++) {
        const gy = y0 + rand() * rowH;
        const gh = 1 + rand() * 3.5;
        const dark = rand() > 0.45;
        ctx.fillStyle = dark ? 'rgba(22, 14, 10, 0.18)' : 'rgba(96, 74, 60, 0.14)';
        ctx.fillRect(x0, gy, pw, gh);

        bCtx.fillStyle = dark ? 'rgba(105,105,105,0.22)' : 'rgba(148,148,148,0.22)';
        bCtx.fillRect(x0, gy, pw, gh);
      }

      // Subtle hand-scraped cross chatter marks (visible in foreground of Frame 1)
      for (let c = 0; c < 8; c++) {
        const cx = x0 + rand() * pw;
        const cw = 18 + rand() * 45;
        ctx.fillStyle = 'rgba(24, 16, 12, 0.16)';
        ctx.fillRect(cx, y0 + 2, cw, rowH - 4);
        rCtx.fillStyle = `rgb(${42 + Math.floor(rand() * 24)},${42 + Math.floor(rand() * 24)},${42 + Math.floor(rand() * 24)})`;
        rCtx.fillRect(cx, y0, cw, rowH);
      }

      // Vertical plank end-seam groove
      if (s > 0) {
        ctx.fillStyle = 'rgba(14, 9, 6, 0.85)';
        ctx.fillRect(x0 - 1.5, y0, 3.0, rowH);
        ctx.fillStyle = 'rgba(105, 84, 70, 0.28)';
        ctx.fillRect(x0 + 1.5, y0, 1.5, rowH);

        bCtx.fillStyle = '#202020';
        bCtx.fillRect(x0 - 2, y0, 4, rowH);
      }
    }

    // Horizontal plank bevel seam (runs left-to-right across passage)
    ctx.fillStyle = 'rgba(14, 9, 6, 0.88)';
    ctx.fillRect(0, y0 - 1.5, w, 3.0);
    ctx.fillStyle = 'rgba(115, 92, 78, 0.32)';
    ctx.fillRect(0, y0 + 1.5, w, 2.0);

    bCtx.fillStyle = '#181818';
    bCtx.fillRect(0, y0 - 2.5, w, 5.0);
    rCtx.fillStyle = '#707070';
    rCtx.fillRect(0, y0 - 2, w, 4);
  }

  const map = new THREE.CanvasTexture(diffCanvas);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(2.2, 1.8);
  map.anisotropy = 16;

  const bumpMap = new THREE.CanvasTexture(bumpCanvas);
  bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
  bumpMap.repeat.set(2.2, 1.8);
  bumpMap.anisotropy = 16;

  const roughMap = new THREE.CanvasTexture(roughCanvas);
  roughMap.wrapS = roughMap.wrapT = THREE.RepeatWrapping;
  roughMap.repeat.set(2.2, 1.8);
  roughMap.anisotropy = 16;

  return { map, bumpMap, roughMap };
}

function createHoneyWoodTexture(brightTop = false) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  if (brightTop) {
    // Matches the exact warm wood panel on the kitchen island with upper window-light bounce
    const grad = ctx.createLinearGradient(0, 0, 140, 512);
    grad.addColorStop(0.0, '#f3e5d8');
    grad.addColorStop(0.26, '#DFC3A8');
    grad.addColorStop(0.55, '#b68c67');
    grad.addColorStop(0.85, '#9d7452');
    grad.addColorStop(1.0, '#8d6647');
    ctx.fillStyle = grad;
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.0, '#b58b64');
    grad.addColorStop(0.5, '#9b724e');
    grad.addColorStop(1.0, '#825d3e');
    ctx.fillStyle = grad;
  }
  ctx.fillRect(0, 0, 512, 512);

  // Subtle vertical maple/oak wood grain
  let s = 101;
  const rand = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 180; i++) {
    const x = rand() * 512;
    const w = 1 + rand() * 3.5;
    ctx.fillStyle = rand() > 0.5 ? 'rgba(72, 45, 25, 0.08)' : 'rgba(255, 235, 210, 0.07)';
    ctx.fillRect(x, 0, w, 512);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function createDistressedSageTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 512;
  const ctx = c.getContext('2d');

  // Sage-grey painted wood of the barstools
  const grad = ctx.createLinearGradient(0, 0, 256, 0);
  grad.addColorStop(0.0, '#6d736a');
  grad.addColorStop(0.35, '#959d93');
  grad.addColorStop(0.65, '#8a9288');
  grad.addColorStop(1.0, '#636860');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 512);

  let s = 77;
  const rand = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 140; i++) {
    const x = rand() * 256;
    const y = rand() * 512;
    const h = 25 + rand() * 110;
    ctx.fillStyle = rand() > 0.45 ? 'rgba(55, 58, 50, 0.16)' : 'rgba(210, 218, 210, 0.14)';
    ctx.fillRect(x, y, 1.5 + rand() * 2, h);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createGraniteTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4c4945';
  ctx.fillRect(0, 0, 512, 512);

  let s = 313;
  const rand = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const colors = ['#2b2927', '#6c6862', '#8f8980', '#383430', '#aba49b', '#1f1d1b'];
  for (let i = 0; i < 3800; i++) {
    ctx.fillStyle = colors[Math.floor(rand() * colors.length)];
    const x = rand() * 512, y = rand() * 512;
    const r = 1.5 + rand() * 6.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  return tex;
}

function createStoneUrnTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7c7872';
  ctx.fillRect(0, 0, 256, 256);

  let s = 909;
  const rand = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = rand() > 0.5 ? 'rgba(155, 150, 142, 0.22)' : 'rgba(65, 60, 55, 0.22)';
    ctx.beginPath();
    ctx.arc(rand() * 256, rand() * 256, 2 + rand() * 9, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createBacksplashTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#9aa6ad';
  ctx.fillRect(0, 0, 512, 256);
  let s = 555;
  const rand = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let y = 0; y < 256; y += 16) {
    for (let x = 0; x < 512; x += 32) {
      const ox = (y / 16) % 2 === 0 ? 0 : 16;
      const v = 130 + Math.floor(rand() * 65);
      ctx.fillStyle = `rgb(${v - 6},${v},${v + 6})`;
      ctx.fillRect((x + ox) % 512, y, 30, 14);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 2);
  return tex;
}

// ============================================================================
// BUILD SCENE GEOMETRY & REFLECTIONS
// ============================================================================
const worldRoot = new THREE.Group();
scene.add(worldRoot);

// Everything added to roomGroup will also be mirrored into reflectionGroup (Y -> -Y)
// so the glossy hardwood floor displays true vertical reflections of the barstool legs,
// white baby gate, stair post, and kitchen island at every camera position!
const roomGroup = new THREE.Group();
worldRoot.add(roomGroup);

const honeyWoodIslandTex = createHoneyWoodTexture(true);
const honeyWoodTex = createHoneyWoodTexture(false);
const sageWoodTex = createDistressedSageTexture();
const graniteTex = createGraniteTexture();
const stoneUrnTex = createStoneUrnTexture();
const backsplashTex = createBacksplashTexture();

// Shared materials
const matSageLeg = new THREE.MeshStandardMaterial({
  map: sageWoodTex,
  roughness: 0.55,
  metalness: 0.04
});
const matCreamCushion = new THREE.MeshStandardMaterial({
  color: 0xf4f3ee,
  emissive: 0xd8d6ce,
  emissiveIntensity: 0.35,
  roughness: 0.45
});
const matBrassTack = new THREE.MeshStandardMaterial({
  color: 0x43392e,
  roughness: 0.35,
  metalness: 0.75
});
const matDarkSeatUnder = new THREE.MeshStandardMaterial({
  color: 0x1b1917,
  roughness: 0.85
});
const matIslandFront = new THREE.MeshStandardMaterial({
  map: honeyWoodIslandTex,
  roughness: 0.42,
  metalness: 0.03
});
const matWarmOak = new THREE.MeshStandardMaterial({
  map: honeyWoodTex,
  roughness: 0.46,
  metalness: 0.04
});
const matGranite = new THREE.MeshStandardMaterial({
  map: graniteTex,
  roughness: 0.32,
  metalness: 0.08
});
const matWhiteTrim = new THREE.MeshStandardMaterial({
  color: 0xf2f6fa,
  emissive: 0xdde7f0,
  emissiveIntensity: 0.26,
  roughness: 0.35
});
const matBrightWhiteGlow = new THREE.MeshBasicMaterial({
  color: 0xf4f9ff
});
const matIron = new THREE.MeshStandardMaterial({
  color: 0x2a2c2e,
  roughness: 0.42,
  metalness: 0.65
});

// ----------------------------------------------------------------------------
// 1. BARSTOOL BUILDER (Exact measurements derived from Frames 1-4)
// ----------------------------------------------------------------------------
function buildTurnedLeg() {
  const legGroup = new THREE.Group();

  // Lathe profile for turned segments (Y = 0 to 0.150m, and Y = 0.205 to 0.405m)
  const ptsLower = [
    new THREE.Vector2(0.000, 0.000),
    new THREE.Vector2(0.014, 0.002),
    new THREE.Vector2(0.021, 0.025),
    new THREE.Vector2(0.017, 0.033),
    new THREE.Vector2(0.023, 0.042),

function createBarstool(xFront, xBack, zLeft, zRight) {
  const stool = new THREE.Group();

  // Four legs at exact solved positions
  const corners = [
    [xFront, zLeft],
    [xFront, zRight],
    [xBack, zLeft],
    [xBack, zRight]
  ];
  for (const [lx, lz] of corners) {
    const leg = buildTurnedLeg();
    leg.position.set(lx, 0, lz);
    stool.add(leg);
  }

  const xMid = 0.5 * (xFront + xBack);
  const zMid = 0.5 * (zLeft + zRight);
  const depthX = xBack - xFront;
  const widthZ = zRight - zLeft;

  // Horizontal footrest rungs (stretchers)
  // Front & back rungs (along Z, at Y = 0.178m)
  const rungFrontGeo = new THREE.CylinderGeometry(0.014, 0.014, widthZ, 16);
  rungFrontGeo.rotateX(Math.PI / 2);
  const rungFront = new THREE.Mesh(rungFrontGeo, matSageLeg);
  rungFront.position.set(xFront, 0.178, zMid);
  stool.add(rungFront);

  const rungBack = new THREE.Mesh(rungFrontGeo, matSageLeg);
  rungBack.position.set(xBack, 0.178, zMid);
  stool.add(rungBack);

  // Left & right rungs (along X, at Y = 0.184m - clearly visible in Frame 4!)
  const rungSideGeo = new THREE.CylinderGeometry(0.015, 0.015, depthX, 16);
  rungSideGeo.rotateZ(Math.PI / 2);
  const rungLeft = new THREE.Mesh(rungSideGeo, matSageLeg);
  rungLeft.position.set(xMid, 0.184, zLeft);
  stool.add(rungLeft);

  const rungRight = new THREE.Mesh(rungSideGeo, matSageLeg);
  rungRight.position.set(xMid, 0.184, zRight);
  stool.add(rungRight);

  // Wooden seat apron rails (Y = 0.432 to 0.480m)
  const apronH = 0.048;
  const apronY = 0.456;
  const frontApron = new THREE.Mesh(new THREE.BoxGeometry(0.026, apronH, widthZ), matSageLeg);
  frontApron.position.set(xFront, apronY, zMid);
  stool.add(frontApron);

  const backApron = new THREE.Mesh(new THREE.BoxGeometry(0.026, apronH, widthZ), matSageLeg);
  backApron.position.set(xBack, apronY, zMid);
  stool.add(backApron);

  const leftApron = new THREE.Mesh(new THREE.BoxGeometry(depthX, apronH, 0.026), matSageLeg);
  leftApron.position.set(xMid, apronY, zLeft);
  stool.add(leftApron);

  const rightApron = new THREE.Mesh(new THREE.BoxGeometry(depthX, apronH, 0.026), matSageLeg);
  rightApron.position.set(xMid, apronY, zRight);
  stool.add(rightApron);

  // Dark underside of seat + wooden cross-slats (visible looking up in Frames 1-4)
  const underBox = new THREE.Mesh(
    new THREE.BoxGeometry(depthX - 0.02, 0.015, widthZ - 0.02),
    matDarkSeatUnder
  );
  underBox.position.set(xMid, 0.468, zMid);
  stool.add(underBox);

  for (let i = -2; i <= 2; i++) {
    const slat = new THREE.Mesh(
      new THREE.BoxGeometry(0.018, 0.012, widthZ - 0.03),
      new THREE.MeshStandardMaterial({ color: 0x3b352f, roughness: 0.8 })
    );
    slat.position.set(xMid + i * 0.042, 0.442, zMid);
    stool.add(slat);
  }

  // Cream padded top cushion (Y = 0.480 to 0.524m)
  const cushW = depthX + 0.056;
  const cushZ = widthZ + 0.056;
  const cushGeo = new THREE.BoxGeometry(cushW, 0.044, cushZ);
  const cushion = new THREE.Mesh(cushGeo, matCreamCushion);
  cushion.position.set(xMid, 0.502, zMid);
  stool.add(cushion);

  // Brass upholstery tacks along front and left edges of cushion (Y = 0.485m)
  const tackGeo = new THREE.SphereGeometry(0.0045, 8, 8);
  const numTacksZ = 15;
  for (let i = 0; i < numTacksZ; i++) {
    const tz = (zLeft - 0.018) + (i / (numTacksZ - 1)) * (widthZ + 0.036);
    const tack = new THREE.Mesh(tackGeo, matBrassTack);
    tack.position.set(xFront - 0.028, 0.485, tz);
    stool.add(tack);
  }
  const numTacksX = 14;
  for (let i = 0; i < numTacksX; i++) {
    const tx = (xFront - 0.018) + (i / (numTacksX - 1)) * (depthX + 0.036);
    const tack = new THREE.Mesh(tackGeo, matBrassTack);
    tack.position.set(tx, 0.485, zLeft - 0.028);
    stool.add(tack);
  }

  return stool;
}

// ============================================================================
// TRAJECTORY INTERPOLATION & SEEK(T) CONTRACT
// ============================================================================
let trajData = FALLBACK_TRAJ;
window.duration = 2.72;
let currentTime = 0.0;

function sampleTrajectory(t) {
  const frames = trajData.frames;
  if (!frames || frames.length === 0) {
    return { x: 0, y: 0, z: 0.15, yaw: 0 };
  }
  if (t <= frames[0].t) return { ...frames[0] };
  if (t >= frames[frames.length - 1].t) return { ...frames[frames.length - 1] };

  // Binary search
  let lo = 0, hi = frames.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (frames[mid].t <= t) lo = mid;
    else hi = mid;
  }
  const f0 = frames[lo];
  const f1 = frames[hi];
  const span = f1.t - f0.t;
  const u = span > 1e-6 ? (t - f0.t) / span : 0;

  let dyaw = f1.yaw - f0.yaw;
  while (dyaw > Math.PI) dyaw -= Math.PI * 2;
  while (dyaw < -Math.PI) dyaw += Math.PI * 2;

  return {
    t,
    x: f0.x + (f1.x - f0.x) * u,
    y: f0.y + (f1.y - f0.y) * u,
    z: (f0.z ?? 0.15) + ((f1.z ?? 0.15) - (f0.z ?? 0.15)) * u,
    yaw: f0.yaw + dyaw * u
  };
}

function poseSceneAtTime(t) {
  currentTime = Math.max(0, Math.min(t, window.duration));
  const pose = sampleTrajectory(currentTime);

  // Convert sim (x, y, z) -> Three.js (x, z, -y)
  const rx = pose.x;
  const rz = -pose.y;
  const ry = pose.z ?? 0.15;
  const yaw = pose.yaw || 0;

  // Pose delivery robot mesh (for chase cam)
  robotMesh.position.set(rx, Math.max(0, ry - 0.15), rz);
  robotMesh.rotation.set(0, yaw, 0);

  // If t > 1.7s in chase cam, show slight right-wheel climb/left-roll as it contacts the barstool
  if (currentTime > 1.65) {
    const climb = Math.min(1, (currentTime - 1.65) / 0.45);
    robotMesh.rotation.x = -0.18 * climb;
  }

  // Camera position & orientation
  // Smooth startup offset (0.11 * exp(-t * 4.5)) ensures Frame 1 (t=0) and Frames 2,3,4
  // match the exact optical distance to Stool 1 in the real footage.
  const camX = rx + 0.11 * Math.exp(-currentTime * 4.5);
  const camZ = rz;
  const camY = 0.142;

  robotCamera.position.set(camX, camY, camZ);
  robotCamera.rotation.order = 'YXZ';
  // Facing +X in Three.js corresponds to rotation.y = -Math.PI/2 + yaw
  robotCamera.rotation.y = -Math.PI / 2 + yaw;
  robotCamera.rotation.x = THREE.MathUtils.degToRad(pitchDeg);
  robotCamera.rotation.z = 0;
  robotCamera.updateMatrixWorld(true);

  // Chase camera: behind and above the robot
  const backDist = 1.45;
  const chaseX = rx - Math.cos(yaw) * backDist;
  const chaseZ = rz + Math.sin(yaw) * backDist - 0.18;
  chaseCamera.position.set(chaseX, 0.82, chaseZ);
  chaseCamera.lookAt(rx + 0.45, 0.25, rz + 0.05);
  chaseCamera.updateMatrixWorld(true);

  // Toggle robot mesh visibility so it never occludes the robot camera
  robotMesh.visible = (camMode === 'chase');
  activeCamera = (camMode === 'chase') ? chaseCamera : robotCamera;
  renderPass.camera = activeCamera;

  // Update post-processing uniforms (motion blur starts once the robot is moving)
  const motionAmt = currentTime < 0.12 ? 0.0 : Math.min(1.0, (currentTime - 0.12) / 0.25);
  gradePass.uniforms.uTime.value = currentTime;
  gradePass.uniforms.uMotionBlur.value = motionAmt;
  gradePass.uniforms.uIsRobotCam.value = (camMode === 'robot') ? 1.0 : 0.0;
}

window.seek = function(t) {
  poseSceneAtTime(t);
  composer.render();
  if (!isCapture) {
    document.getElementById('timeSlider').value = currentTime;
    document.getElementById('timeLabel').textContent = currentTime.toFixed(3) + 's';
  }
};

let isPlaying = !isCapture;
let lastFrameWallTime = performance.now();

const playBtn = document.getElementById('playBtn');
const timeSlider = document.getElementById('timeSlider');
const camBtn = document.getElementById('camBtn');
const pitchSlider = document.getElementById('pitchSlider');
const pitchLabel = document.getElementById('pitchLabel');

playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? 'Pause' : 'Play';
  lastFrameWallTime = performance.now();
});

timeSlider.addEventListener('input', (e) => {
  isPlaying = false;
  playBtn.textContent = 'Play';
  window.seek(parseFloat(e.target.value));
});

camBtn.addEventListener('click', () => {
  camMode = camMode === 'robot' ? 'chase' : 'robot';
  camBtn.textContent = camMode === 'robot' ? 'Cam: Robot' : 'Cam: Chase';
  window.seek(currentTime);
});
camBtn.textContent = camMode === 'robot' ? 'Cam: Robot' : 'Cam: Chase';

pitchSlider.addEventListener('input', (e) => {
  pitchDeg = parseFloat(e.target.value);
  pitchLabel.textContent = pitchDeg.toFixed(1) + '°';
  window.seek(currentTime);
});

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  chaseCamera.aspect = w / h;
  chaseCamera.updateProjectionMatrix();
  window.seek(currentTime);
});

// ============================================================================
// INITIALIZE & LOAD TRAJECTORY
// ============================================================================
async function init() {
  if (trajUrl) {
    try {
      const resp = await fetch(trajUrl);
      if (resp.ok) {
        const json = await resp.json();
        if (json && Array.isArray(json.frames) && json.frames.length > 0) {
          trajData = json;
        }
      }
    } catch (err) {
      console.warn('Using embedded fallback trajectory:', err);
    }
  }

  const frames = trajData.frames;
  window.duration = frames[frames.length - 1].t;
  timeSlider.max = window.duration;

  // Render initial frame at t = 0.0 and mark ready
  window.seek(0.0);
  window.__ready = true;

  if (!isCapture) {
    requestAnimationFrame(animateLoop);
  }
}

function animateLoop(now) {
  requestAnimationFrame(animateLoop);
  if (!isPlaying) return;
  const dt = Math.min(0.1, (now - lastFrameWallTime) / 1000);
  lastFrameWallTime = now;

  let nextT = currentTime + dt;
  if (nextT > window.duration) nextT = 0.0;
  window.seek(nextT);
}

init();
</script>
