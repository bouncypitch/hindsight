<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidewalk Delivery Robot — Trajectory Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10141a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f3f5f8;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 290px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(15, 19, 26, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      font-size: 13px;
    }
    #hud.hidden {
      display: none !important;
    }
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .hud-title {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.03em;
      color: #dce3ec;
      text-transform: uppercase;
    }
    .outcome-badge {
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .outcome-badge.fell, .outcome-badge.tipped, .outcome-badge.failed, .outcome-badge.stuck {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.5);
    }
    .outcome-badge.safe, .outcome-badge.success, .outcome-badge.ok, .outcome-badge.passed, .outcome-badge.crossed {
      background: rgba(34, 197, 94, 0.25);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.5);
    }
    .hud-time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #cbd5e1;
      gap: 10px;
    }
    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .play-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 6px;
      width: 28px;
      height: 26px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: background 0.15s;
    }
    .play-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    #time-slider {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
      height: 4px;
    }
    .cam-switcher {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 2px;
    }
    .cam-btn {
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .cam-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .cam-btn.active {
      background: rgba(56, 189, 248, 0.24);
      border-color: rgba(56, 189, 248, 0.65);
      color: #e0f2fe;
      font-weight: 600;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-header">
      <span class="hud-title">Curb Sim Replay</span>
      <span id="outcome-badge" class="outcome-badge fell">fell</span>
    </div>
    <div class="hud-time-row">
      <span>Time</span>
      <span id="time-readout">0.00s / 0.00s</span>
    </div>
    <div class="scrubber-row">
      <button id="play-btn" class="play-btn" title="Play / Pause">&#10074;&#10074;</button>
      <input id="time-slider" type="range" min="0" max="1" step="0.001" value="0" />
    </div>
    <div class="cam-switcher">
      <button class="cam-btn" data-cam="chase">Chase</button>
      <button class="cam-btn" data-cam="side">Side</button>
      <button class="cam-btn" data-cam="street">Street</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // -------------------------------------------------------------------------
    // URL Parameters & Contract State
    // -------------------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const trajParam = urlParams.get('traj');
    const camParam = (urlParams.get('cam') || 'chase').toLowerCase();
    const isCapture = urlParams.get('capture') === '1';

    window.__ready = false;
    window.duration = 0;

    let activeCamMode = ['chase', 'side', 'street'].includes(camParam) ? camParam : 'chase';
    let isPlaying = !isCapture;
    let currentTime = 0;
    let trajectoryData = null;

    // UI Elements
    const hudEl = document.getElementById('hud');
    const outcomeBadgeEl = document.getElementById('outcome-badge');
    const timeReadoutEl = document.getElementById('time-readout');
    const timeSliderEl = document.getElementById('time-slider');
    const playBtnEl = document.getElementById('play-btn');
    const camBtns = Array.from(document.querySelectorAll('.cam-btn'));

    if (isCapture) {
      hudEl.classList.add('hidden');
    }

    function updateCamButtons() {
      camBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cam === activeCamMode);
      });
    }
    updateCamButtons();

    camBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        activeCamMode = btn.dataset.cam;
        updateCamButtons();
        window.seek(currentTime);
      });
    });

    playBtnEl.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtnEl.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';
    });

    timeSliderEl.addEventListener('input', (e) => {
      const frac = parseFloat(e.target.value) || 0;
      window.seek(frac * (window.duration || 0));
    });

    // -------------------------------------------------------------------------
    // Deterministic PRNG & Procedural Texture Utilities
    // -------------------------------------------------------------------------
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function() {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Tileable 2D value noise
    function createNoise2D(seed = 1337, period = 64) {
      const rng = mulberry32(seed);
      const grid = new Float32Array(period * period);
      for (let i = 0; i < grid.length; i++) grid[i] = rng();

      return function(x, y) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const xf = x - xi;
        const yf = y - yi;
        const u = xf * xf * (3 - 2 * xf);
        const v = yf * yf * (3 - 2 * yf);

        const x0 = ((xi % period) + period) % period;
        const x1 = (x0 + 1) % period;
        const y0 = ((yi % period) + period) % period;
        const y1 = (y0 + 1) % period;

        const a = grid[y0 * period + x0];
        const b = grid[y0 * period + x1];
        const c = grid[y1 * period + x0];
        const d = grid[y1 * period + x1];

        return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
      };
    }

    function fbm2D(noiseFn, x, y, octaves = 4, lacunarity = 2.0, gain = 0.5) {
      let total = 0;
      let amp = 0.5;
      let freq = 1.0;
      let norm = 0;
      for (let i = 0; i < octaves; i++) {
        total += amp * noiseFn(x * freq, y * freq);
        norm += amp;
        freq *= lacunarity;
        amp *= gain;
      }
      return total / norm;
    }

    // Convert scalar heightmap Float32Array [0..1] into a tangent-space normal map CanvasTexture
    function heightToNormalTexture(heightMap, width, height, strength = 3.0, repeatX = 1, repeatY = 1) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;

      for (let y = 0; y < height; y++) {
        const ym = (y - 1 + height) % height;
        const yp = (y + 1) % height;
        for (let x = 0; x < width; x++) {
          const xm = (x - 1 + width) % width;
          const xp = (x + 1) % width;

          const hL = heightMap[y * width + xm];
          const hR = heightMap[y * width + xp];
          const hU = heightMap[ym * width + x];
          const hD = heightMap[yp * width + x];

          const dx = (hL - hR) * strength;
          const dy = (hU - hD) * strength;
          const dz = 1.0;
          const invLen = 1.0 / Math.sqrt(dx * dx + dy * dy + dz * dz);

          const idx = (y * width + x) * 4;
          data[idx]     = Math.round(((dx * invLen) * 0.5 + 0.5) * 255);
          data[idx + 1] = Math.round(((dy * invLen) * 0.5 + 0.5) * 255);
          data[idx + 2] = Math.round(((dz * invLen) * 0.5 + 0.5) * 255);
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.needsUpdate = true;
      return tex;
    }

    // -------------------------------------------------------------------------
    // Procedural Materials Generation (Sidewalk, Curb, Asphalt, Buildings, Bark)
    // -------------------------------------------------------------------------
    function createSidewalkTextures() {
      const W = 512, H = 512;
      const diffCanvas = document.createElement('canvas');
      diffCanvas.width = W; diffCanvas.height = H;
      const diffCtx = diffCanvas.getContext('2d');
      const diffImg = diffCtx.createImageData(W, H);

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = W; roughCanvas.height = H;
      const roughCtx = roughCanvas.getContext('2d');
      const roughImg = roughCtx.createImageData(W, H);

      const heightMap = new Float32Array(W * H);
      const n1 = createNoise2D(101, 64);
      const n2 = createNoise2D(202, 128);
      const rng = mulberry32(303);

      // Concrete slab layout: 2x2 slabs per tile
      const slabW = W / 2;
      const slabH = H / 2;

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const u = x / W;
          const v = y / H;

          // Multi-scale concrete weathering & stains
          const macro = fbm2D(n1, u * 6, v * 6, 4);
          const mid = fbm2D(n2, u * 24, v * 24, 3);
          const fine = (rng() - 0.5) * 0.08;
          // Brushed broom texture along X
          const broom = Math.sin(y * 1.6 + mid * 4.0) * 0.015;

          // Expansion joint proximity
          const distX = Math.min(x % slabW, slabW - (x % slabW));
          const distY = Math.min(y % slabH, slabH - (y % slabH));
          const jointDist = Math.min(distX, distY);

          let jointFactor = 1.0;
          let jointDepth = 0.0;
          if (jointDist < 4.0) {
            const t = jointDist / 4.0;
            jointFactor = 0.42 + 0.58 * (t * t);
            jointDepth = -0.35 * (1.0 - t);
          } else if (jointDist < 14.0) {
            // Subtle edge wear / moisture darkening near expansion joints
            const t = (jointDist - 4.0) / 10.0;
            jointFactor = 0.92 + 0.08 * t;
          }

          // Subtle per-slab tone shift
          const slabId = Math.floor(x / slabW) + Math.floor(y / slabH) * 2;
          const slabTint = ((slabId * 37) % 5 - 2) * 3.0;

          // Dirty oil/water stain patches
          const stainNoise = fbm2D(n1, u * 3.5 + 1.7, v * 3.5 + 2.3, 3);
          const stain = stainNoise > 0.62 ? (stainNoise - 0.62) * 1.1 : 0.0;

          let baseL = 176 + slabTint + (macro - 0.5) * 28 + (mid - 0.5) * 18 + fine * 35 - stain * 65;
          baseL *= jointFactor;

          const r = Math.max(30, Math.min(245, baseL + 4));
          const g = Math.max(30, Math.min(245, baseL + 2));
          const b = Math.max(30, Math.min(245, baseL - 3));

          const idx = (y * W + x) * 4;
          diffImg.data[idx] = r;
          diffImg.data[idx + 1] = g;
          diffImg.data[idx + 2] = b;
          diffImg.data[idx + 3] = 255;

          const hVal = Math.max(0, Math.min(1, 0.5 + (mid - 0.5) * 0.22 + fine * 0.35 + broom + jointDepth));
          heightMap[y * W + x] = hVal;

          const roughVal = Math.max(140, Math.min(250, Math.round(215 + (0.5 - mid) * 35 - stain * 40)));
          roughImg.data[idx] = roughVal;
          roughImg.data[idx + 1] = roughVal;
          roughImg.data[idx + 2] = roughVal;
          roughImg.data[idx + 3] = 255;
        }
      }

      // Draw a few hairline cracks on the concrete
      diffCtx.putImageData(diffImg, 0, 0);
      diffCtx.strokeStyle = 'rgba(65, 62, 58, 0.55)';
      diffCtx.lineWidth = 1.2;
      const crackRng = mulberry32(909);
      for (let c = 0; c < 5; c++) {
        let cx = (c % 2) * slabW + 18;
        let cy = Math.floor(c / 2) * slabH + 10;
        diffCtx.beginPath();
        diffCtx.moveTo(cx, cy);
        for (let s = 0; s < 14; s++) {
          cx += (crackRng() - 0.3) * 8;
          cy += crackRng() * 7;
          diffCtx.lineTo(cx, cy);
        }
        diffCtx.stroke();
      }

      // Dark gum spots / aged tar specks
      for (let g = 0; g < 18; g++) {
        const gx = crackRng() * W;
        const gy = crackRng() * H;
        const gr = 1.5 + crackRng() * 3.0;
        diffCtx.fillStyle = `rgba(48, 46, 44, ${0.35 + crackRng() * 0.35})`;
        diffCtx.beginPath();
        diffCtx.arc(gx, gy, gr, 0, Math.PI * 2);
        diffCtx.fill();
      }

      roughCtx.putImageData(roughImg, 0, 0);

      const map = new THREE.CanvasTexture(diffCanvas);
      map.wrapS = THREE.RepeatWrapping;
      map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = 8;

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = THREE.RepeatWrapping;
      roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.anisotropy = 8;

      const normalMap = heightToNormalTexture(heightMap, W, H, 3.5);
      normalMap.anisotropy = 8;

      return { map, roughnessMap, normalMap };
    }

    function createCurbTextures() {
      const W = 512, H = 256;
      const diffCanvas = document.createElement('canvas');
      diffCanvas.width = W; diffCanvas.height = H;
      const diffCtx = diffCanvas.getContext('2d');
      const diffImg = diffCtx.createImageData(W, H);
      const heightMap = new Float32Array(W * H);

      const n1 = createNoise2D(404, 64);
      const rng = mulberry32(505);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const u = x / W;
          const v = y / H;

          const grain = fbm2D(n1, u * 16, v * 8, 4);
          const crystal = (rng() - 0.5) * 0.16;

          // Curb block mortar joint every 256px
          const jDist = Math.min(x % 256, 256 - (x % 256));
          const joint = jDist < 3 ? 0.45 : 1.0;

          // Dark grime near base of curb (v near 1) and tire scuffs mid-face
          const baseGrime = Math.pow(Math.max(0, (v - 0.65) / 0.35), 1.6) * 48;
          const scuffNoise = fbm2D(n1, u * 5 + 3.1, v * 3, 2);
          const tireScuff = (v > 0.25 && v < 0.78 && scuffNoise > 0.64) ? (scuffNoise - 0.64) * 140 : 0;

          let val = (154 + (grain - 0.5) * 32 + crystal * 42 - baseGrime - tireScuff) * joint;
          val = Math.max(28, Math.min(230, val));

          const idx = (y * W + x) * 4;
          diffImg.data[idx] = val + 2;
          diffImg.data[idx + 1] = val + 1;
          diffImg.data[idx + 2] = val - 2;
          diffImg.data[idx + 3] = 255;

          heightMap[y * W + x] = Math.max(0, Math.min(1, 0.5 + (grain - 0.5) * 0.3 + crystal * 0.4 - (jDist < 3 ? 0.3 : 0)));
        }
      }
      diffCtx.putImageData(diffImg, 0, 0);

      const map = new THREE.CanvasTexture(diffCanvas);
      map.wrapS = THREE.RepeatWrapping;
      map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = 8;

      const normalMap = heightToNormalTexture(heightMap, W, H, 4.2);
      normalMap.anisotropy = 8;

      return { map, normalMap };
    }

    function createAsphaltTextures() {
      const W = 512, H = 512;
      const diffCanvas = document.createElement('canvas');
      diffCanvas.width = W; diffCanvas.height = H;
      const diffCtx = diffCanvas.getContext('2d');
      const diffImg = diffCtx.createImageData(W, H);

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = W; roughCanvas.height = H;
      const roughCtx = roughCanvas.getContext('2d');
      const roughImg = roughCtx.createImageData(W, H);

      const heightMap = new Float32Array(W * H);
      const n1 = createNoise2D(606, 64);
      const n2 = createNoise2D(707, 128);
      const rng = mulberry32(808);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const u = x / W;
          const v = y / H;

          const macro = fbm2D(n1, u * 5, v * 5, 3);
          const patch = fbm2D(n2, u * 14, v * 14, 3);
          // Fine crushed aggregate stones
          const rVal = rng();
          const aggregate = rVal > 0.82 ? (rVal - 0.82) * 2.2 : (rVal < 0.15 ? -0.25 : 0.0);

          let base = 54 + (macro - 0.5) * 18 + (patch - 0.5) * 12 + aggregate * 34;
          base = Math.max(22, Math.min(125, base));

          const idx = (y * W + x) * 4;
          diffImg.data[idx] = base;
          diffImg.data[idx + 1] = base + 1;
          diffImg.data[idx + 2] = base + 3;
          diffImg.data[idx + 3] = 255;

          const hVal = Math.max(0, Math.min(1, 0.5 + (patch - 0.5) * 0.25 + (rVal - 0.5) * 0.55));
          heightMap[y * W + x] = hVal;

          const rough = Math.max(150, Math.min(252, Math.round(218 - (macro - 0.5) * 45 - aggregate * 25)));
          roughImg.data[idx] = rough;
          roughImg.data[idx + 1] = rough;
          roughImg.data[idx + 2] = rough;
          roughImg.data[idx + 3] = 255;
        }
      }
      diffCtx.putImageData(diffImg, 0, 0);

      // Tar-sealed road cracks on asphalt tile
      diffCtx.strokeStyle = 'rgba(24, 25, 28, 0.78)';
      diffCtx.lineWidth = 2.2;
      const cRng = mulberry32(1112);
      for (let i = 0; i < 3; i++) {
        let cx = cRng() * W;
        let cy = 0;
        diffCtx.beginPath();
        diffCtx.moveTo(cx, cy);
        while (cy < H) {
          cx += (cRng() - 0.5) * 18;
          cy += 12 + cRng() * 18;
          diffCtx.lineTo(cx, cy);
        }
        diffCtx.stroke();
      }

      roughCtx.putImageData(roughImg, 0, 0);

      const map = new THREE.CanvasTexture(diffCanvas);
      map.wrapS = THREE.RepeatWrapping;
      map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = 8;

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = THREE.RepeatWrapping;
      roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.anisotropy = 8;

      const normalMap = heightToNormalTexture(heightMap, W, H, 4.8);
      normalMap.anisotropy = 8;

      return { map, roughnessMap, normalMap };
    }

    function createRoadPaintTexture(baseColor = '#e8eaed') {
      const W = 256, H = 256;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, W, H);

      const n1 = createNoise2D(919, 32);
      const rng = mulberry32(929);
      const img = ctx.getImageData(0, 0, W, H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const wear = fbm2D(n1, (x / W) * 8, (y / H) * 8, 3);
          const grit = rng();
          const idx = (y * W + x) * 4;
          if (wear > 0.63 || grit < 0.07) {
            const darken = 0.55 + 0.35 * grit;
            img.data[idx] *= darken;
            img.data[idx + 1] *= darken;
            img.data[idx + 2] *= darken;
          }
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createStormDrainGrateTexture() {
      const W = 256, H = 256;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      // Rusty cast-iron frame
      ctx.fillStyle = '#2d2825';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#3d3530';
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, W - 14, H - 14);

      // Dark drainage slots
      const cols = 4;
      const rows = 6;
      const padX = 24, padY = 22;
      const slotW = (W - padX * 2 - (cols - 1) * 14) / cols;
      const slotH = (H - padY * 2 - (rows - 1) * 12) / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const sx = padX + c * (slotW + 14);
          const sy = padY + r * (slotH + 12);
          ctx.fillStyle = '#07080a';
          ctx.beginPath();
          ctx.roundRect(sx, sy, slotW, slotH, 4);
          ctx.fill();
          ctx.strokeStyle = '#473c35';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBrickFacadeTexture(baseHex = '#8c4638', mortarHex = '#b8b2a8') {
      const W = 512, H = 512;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = mortarHex;
      ctx.fillRect(0, 0, W, H);

      const rng = mulberry32(4242);
      const rows = 32;
      const cols = 16;
      const bH = H / rows;
      const bW = W / cols;
      const baseCol = new THREE.Color(baseHex);

      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (bW * 0.5);
        for (let c = -1; c <= cols; c++) {
          const x = c * bW + offset;
          const y = r * bH;
          const delta = (rng() - 0.5) * 0.12;
          const col = baseCol.clone().offsetHSL((rng() - 0.5) * 0.02, (rng() - 0.5) * 0.06, delta);
          ctx.fillStyle = `#${col.getHexString()}`;
          ctx.fillRect(x + 1.5, y + 1.5, bW - 3, bH - 3);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function createDistantBuildingTexture(seed = 77) {
      const W = 256, H = 512;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const rng = mulberry32(seed);

      const baseTone = 105 + Math.floor(rng() * 55);
      ctx.fillStyle = `rgb(${baseTone}, ${baseTone + 4}, ${baseTone + 10})`;
      ctx.fillRect(0, 0, W, H);

      const cols = 8;
      const rows = 20;
      const padX = 8, padY = 10;
      const wW = (W - padX * 2) / cols;
      const wH = (H - padY * 2) / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const wx = padX + c * wW + 3;
          const wy = padY + r * wH + 4;
          const lit = rng() > 0.78;
          if (lit) {
            ctx.fillStyle = `rgb(${165 + Math.floor(rng() * 40)}, ${175 + Math.floor(rng() * 35)}, ${185 + Math.floor(rng() * 30)})`;
          } else {
            const d = 38 + Math.floor(rng() * 30);
            ctx.fillStyle = `rgb(${d}, ${d + 8}, ${d + 18})`;
          }
          ctx.fillRect(wx, wy, wW - 6, wH - 8);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // -------------------------------------------------------------------------
    // Three.js Renderer, Scene, Sky, Lighting & Cameras Setup
    // -------------------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xcad8e6, 0.0085);

    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.05, 350);

    // Physically Based Sky (late-morning sun)
    const sky = new Sky();
    sky.scale.setScalar(1000);
    scene.add(sky);

    const skyUniforms = sky.material.uniforms;
    skyUniforms['turbidity'].value = 3.2;
    skyUniforms['rayleigh'].value = 1.65;
    skyUniforms['mieCoefficient'].value = 0.0045;
    skyUniforms['mieDirectionalG'].value = 0.82;

    // Sun position: late morning (elevation ~41 deg, azimuth ~132 deg so curb face & buildings are well-lit)
    const sunDirection = new THREE.Vector3();
    const phi = THREE.MathUtils.degToRad(90 - 41);
    const theta = THREE.MathUtils.degToRad(52);
    sunDirection.setFromSphericalCoords(1, phi, theta);
    skyUniforms['sunPosition'].value.copy(sunDirection);

    // Generate PMREM environment map from the Sky for realistic reflections
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileCubemapShader();
    const envScene = new THREE.Scene();
    const envSky = new Sky();
    envSky.scale.setScalar(100);
    envSky.material.uniforms['turbidity'].value = 3.2;
    envSky.material.uniforms['rayleigh'].value = 1.65;
    envSky.material.uniforms['mieCoefficient'].value = 0.0045;
    envSky.material.uniforms['mieDirectionalG'].value = 0.82;
    envSky.material.uniforms['sunPosition'].value.copy(sunDirection);
    envScene.add(envSky);
    // Ground bounce hemisphere in envScene so bottom reflections look like street/concrete
    const envGround = new THREE.Mesh(
      new THREE.SphereGeometry(40, 16, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x55585c, side: THREE.BackSide })
    );
    envScene.add(envGround);
    scene.environment = pmremGenerator.fromScene(envScene, 0.03).texture;
    scene.environmentIntensity = 0.75;

    // Late-morning Directional Sun Light with PCFSoft shadows
    const sunLight = new THREE.DirectionalLight(0xfff5e4, 3.4);
    sunLight.position.copy(sunDirection).multiplyScalar(38);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 95;
    const d = 14;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.00035;
    sunLight.shadow.normalBias = 0.012;
    scene.add(sunLight);

    // Natural sky/ground hemisphere fill light
    const hemiLight = new THREE.HemisphereLight(0xa8c8f0, 0x6e685f, 0.85);
    scene.add(hemiLight);

    // -------------------------------------------------------------------------
    // Shared Procedural Materials
    // -------------------------------------------------------------------------
    const sidewalkTex = createSidewalkTextures();
    const curbTex = createCurbTextures();
    const asphaltTex = createAsphaltTextures();
    const whitePaintTex = createRoadPaintTexture('#e8ecf0');
    const yellowPaintTex = createRoadPaintTexture('#eab308');
    const redCurbPaintTex = createRoadPaintTexture('#b91c1c');
    const stormGrateTex = createStormDrainGrateTexture();

    // -------------------------------------------------------------------------
    // Street World Builder (Parameterized by curb_x and curb_height)
    // -------------------------------------------------------------------------
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    let builtCurbX = null;
    let builtCurbHeight = null;

    function buildCityWorld(curbX = 0.0, curbHeight = 0.2) {
      if (builtCurbX === curbX && builtCurbHeight === curbHeight) return;
      builtCurbX = curbX;
      builtCurbHeight = curbHeight;

      while (worldGroup.children.length > 0) {
        worldGroup.remove(worldGroup.children[0]);
      }

      const streetLength = 220;

      // 1. SIDEWALK (x < curbX, top surface at y = curbHeight)
      // Curbstone top strip (granite curb top from x = curbX - 0.18 to x = curbX)
      const curbStoneW = 0.18;
      const sidewalkW = 14.0;

      const sMap = sidewalkTex.map.clone();
      sMap.repeat.set(sidewalkW / 3.0, streetLength / 3.0);
      sMap.needsUpdate = true;
      const sRough = sidewalkTex.roughnessMap.clone();
      sRough.repeat.copy(sMap.repeat);
      sRough.needsUpdate = true;
      const sNorm = sidewalkTex.normalMap.clone();
      sNorm.repeat.copy(sMap.repeat);
      sNorm.needsUpdate = true;

      const sidewalkMat = new THREE.MeshStandardMaterial({
        map: sMap,
        roughnessMap: sRough,
        normalMap: sNorm,
        normalScale: new THREE.Vector2(0.75, 0.75),
        roughness: 0.92,
        metalness: 0.02
      });

      const sidewalkGeo = new THREE.BoxGeometry(sidewalkW, curbHeight + 0.2, streetLength);
      const sidewalkMesh = new THREE.Mesh(sidewalkGeo, sidewalkMat);
      sidewalkMesh.position.set(curbX - curbStoneW - sidewalkW / 2, (curbHeight - 0.2) / 2, 0);
      sidewalkMesh.receiveShadow = true;
      worldGroup.add(sidewalkMesh);

      // Granite/Concrete Curb Block (from x = curbX - curbStoneW to x = curbX, top at y = curbHeight)
      const cMap = curbTex.map.clone();
      cMap.repeat.set(streetLength / 2.2, 1);
      cMap.needsUpdate = true;
      const cNorm = curbTex.normalMap.clone();
      cNorm.repeat.copy(cMap.repeat);
      cNorm.needsUpdate = true;

      const curbMat = new THREE.MeshStandardMaterial({
        map: cMap,
        normalMap: cNorm,
        normalScale: new THREE.Vector2(0.95, 0.95),
        roughness: 0.84,
        metalness: 0.04
      });

      // Rotate UV orientation for the vertical curb face so joints run vertically
      const curbBlockGeo = new THREE.BoxGeometry(curbStoneW, curbHeight + 0.08, streetLength);
      const curbMesh = new THREE.Mesh(curbBlockGeo, curbMat);
      curbMesh.position.set(curbX - curbStoneW / 2, (curbHeight - 0.08) / 2, 0);
      curbMesh.castShadow = true;
      curbMesh.receiveShadow = true;
      worldGroup.add(curbMesh);

      // Subtle beveled top edge nose along x = curbX, y = curbHeight so sunlight catches the curb edge
      const curbNoseGeo = new THREE.CylinderGeometry(0.012, 0.012, streetLength, 8);
      curbNoseGeo.rotateX(Math.PI / 2);
      const curbNose = new THREE.Mesh(curbNoseGeo, curbMat);
      curbNose.position.set(curbX - 0.012, curbHeight - 0.012, 0);
      curbNose.receiveShadow = true;
      worldGroup.add(curbNose);

      // Red "NO PARKING / FIRE LANE" painted curb section near the fire hydrant (z = 1.3 to 3.1)
      const redCurbMat = new THREE.MeshStandardMaterial({
        map: redCurbPaintTex,
        normalMap: cNorm,
        normalScale: new THREE.Vector2(0.6, 0.6),
        roughness: 0.78
      });
      const redCurbMesh = new THREE.Mesh(new THREE.BoxGeometry(curbStoneW + 0.004, curbHeight + 0.004, 1.9), redCurbMat);
      redCurbMesh.position.set(curbX - curbStoneW / 2, curbHeight / 2, 2.1);
      redCurbMesh.receiveShadow = true;
      worldGroup.add(redCurbMesh);

      // 2. ASPHALT ROAD (x > curbX, y = 0)
      const roadW = 40.0;
      const aMap = asphaltTex.map.clone();
      aMap.repeat.set(roadW / 2.6, streetLength / 2.6);
      aMap.needsUpdate = true;
      const aRough = asphaltTex.roughnessMap.clone();
      aRough.repeat.copy(aMap.repeat);
      aRough.needsUpdate = true;
      const aNorm = asphaltTex.normalMap.clone();
      aNorm.repeat.copy(aMap.repeat);
      aNorm.needsUpdate = true;

      const asphaltMat = new THREE.MeshStandardMaterial({
        map: aMap,
        roughnessMap: aRough,
        normalMap: aNorm,
        normalScale: new THREE.Vector2(0.95, 0.95),
        roughness: 0.88,
        metalness: 0.04
      });

      const roadGeo = new THREE.PlaneGeometry(roadW, streetLength);
      roadGeo.rotateX(-Math.PI / 2);
      const roadMesh = new THREE.Mesh(roadGeo, asphaltMat);
      roadMesh.position.set(curbX + roadW / 2, 0.0, 0.0);
      roadMesh.receiveShadow = true;
      worldGroup.add(roadMesh);

      // 3. GUTTER LINE AT CURB BASE (x = curbX to curbX + 0.42)
      const gutterW = 0.42;
      const gutterGeo = new THREE.PlaneGeometry(gutterW, streetLength);
      gutterGeo.rotateX(-Math.PI / 2);
      const gutterMat = new THREE.MeshStandardMaterial({
        color: 0x8d8b86,
        map: sMap,
        normalMap: sNorm,
        normalScale: new THREE.Vector2(0.6, 0.6),
        roughness: 0.86
      });
      const gutterMesh = new THREE.Mesh(gutterGeo, gutterMat);
      gutterMesh.position.set(curbX + gutterW / 2, 0.0015, 0);
      gutterMesh.receiveShadow = true;
      worldGroup.add(gutterMesh);

      // Dark moisture/debris seam right at the curb-gutter corner and gutter-asphalt seam
      const seamMat = new THREE.MeshBasicMaterial({
        color: 0x1d1c1a,
        transparent: true,
        opacity: 0.58,
        depthWrite: false
      });
      const cornerSeam = new THREE.Mesh(new THREE.PlaneGeometry(0.09, streetLength).rotateX(-Math.PI / 2), seamMat);
      cornerSeam.position.set(curbX + 0.045, 0.0025, 0);
      worldGroup.add(cornerSeam);

      const outerGutterSeam = new THREE.Mesh(new THREE.PlaneGeometry(0.04, streetLength).rotateX(-Math.PI / 2), seamMat);
      outerGutterSeam.position.set(curbX + gutterW, 0.0025, 0);
      worldGroup.add(outerGutterSeam);

      // 4. ASPHALT PATCHES & MANHOLE COVER
      const patchMat = new THREE.MeshStandardMaterial({
        color: 0x383a3f,
        map: aMap,
        normalMap: aNorm,
        roughness: 0.94,
        polygonOffset: true,
        polygonOffsetFactor: -1
      });
      const patches = [
        { x: curbX + 1.85, z: -1.6, w: 1.35, l: 2.4, rot: 0.02 },
        { x: curbX + 3.4,  z: 2.8,  w: 1.9,  l: 1.6, rot: -0.04 },
        { x: curbX + 0.95, z: 4.6,  w: 0.85, l: 1.8, rot: 0.0 }
      ];
      patches.forEach(p => {
        const patchGroup = new THREE.Group();
        patchGroup.position.set(p.x, 0.002, p.z);
        patchGroup.rotation.y = p.rot;
        // Tar border
        const tarBorder = new THREE.Mesh(
          new THREE.PlaneGeometry(p.w + 0.06, p.l + 0.06).rotateX(-Math.PI / 2),
          new THREE.MeshStandardMaterial({ color: 0x18191c, roughness: 0.35 })
        );
        patchGroup.add(tarBorder);
        const innerPatch = new THREE.Mesh(
          new THREE.PlaneGeometry(p.w, p.l).rotateX(-Math.PI / 2),
          patchMat
        );
        innerPatch.position.y = 0.0005;
        innerPatch.receiveShadow = true;
        patchGroup.add(innerPatch);
        worldGroup.add(patchGroup);
      });

      // Cast-iron Manhole Cover in road
      const manholeGroup = new THREE.Group();
      manholeGroup.position.set(curbX + 3.6, 0.004, 1.15);
      const manholeRing = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.44, 0.008, 28),
        new THREE.MeshStandardMaterial({ color: 0x262423, roughness: 0.7, metalness: 0.6 })
      );
      manholeGroup.add(manholeRing);
      const manholeLid = new THREE.Mesh(
        new THREE.CylinderGeometry(0.36, 0.36, 0.011, 28),
        new THREE.MeshStandardMaterial({ color: 0x3b342f, roughness: 0.62, metalness: 0.65 })
      );
      manholeGroup.add(manholeLid);
      worldGroup.add(manholeGroup);

      // 5. STORM DRAIN AT CURB BASE (z = -2.35)
      const drainZ = -2.35;
      const drainGroup = new THREE.Group();
      drainGroup.position.set(curbX, 0, drainZ);

      // Slotted iron grate on the gutter
      const grateMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(0.44, 0.72).rotateX(-Math.PI / 2),
        new THREE.MeshStandardMaterial({
          map: stormGrateTex,
          roughness: 0.65,
          metalness: 0.55
        })
      );
      grateMesh.position.set(0.23, 0.004, 0);
      grateMesh.receiveShadow = true;
      drainGroup.add(grateMesh);

      // Dark throat opening in the vertical curb face
      const throatMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.05, Math.max(0.06, curbHeight * 0.62), 0.68),
        new THREE.MeshBasicMaterial({ color: 0x050608 })
      );
      throatMesh.position.set(-0.01, curbHeight * 0.32, 0);
      drainGroup.add(throatMesh);

      // Cast-iron hood header over the curb opening
      const hoodMat = new THREE.MeshStandardMaterial({ color: 0x38312c, roughness: 0.6, metalness: 0.65 });
      const hoodTop = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.032, 0.76), hoodMat);
      hoodTop.position.set(-0.09, curbHeight + 0.005, 0);
      hoodTop.castShadow = true;
      hoodTop.receiveShadow = true;
      drainGroup.add(hoodTop);
      worldGroup.add(drainGroup);

      // 6. PAINTED LANE LINES & CROSSWALK (a few meters away at z = -4.2 to -7.8)
      const whitePaintMat = new THREE.MeshStandardMaterial({
        map: whitePaintTex,
        normalMap: aNorm,
        normalScale: new THREE.Vector2(0.5, 0.5),
        roughness: 0.72
      });
      const yellowPaintMat = new THREE.MeshStandardMaterial({
        map: yellowPaintTex,
        normalMap: aNorm,
        normalScale: new THREE.Vector2(0.5, 0.5),
        roughness: 0.72
      });

      // Double yellow center line at x = curbX + 5.6
      const centerX = curbX + 5.6;
      [-0.09, 0.09].forEach(offset => {
        // Segment 1 (south of crosswalk, z > -3.8)
        const line1 = new THREE.Mesh(
          new THREE.PlaneGeometry(0.11, 95).rotateX(-Math.PI / 2),
          yellowPaintMat
        );
        line1.position.set(centerX + offset, 0.003, 43.7);
        line1.receiveShadow = true;
        worldGroup.add(line1);

        // Segment 2 (north of crosswalk, z < -8.6)
        const line2 = new THREE.Mesh(
          new THREE.PlaneGeometry(0.11, 95).rotateX(-Math.PI / 2),
          yellowPaintMat
        );
        line2.position.set(centerX + offset, 0.003, -56.1);
        line2.receiveShadow = true;
        worldGroup.add(line2);
      });

      // Bike / parking lane line at x = curbX + 2.35
      const bikeLine1 = new THREE.Mesh(
        new THREE.PlaneGeometry(0.10, 95).rotateX(-Math.PI / 2),
        whitePaintMat
      );
      bikeLine1.position.set(curbX + 2.35, 0.003, 43.7);
      bikeLine1.receiveShadow = true;
      worldGroup.add(bikeLine1);

      // White Stop Bar at z = -4.1
      const stopBar = new THREE.Mesh(
        new THREE.PlaneGeometry(5.0, 0.42).rotateX(-Math.PI / 2),
        whitePaintMat
      );
      stopBar.position.set(curbX + 2.9, 0.0035, -4.1);
      stopBar.receiveShadow = true;
      worldGroup.add(stopBar);

      // Continental Zebra Crosswalk Bars at z = -6.3
      for (let i = 0; i < 11; i++) {
        const cwX = curbX + 0.65 + i * 0.98;
        const stripe = new THREE.Mesh(
          new THREE.PlaneGeometry(0.48, 2.7).rotateX(-Math.PI / 2),
          whitePaintMat
        );
        stripe.position.set(cwX, 0.0035, -6.3);
        stripe.receiveShadow = true;
        worldGroup.add(stripe);
      }

      // ADA Yellow Tactile Warning Pad on the sidewalk at the crosswalk (z = -6.3)
      const adaMat = new THREE.MeshStandardMaterial({
        color: 0xeab308,
        roughness: 0.62
      });
      const adaPad = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.012, 1.5), adaMat);
      adaPad.position.set(curbX - 0.52, curbHeight + 0.006, -6.3);
      adaPad.receiveShadow = true;
      worldGroup.add(adaPad);

      // 7. STREET TREES WITH TREE PITS
      const treePositions = [-3.9, 4.1, -12.5, 11.8, -21.0, 20.5];
      treePositions.forEach((tz, idx) => {
        const treeGroup = createStreetTreeWithPit(curbHeight, 100 + idx * 17);
        treeGroup.position.set(curbX - 1.25, curbHeight, tz);
        worldGroup.add(treeGroup);
      });

      // 8. STREET LAMP (at x = curbX - 0.62, z = -2.85)
      const lamp = createStreetLamp();
      lamp.position.set(curbX - 0.62, curbHeight, -2.85);
      worldGroup.add(lamp);

      // Second street lamp further down
      const lamp2 = createStreetLamp();
      lamp2.position.set(curbX - 0.62, curbHeight, 14.5);
      worldGroup.add(lamp2);

      // Across-the-street lamps (at x = curbX + 11.2)
      const farSidewalkGeo = new THREE.BoxGeometry(14, curbHeight + 0.2, streetLength);
      const farSidewalk = new THREE.Mesh(farSidewalkGeo, sidewalkMat);
      farSidewalk.position.set(curbX + 11.2 + 7.0, (curbHeight - 0.2) / 2, 0);
      farSidewalk.receiveShadow = true;
      worldGroup.add(farSidewalk);

      const farCurb = new THREE.Mesh(curbBlockGeo, curbMat);
      farCurb.position.set(curbX + 11.2 + curbStoneW / 2, (curbHeight - 0.08) / 2, 0);
      farCurb.receiveShadow = true;
      worldGroup.add(farCurb);

      // 9. FIRE HYDRANT (at x = curbX - 0.52, z = 2.05)
      const hydrant = createFireHydrant();
      hydrant.position.set(curbX - 0.52, curbHeight, 2.05);
      worldGroup.add(hydrant);

      // 10. SIDEWALK PROPS (City Trash Bin & Bike Rack)
      const trashBin = createCityTrashBin();
      trashBin.position.set(curbX - 0.68, curbHeight, -5.0);
      worldGroup.add(trashBin);

      // 11. PARKED CARS DOWN THE ROAD (Silhouettes / Detailed 3D Vehicles)
      const carConfigs = [
        { x: curbX + 1.18, z: 7.4,   rot: 0,       color: 0x263240 },
        { x: curbX + 1.18, z: 14.2,  rot: 0,       color: 0x6b7280 },
        { x: curbX + 1.18, z: -12.2, rot: 0,       color: 0x3f1d1d },
        { x: curbX + 1.18, z: -19.0, rot: 0,       color: 0x1e293b },
        { x: curbX + 9.95, z: -1.8,  rot: Math.PI, color: 0x334155 },
        { x: curbX + 9.95, z: 6.2,   rot: Math.PI, color: 0x475569 },
        { x: curbX + 9.95, z: -13.5, rot: Math.PI, color: 0x1f2937 }
      ];
      carConfigs.forEach(cfg => {
        const car = createParkedCar(cfg.color);
        car.position.set(cfg.x, 0, cfg.z);
        car.rotation.y = cfg.rot;
        worldGroup.add(car);
      });

      // 12. BUILDING FACADES ACROSS THE SIDEWALK (x around -5.4)
      const buildingsNear = createHeroBuildingRow(curbHeight);
      buildingsNear.position.set(curbX - 5.4, 0, 0);
      worldGroup.add(buildingsNear);

      // 13. DISTANT BUILDINGS FADING INTO HAZE (Across the street & down the avenue)
      const distantGroup = createDistantCityscape(curbX);
      worldGroup.add(distantGroup);
    }

    // -------------------------------------------------------------------------
    // Detailed Prop Builders
    // -------------------------------------------------------------------------
    function createStreetTreeWithPit(curbHeight, seed = 100) {
      const group = new THREE.Group();
      const rng = mulberry32(seed);

      // Tree pit granite cobble border & dark soil mulch bed flush with sidewalk
      const pitW = 1.35, pitL = 1.85;
      const borderMat = new THREE.MeshStandardMaterial({ color: 0x6d6a65, roughness: 0.85 });
      const soilMat = new THREE.MeshStandardMaterial({ color: 0x2b2119, roughness: 0.96 });
      const grateMat = new THREE.MeshStandardMaterial({ color: 0x26282a, roughness: 0.65, metalness: 0.55 });

      const pitFrame = new THREE.Mesh(new THREE.BoxGeometry(pitW, 0.03, pitL), borderMat);
      pitFrame.position.y = 0.005;
      pitFrame.receiveShadow = true;
      group.add(pitFrame);

      const soilBed = new THREE.Mesh(new THREE.BoxGeometry(pitW - 0.14, 0.032, pitL - 0.14), soilMat);
      soilBed.position.y = 0.006;
      soilBed.receiveShadow = true;
      group.add(soilBed);

      // Low wrought-iron tree pit guard fence on 3 sides
      for (let i = -1; i <= 1; i += 2) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(pitW - 0.08, 0.18, 0.025), grateMat);
        rail.position.set(0, 0.09, i * (pitL / 2 - 0.04));
        rail.castShadow = true;
        group.add(rail);
      }

      // Tree trunk & branches
      const trunkMat = new THREE.MeshStandardMaterial({
        color: 0x4f4339,
        roughness: 0.92
      });
      const trunkH = 3.2 + rng() * 0.4;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.21, trunkH, 10), trunkMat);
      trunk.position.y = trunkH / 2;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);

      // Foliage clusters
      const leafColors = [0x3d5e31, 0x4b6e38, 0x345229, 0x587a41];
      const bCount = 5;
      for (let b = 0; b < bCount; b++) {
        const angle = (b / bCount) * Math.PI * 2 + rng() * 0.5;
        const tilt = 0.42 + rng() * 0.28;
        const bLen = 1.6 + rng() * 0.6;

        const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.09, bLen, 7), trunkMat);
        branch.position.set(
          Math.cos(angle) * bLen * 0.32,
          trunkH - 0.3 + Math.cos(tilt) * bLen * 0.4,
          Math.sin(angle) * bLen * 0.32
        );
        branch.rotation.z = -Math.cos(angle) * tilt;
        branch.rotation.x = Math.sin(angle) * tilt;
        branch.castShadow = true;
        group.add(branch);

        // Leaf canopy puffs at branch ends
        for (let c = 0; c < 3; c++) {
          const leafMat = new THREE.MeshStandardMaterial({
            color: leafColors[(b + c) % leafColors.length],
            roughness: 0.86
          });
          const rad = 0.95 + rng() * 0.55;
          const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(rad, 1), leafMat);
          puff.scale.set(1.15, 0.82, 1.15);
          puff.position.set(
            Math.cos(angle) * (0.85 + c * 0.55) + (rng() - 0.5) * 0.4,
            trunkH + 0.85 + c * 0.35 + (rng() - 0.5) * 0.3,
            Math.sin(angle) * (0.85 + c * 0.55) + (rng() - 0.5) * 0.4
          );
          puff.castShadow = true;
          puff.receiveShadow = true;
          group.add(puff);
        }
      }

      // Central top crown puff
      const crownMat = new THREE.MeshStandardMaterial({ color: 0x4b6e38, roughness: 0.85 });
      const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(1.55, 1), crownMat);
      crown.scale.set(1.2, 0.85, 1.2);
      crown.position.set(0, trunkH + 1.8, 0);
      crown.castShadow = true;
      group.add(crown);

      return group;
    }

      // Buildings across the street (x > curbX + 14.5) and further down the avenue
      for (let i = 0; i < 38; i++) {

        if (i < 14) {
          // Across the road row
          bw = 14 + rng() * 8;
          bd = 14 + rng() * 6;
          bh = 16 + rng() * 28;
          bx = curbX + 15.2 + bw / 2 + rng() * 4;
          bz = -75 + i * 12.5;
        } else {
          // Background skyline blocks fading into haze
          bw = 16 + rng() * 18;
          bd = 16 + rng() * 18;
          bh = 24 + rng() * 58;
          bx = side > 0 ? (curbX + 22 + rng() * 45) : (curbX - 20 - rng() * 45);
          bz = (rng() - 0.5) * 190;
          if (Math.abs(bz) < 28 && bx < curbX + 15 && bx > curbX - 18) {

        const tex = texPool[i % texPool.length].clone();
        tex.repeat.set(Math.max(1, Math.round(bd / 12)), Math.max(1, Math.round(bh / 22)));

        const mesh = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
        mesh.position.set(bx, bh / 2, bz);
        mesh.receiveShadow = true;
        group.add(mesh);

    function createTireTextures() {
      const W = 256, H = 64;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1b1d20';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#101214';
      const lugs = 24;
      const lugW = W / lugs;
      for (let i = 0; i < lugs; i++) {
        ctx.fillRect(i * lugW + 2, 4, lugW * 0.55, H * 0.4);
        ctx.fillRect(i * lugW + lugW * 0.35, H * 0.52, lugW * 0.55, H * 0.4);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const tireTreadTex = createTireTextures();

    function buildRobotModel(robotMeta) {
      while (robotRoot.children.length > 0) {
        robotRoot.remove(robotRoot.children[0]);
      }

      // Extract exact MuJoCo physics dimensions (in meters, half-extents)
      const ch = robotMeta?.chassis_half || [0.26, 0.15, 0.06];
      const cg = robotMeta?.cargo_half || [0.22, 0.15, 0.12];
      const cgOff = robotMeta?.cargo_offset || [-0.02, 0.0, 0.18];
      const wRad = robotMeta?.wheel_radius ?? 0.08;
      const wHalfW = robotMeta?.wheel_half_width ?? 0.03;
      const wOffsets = robotMeta?.wheel_offsets || {
        fl: [0.18, 0.17, -0.07],
        fr: [0.18, -0.17, -0.07],
        rl: [-0.18, 0.17, -0.07],
        rr: [-0.18, -0.17, -0.07]
      };

      // Materials
      const whiteShellMat = new THREE.MeshStandardMaterial({
        color: 0xf4f6f9,
        roughness: 0.22,
        metalness: 0.06
      });
      const darkBumperMat = new THREE.MeshStandardMaterial({
        color: 0x20242a,
        roughness: 0.65,
        metalness: 0.15
      });
      const lidMat = new THREE.MeshStandardMaterial({
        color: 0xff5a1f, // Modern delivery-robot vibrant orange/coral lid
        roughness: 0.28,
        metalness: 0.08
      });
      const visorMat = new THREE.MeshStandardMaterial({
        color: 0x0b0e14,
        roughness: 0.08,
        metalness: 0.85
      });
      const lensRimMat = new THREE.MeshStandardMaterial({
        color: 0x94a3b8,
        roughness: 0.25,
        metalness: 0.85
      });
      const lensGlassMat = new THREE.MeshStandardMaterial({
        color: 0x09192e,
        emissive: 0x0c2d48,
        emissiveIntensity: 0.35,
        roughness: 0.05,
        metalness: 0.95
      });
      const ledFrontMat = new THREE.MeshStandardMaterial({
        color: 0xe0f2fe,
        emissive: 0x38bdf8,
        emissiveIntensity: 1.4,
        roughness: 0.2
      });
      const ledRearMat = new THREE.MeshStandardMaterial({
        color: 0xfecaca,
        emissive: 0xef4444,
        emissiveIntensity: 1.2,
        roughness: 0.2
      });

      // 1. CHASSIS BOX: exact outer bounds [2*ch[0], 2*ch[2], 2*ch[1]] centered at (0,0,0)
      const chLen = ch[0] * 2;
      const chHeight = ch[2] * 2;
      const chWidth = ch[1] * 2;
      const chBevel = Math.min(chLen, chHeight, chWidth) * 0.22;

      const chassisGroup = new THREE.Group();
      // Upper white chassis fairing (top 60% of chassis height)
      const upperChH = chHeight * 0.62;
      const upperChassis = new THREE.Mesh(
        new RoundedBoxGeometry(chLen, upperChH, chWidth, 4, chBevel * 0.8),
        whiteShellMat
      );
      upperChassis.position.y = chHeight / 2 - upperChH / 2;
      upperChassis.castShadow = true;
      upperChassis.receiveShadow = true;
      chassisGroup.add(upperChassis);

      // Lower dark protective bumper / skid skirt (bottom 45% of chassis height)
      const lowerChH = chHeight * 0.46;
      const lowerChassis = new THREE.Mesh(
        new RoundedBoxGeometry(chLen * 0.996, lowerChH, chWidth * 0.996, 4, chBevel * 0.7),
        darkBumperMat
      );
      lowerChassis.position.y = -chHeight / 2 + lowerChH / 2;
      lowerChassis.castShadow = true;
      lowerChassis.receiveShadow = true;
      chassisGroup.add(lowerChassis);

      robotRoot.add(chassisGroup);

      // 2. CARGO BAY BOX: exact outer bounds [2*cg[0], 2*cg[2], 2*cg[1]] at Three.js offset (cgOff[0], cgOff[2], -cgOff[1])
      const cgLen = cg[0] * 2;
      const cgHeight = cg[2] * 2;
      const cgWidth = cg[1] * 2;
      const cgBevel = Math.min(cgLen, cgHeight, cgWidth) * 0.16;

      const cargoGroup = new THREE.Group();
      cargoGroup.position.set(cgOff[0], cgOff[2], -cgOff[1]);

      // Main white rounded cargo shell (bottom 82% of cargo height)
      const bodyH = cgHeight * 0.84;
      const cargoBody = new THREE.Mesh(
        new RoundedBoxGeometry(cgLen, bodyH, cgWidth, 5, cgBevel),
        whiteShellMat
      );
      cargoBody.position.y = -cgHeight / 2 + bodyH / 2;
      cargoBody.castShadow = true;
      cargoBody.receiveShadow = true;
      cargoGroup.add(cargoBody);

      // Colored top lid (top 20% of cargo height, flush with exact top cg[2])
      const lidH = cgHeight * 0.20;
      const cargoLid = new THREE.Mesh(
        new RoundedBoxGeometry(cgLen * 0.985, lidH, cgWidth * 0.985, 4, cgBevel * 0.7),
        lidMat
      );
      cargoLid.position.y = cgHeight / 2 - lidH / 2;
      cargoLid.castShadow = true;
      cargoLid.receiveShadow = true;
      cargoGroup.add(cargoLid);

      // Dark seam band between cargo body and lid
      const seamBand = new THREE.Mesh(
        new RoundedBoxGeometry(cgLen * 0.99, 0.008, cgWidth * 0.99, 3, 0.003),
        darkBumperMat
      );
      seamBand.position.y = cgHeight / 2 - lidH;
      cargoGroup.add(seamBand);

      // Dark Sensor Strip with Camera Lenses at the Front (+X face of cargo bay)
      const stripH = cgHeight * 0.28;
      const stripW = cgWidth * 0.86;
      const sensorStrip = new THREE.Mesh(
        new RoundedBoxGeometry(0.016, stripH, stripW, 3, 0.006),
        visorMat
      );
      sensorStrip.position.set(cg[0] - 0.005, cgHeight * 0.05, 0);
      cargoGroup.add(sensorStrip);

      // Camera lenses arranged across the front sensor strip (stereo pair + center RGB/ToF)
      const lensZPositions = [-stripW * 0.30, 0.0, stripW * 0.30];
      lensZPositions.forEach((lz, idx) => {
        const rOuter = idx === 1 ? 0.018 : 0.014;
        const bezel = new THREE.Mesh(
          new THREE.CylinderGeometry(rOuter, rOuter, 0.008, 16).rotateZ(Math.PI / 2),
          lensRimMat
        );
        bezel.position.set(cg[0] + 0.001, cgHeight * 0.05, lz);
        cargoGroup.add(bezel);

        const glass = new THREE.Mesh(
          new THREE.CylinderGeometry(rOuter * 0.74, rOuter * 0.74, 0.010, 16).rotateZ(Math.PI / 2),
          lensGlassMat
        );
        glass.position.set(cg[0] + 0.0015, cgHeight * 0.05, lz);
        cargoGroup.add(glass);
      });

      // Front LED status bar & Rear red tail light strip
      const frontLed = new THREE.Mesh(
        new RoundedBoxGeometry(0.008, 0.010, stripW * 0.78, 2, 0.003),
        ledFrontMat
      );
      frontLed.position.set(cg[0] - 0.002, -cgHeight * 0.16, 0);
      cargoGroup.add(frontLed);

      const rearLed = new THREE.Mesh(
        new RoundedBoxGeometry(0.008, 0.012, cgWidth * 0.68, 2, 0.004),
        ledRearMat
      );
      rearLed.position.set(-cg[0] + 0.002, 0, 0);
      cargoGroup.add(rearLed);

      // Small Orange Safety Flag on a Thin Pole (rear-left corner of cargo bay)
      const flagGroup = new THREE.Group();
      flagGroup.position.set(-cg[0] * 0.74, cgHeight / 2, -cg[1] * 0.74);

      const poleH = 0.48;
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.4, metalness: 0.6 });
      const poleMount = new THREE.Mesh(new THREE.CylinderGeometry(0.010, 0.013, 0.025, 10), poleMat);
      poleMount.position.y = 0.012;
      flagGroup.add(poleMount);

      const flagPole = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0045, poleH, 8), poleMat);
      flagPole.position.y = poleH / 2;
      flagPole.castShadow = true;
      flagGroup.add(flagPole);

      // Triangular orange pennant flag pointing backward (-X)
      const flagShape = new THREE.Shape();
      flagShape.moveTo(0, 0);
      flagShape.lineTo(-0.13, -0.042);
      flagShape.lineTo(0, -0.088);
      flagShape.closePath();

      const flagGeo = new THREE.ExtrudeGeometry(flagShape, { depth: 0.003, bevelEnabled: false });
      flagGeo.translate(0, 0, -0.0015);
      const flagMat = new THREE.MeshStandardMaterial({
        color: 0xff4500,
        emissive: 0xff3300,
        emissiveIntensity: 0.25,
        roughness: 0.45,
        side: THREE.DoubleSide
      });
      const flagMesh = new THREE.Mesh(flagGeo, flagMat);
      flagMesh.position.y = poleH - 0.006;
      flagMesh.castShadow = true;
      flagGroup.add(flagMesh);

      cargoGroup.add(flagGroup);
      robotRoot.add(cargoGroup);

      // 3. FOUR WHEELS (fl, fr, rl, rr)
      const tireMat = new THREE.MeshStandardMaterial({
        map: tireTreadTex,
        color: 0x22252a,
        roughness: 0.86,
        metalness: 0.05
      });
      const tireSideMat = new THREE.MeshStandardMaterial({
        color: 0x1b1e22,
        roughness: 0.78,
        metalness: 0.08
      });
      const hubMat = new THREE.MeshStandardMaterial({
        color: 0xd8dee9,
        roughness: 0.32,
        metalness: 0.72
      });
      const hubDarkMat = new THREE.MeshStandardMaterial({
        color: 0x2b303c,
        roughness: 0.45,
        metalness: 0.55
      });

      const wheelWidth = wHalfW * 2;
      const wheelKeys = ['fl', 'fr', 'rl', 'rr'];

      wheelKeys.forEach(key => {
        const off = wOffsets[key];
        const wGroup = new THREE.Group();
        // Convert MuJoCo offset [x, y, z] -> Three.js [x, z, -y]
        wGroup.position.set(off[0], off[2], -off[1]);

        // Suspension strut connecting wheel axle to chassis
        const strut = new THREE.Mesh(
          new THREE.CylinderGeometry(0.014, 0.014, Math.abs(off[1]) * 0.45, 8).rotateX(Math.PI / 2),
          darkBumperMat
        );
        strut.position.z = off[1] > 0 ? 0.025 : -0.025;
        wGroup.add(strut);

        // Spinning wheel assembly (rotates around Z axis in Three.js)
        const spinGroup = new THREE.Group();

        // Rubber tire cylinder (axis along Z)
        const tireCyl = new THREE.Mesh(
          new THREE.CylinderGeometry(wRad, wRad, wheelWidth, 28, 1, false).rotateX(Math.PI / 2),
          [tireMat, tireSideMat, tireSideMat]
        );
        tireCyl.castShadow = true;
        tireCyl.receiveShadow = true;
        spinGroup.add(tireCyl);

        // Hubcap disc on outer side of wheel
        const outerSign = off[1] > 0 ? -1 : 1; // fl/rl have -Z outer face; fr/rr have +Z outer face
        const hubDisc = new THREE.Mesh(
          new THREE.CylinderGeometry(wRad * 0.62, wRad * 0.62, wheelWidth * 1.03, 20).rotateX(Math.PI / 2),
          hubMat
        );
        spinGroup.add(hubDisc);

        // Center hub cap & 5 spokes so rotation is clearly visible
        const centerCap = new THREE.Mesh(
          new THREE.CylinderGeometry(wRad * 0.22, wRad * 0.22, wheelWidth * 1.08, 12).rotateX(Math.PI / 2),
          hubDarkMat
        );
        spinGroup.add(centerCap);

        for (let s = 0; s < 5; s++) {
          const ang = (s / 5) * Math.PI * 2;
          const spoke = new THREE.Mesh(
            new THREE.BoxGeometry(wRad * 0.52, wRad * 0.13, wheelWidth * 1.06),
            hubDarkMat
          );
          spoke.position.set(Math.cos(ang) * wRad * 0.32, Math.sin(ang) * wRad * 0.32, 0);
          spoke.rotation.z = ang;
          spinGroup.add(spoke);
        }

        wGroup.add(spinGroup);
        robotRoot.add(wGroup);
        wheelMeshes[key] = spinGroup;
      });
    }

    // -------------------------------------------------------------------------
    // Coordinate Conversion Helpers (MuJoCo Z-up -> Three.js Y-up)
    // -------------------------------------------------------------------------
    // Map sim (x, y, z) -> three (x, z, -y)
    function simPosToThree(p, target = new THREE.Vector3()) {
      return target.set(p[0], p[2], -p[1]);
    }

    // MuJoCo quaternion q = [w, x, y, z] rotated by -90 deg about X
    function simQuatToThree(q, target = new THREE.Quaternion()) {
      return target.set(q[1], q[3], -q[2], q[0]).normalize();
    }

    // -------------------------------------------------------------------------
    // Trajectory Interpolation & Pose Evaluation
    // -------------------------------------------------------------------------
    const _pos0 = new THREE.Vector3();
    const _pos1 = new THREE.Vector3();
    const _quat0 = new THREE.Quaternion();
    const _quat1 = new THREE.Quaternion();

    function sampleTrajectoryAtTime(t) {
      const frames = trajectoryData?.frames;
      if (!frames || frames.length === 0) {
        return {
          pos: new THREE.Vector3(-2, 0.35, 0),
          quat: new THREE.Quaternion(),
          wheels: [0, 0, 0, 0]
        };
      }

      if (t <= frames[0].t || frames.length === 1) {
        const f = frames[0];
        return {
          pos: simPosToThree(f.p, new THREE.Vector3()),
          quat: simQuatToThree(f.q, new THREE.Quaternion()),
          wheels: f.w ? [...f.w] : [0, 0, 0, 0]
        };
      }

      const last = frames[frames.length - 1];
      if (t >= last.t) {
        return {
          pos: simPosToThree(last.p, new THREE.Vector3()),
          quat: simQuatToThree(last.q, new THREE.Quaternion()),
          wheels: last.w ? [...last.w] : [0, 0, 0, 0]
        };
      }

      // Binary search for frame interval containing t
      let lo = 0;
      let hi = frames.length - 1;
      while (lo + 1 < hi) {
        const mid = (lo + hi) >>> 1;
        if (frames[mid].t <= t) lo = mid;
        else hi = mid;
      }

      const f0 = frames[lo];
      const f1 = frames[hi];
      const dt = f1.t - f0.t;
      const alpha = dt > 1e-6 ? THREE.MathUtils.clamp((t - f0.t) / dt, 0, 1) : 0;

      const pos = new THREE.Vector3().lerpVectors(
        simPosToThree(f0.p, _pos0),
        simPosToThree(f1.p, _pos1),
        alpha
      );
      const quat = new THREE.Quaternion().slerpQuaternions(
        simQuatToThree(f0.q, _quat0),
        simQuatToThree(f1.q, _quat1),
        alpha
      );

      const w0 = f0.w || [0, 0, 0, 0];
      const w1 = f1.w || [0, 0, 0, 0];
      const wheels = [
        w0[0] + alpha * (w1[0] - w0[0]),
        w0[1] + alpha * (w1[1] - w0[1]),
        w0[2] + alpha * (w1[2] - w0[2]),
        w0[3] + alpha * (w1[3] - w0[3])
      ];

      return { pos, quat, wheels };
    }

    // Compute deterministic smoothed chase camera at time t so both autoplay and random seek(t) are smooth
    function computeChaseCameraPose(t, curbHeight = 0.2) {
      const frames = trajectoryData?.frames;
      if (!frames || frames.length === 0) {
        return {
          camPos: new THREE.Vector3(-3.8, 1.4, 1.3),
          lookAt: new THREE.Vector3(-2.0, 0.35, 0.0)
        };
      }

      // Integrate causal exponential smoothing up to time t
      const f0 = frames[0];
      const smoothPos = simPosToThree(f0.p, new THREE.Vector3());
      const initQuat = simQuatToThree(f0.q, new THREE.Quaternion());
      const forward = new THREE.Vector3(1, 0, 0).applyQuaternion(initQuat);
      forward.y = 0;
      if (forward.lengthSq() < 1e-4) forward.set(1, 0, 0);
      forward.normalize();
      const smoothFwd = forward.clone();

      let prevT = f0.t;
      for (let i = 1; i < frames.length; i++) {
        const fi = frames[i];
        const segEndT = Math.min(fi.t, t);
        const dt = segEndT - prevT;
        if (dt <= 0) break;

        const pose = (t < fi.t) ? sampleTrajectoryAtTime(t) : {
          pos: simPosToThree(fi.p, _pos0),
          quat: simQuatToThree(fi.q, _quat0)
        };

        const kPos = 1.0 - Math.exp(-dt * 6.5);
        smoothPos.lerp(pose.pos, kPos);

        const fwdNow = new THREE.Vector3(1, 0, 0).applyQuaternion(pose.quat);
        // Only update horizontal heading when robot isn't completely upside-down
        if (fwdNow.x * fwdNow.x + fwdNow.z * fwdNow.z > 0.15) {
          fwdNow.y = 0;
          fwdNow.normalize();
          const kHeading = 1.0 - Math.exp(-dt * 3.5);
          smoothFwd.lerp(fwdNow, kHeading).normalize();
        }

        prevT = segEndT;
        if (fi.t >= t) break;
      }

      // Right vector in Three.js XZ plane (where +X cross +Y = +Z is right)
      const right = new THREE.Vector3(-smoothFwd.z, 0, smoothFwd.x).normalize();

      // Behind-right of the robot at ~2.5 m
      // sqrt(1.85^2 + 1.32^2 + 1.05^2) = 2.505 m
      const camPos = smoothPos.clone()
        .addScaledVector(smoothFwd, -1.85)
        .addScaledVector(right, 1.32);
      camPos.y = Math.max(curbHeight + 0.65, smoothPos.y + 1.05);

      const lookAt = smoothPos.clone().addScaledVector(smoothFwd, 0.22);
      lookAt.y += 0.06;

      return { camPos, lookAt };
    }

    function updateCameraForTime(t, robotPose) {
      const curbX = trajectoryData?.meta?.world?.curb_x ?? 0.0;
      const curbHeight = trajectoryData?.meta?.world?.curb_height ?? 0.2;

      if (activeCamMode === 'side') {
        // Fixed at the curb looking along the road side so the curb drop is clearly visible
        camera.position.set(curbX + 0.42, curbHeight + 0.22, 2.25);
        camera.lookAt(curbX - 0.12, curbHeight * 0.62, -0.25);
      } else if (activeCamMode === 'street') {
        // Pedestrian eye height across the road looking back toward the robot and storefront street
        camera.position.set(curbX + 5.4, 1.66, 2.35);
        const lookX = THREE.MathUtils.lerp(curbX - 0.4, robotPose.pos.x, 0.35);
        const lookZ = THREE.MathUtils.lerp(-0.2, robotPose.pos.z, 0.35);
        camera.lookAt(lookX, curbHeight + 0.28, lookZ);
      } else {
        // Default 'chase': behind-right of the robot at ~2.5m, looking at it, smoothed
        const { camPos, lookAt } = computeChaseCameraPose(t, curbHeight);
        camera.position.copy(camPos);
        camera.lookAt(lookAt);
      }
    }

    // -------------------------------------------------------------------------
    // Contract API: window.seek(t) and window.loadTrajectory(obj)
    // -------------------------------------------------------------------------
    window.seek = function(t) {
      const dur = window.duration || 0;
      currentTime = dur > 0 ? THREE.MathUtils.clamp(Number(t) || 0, 0, dur) : 0;

      const pose = sampleTrajectoryAtTime(currentTime);
      robotRoot.position.copy(pose.pos);
      robotRoot.quaternion.copy(pose.quat);

      // Apply wheel spin angles [fl, fr, rl, rr] about wheel axle (MuJoCo +Y -> Three.js -Z)
      if (wheelMeshes.fl) wheelMeshes.fl.rotation.z = -pose.wheels[0];
      if (wheelMeshes.fr) wheelMeshes.fr.rotation.z = -pose.wheels[1];
      if (wheelMeshes.rl) wheelMeshes.rl.rotation.z = -pose.wheels[2];
      if (wheelMeshes.rr) wheelMeshes.rr.rotation.z = -pose.wheels[3];

      // Update sun shadow camera center near robot so shadows stay ultra-sharp
      sunLight.target.position.set(pose.pos.x, 0, pose.pos.z);
      sunLight.target.updateMatrixWorld();

      updateCameraForTime(currentTime, pose);

      if (!isCapture) {
        timeReadoutEl.textContent = `${currentTime.toFixed(2)}s / ${dur.toFixed(2)}s`;
        timeSliderEl.value = dur > 0 ? (currentTime / dur).toString() : '0';
      }

      renderer.render(scene, camera);
    };

    window.loadTrajectory = function(obj) {
      if (!obj || !Array.isArray(obj.frames)) return;
      // Filter out any placeholder string like "..." if someone pastes the raw sample snippet
      const validFrames = obj.frames.filter(f => f && typeof f === 'object' && typeof f.t === 'number');
      trajectoryData = {
        ...obj,
        frames: validFrames
      };

      const curbX = trajectoryData.meta?.world?.curb_x ?? 0.0;
      const curbHeight = trajectoryData.meta?.world?.curb_height ?? 0.2;

      buildCityWorld(curbX, curbHeight);
      buildRobotModel(trajectoryData.meta?.robot);

      window.duration = validFrames.length > 0 ? validFrames[validFrames.length - 1].t : 0;

      // Update HUD outcome badge
      const outcome = (trajectoryData.meta?.outcome || 'unknown').toString();
      outcomeBadgeEl.textContent = outcome;
      outcomeBadgeEl.className = `outcome-badge ${outcome.toLowerCase()}`;

      window.seek(0);
      window.__ready = true;
    };

    // -------------------------------------------------------------------------
    // Built-in Physics-Accurate Default Trajectory (matches prompt sample)
    // -------------------------------------------------------------------------
    function generateDefaultTrajectory() {
      const meta = {
        fps: 30,
        outcome: "fell",
        event_t: 2.499999999999999,
        scenario: {
          curb_height: 0.2,
          approach_angle_deg: 8.0,
          start_dist: 2.0,
          lateral_offset: 0.0,
          friction: 0.9,
          observed_speed: 1.1,
          name: "demo"
        },
        policy: {
          cruise_speed: 1.1,
          slow_dist: 0.0,
          slow_speed: 1.1,
          descent_angle_deg: 0.0,
          heading_gain: 0.0,
          align_tol_deg: 90.0
        },
        robot: {
          chassis_half: [0.26, 0.15, 0.06],
          cargo_half: [0.22, 0.15, 0.12],
          cargo_offset: [-0.02, 0.0, 0.18],
          wheel_radius: 0.08,
          wheel_half_width: 0.03,
          wheel_offsets: {
            fl: [0.18, 0.17, -0.07],
            fr: [0.18, -0.17, -0.07],
            rl: [-0.18, 0.17, -0.07],
            rr: [-0.18, -0.17, -0.07]
          }
        },
        world: {
          curb_x: 0.0,
          curb_height: 0.2,
          note: "z up; x from sidewalk (x<0, top at curb_height) toward road (x>0, z=0); curb edge runs along y"
        }
      };

      // Exact initial frames from the prompt followed by smooth 30fps curb drop & tip-over
      const frames = [
        {
          t: 0.0,
          p: [-2.0, 0.0, 0.37],
          q: [0.99756, 0.0, 0.0, 0.06976],
          w: [0.0, 0.0, 0.0, 0.0]
        },
        {
          t: 0.034,
          p: [-1.9998, 0.0, 0.364],
          q: [0.99756, 0.0001, -0.00134, 0.06975],
          w: [0.3088, 0.3088, 0.3088, 0.3088]
        },
        {
          t: 0.068,
          p: [-1.9996, 0.0001, 0.3477],
          q: [0.99756, 0.00012, -0.00158, 0.06975],
          w: [0.738, 0.738, 0.7332, 0.7332]
        }
      ];

      const yaw = THREE.MathUtils.degToRad(8.0);
      const cosY = Math.cos(yaw);
      const sinY = Math.sin(yaw);
      const dt = 1 / 30;
      let x = -1.9996;
      let y = 0.0001;
      let z = 0.3477;
      let wSpin = 0.738;

      const euler = new THREE.Euler(0, 0, 0, 'ZYX');
      const qTmp = new THREE.Quaternion();

      for (let i = 3; i <= 96; i++) {
        const t = Number((i * dt).toFixed(4));
        let speed = 1.1 * Math.min(1.0, (t - 0.04) / 0.22);
        let pitch = 0.0; // positive pitch in MuJoCo = nose down about +Y
        let roll = 0.0;  // roll about +X

        if (t > 1.72 && t <= 2.52) {
          // Front wheels cross curb at x = 0 with 8-deg oblique angle, pitching nose-down & rolling right
          const u = (t - 1.72) / 0.80;
          const ease = u * u * (3 - 2 * u);
          speed = 1.1 * (1.0 - 0.68 * ease);
          z = 0.35 - 0.175 * Math.pow(u, 1.35);
          pitch = ease * 1.48; // ~85 deg forward/side tip
          roll = ease * 0.52;
        } else if (t > 2.52) {
          // Settled tipped on the asphalt road after event_t = 2.5s
          const settle = Math.exp(-(t - 2.52) * 6.0) * Math.cos((t - 2.52) * 18.0);
          speed = Math.max(0, 0.25 * Math.exp(-(t - 2.52) * 5.0));
          z = 0.175 + 0.012 * Math.abs(settle);
          pitch = 1.52 + 0.04 * settle;
          roll = 0.55 + 0.03 * settle;
        } else {
          z = 0.35;
        }

        x += speed * cosY * dt;
        y += speed * sinY * dt;
        wSpin += (speed * dt) / 0.08;

        euler.set(roll, pitch, yaw, 'ZYX');
        qTmp.setFromEuler(euler);

        frames.push({
          t,
          p: [Number(x.toFixed(5)), Number(y.toFixed(5)), Number(z.toFixed(5))],
          q: [
            Number(qTmp.w.toFixed(5)),
            Number(qTmp.x.toFixed(5)),
            Number(qTmp.y.toFixed(5)),
            Number(qTmp.z.toFixed(5))
          ],
          w: [
            Number(wSpin.toFixed(4)),
            Number((wSpin * 0.995).toFixed(4)),
            Number((wSpin * 0.99).toFixed(4)),
            Number((wSpin * 0.99).toFixed(4))
          ]
        });
      }

      return { meta, frames };
    }

    // -------------------------------------------------------------------------
    // Window Resize & Animation Loop
    // -------------------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (window.__ready) {
        window.seek(currentTime);
      }
    });

    let lastRafTime = performance.now();
    let endPauseTimer = 0;

    function animate(now) {
      requestAnimationFrame(animate);
      if (isCapture || !isPlaying || !window.__ready) {
        lastRafTime = now;
        return;
      }

      const dt = Math.min((now - lastRafTime) / 1000, 0.1);
      lastRafTime = now;

      const dur = window.duration || 0;
      if (dur > 0) {
        if (currentTime >= dur) {
          endPauseTimer += dt;
          if (endPauseTimer >= 0.85) {
            endPauseTimer = 0;
            window.seek(0);
          }
        } else {
          window.seek(Math.min(dur, currentTime + dt));
        }
      }
    }

    // -------------------------------------------------------------------------
    // Initialization (Fetch ?traj= if present, else load default trajectory)
    // -------------------------------------------------------------------------
    async function init() {
      if (trajParam) {
        try {
          const response = await fetch(trajParam);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          window.loadTrajectory(data);
        } catch (err) {
          console.warn('Failed to fetch trajectory from URL param, using fallback trajectory:', err);
          window.loadTrajectory(generateDefaultTrajectory());
        }
      } else {
        window.loadTrajectory(generateDefaultTrajectory());
      }
      requestAnimationFrame(animate);
    }

    init();
  </script>
</body>
