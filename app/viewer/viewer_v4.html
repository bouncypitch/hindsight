    // -------------------------------------------------------------------------
    // Coordinate Conversion & Trajectory Interpolation
    // -------------------------------------------------------------------------
    function simPosToThree(p, target = new THREE.Vector3()) {
      return target.set(p[0], p[2], -p[1]);
    }

    function simQuatToThree(q, target = new THREE.Quaternion()) {
      return target.set(q[1], q[3], -q[2], q[0]).normalize();
    }

    const _pos0 = new THREE.Vector3();
    const _pos1 = new THREE.Vector3();
    const _quat0 = new THREE.Quaternion();
    const _quat1 = new THREE.Quaternion();

    function sampleTrajectoryAtTime(t) {
      const frames = trajectoryData?.frames;
      if (!frames || frames.length === 0) {
        return {
          pos: new THREE.Vector3(-2, 0.35, 0),
          quat: new THREE.Quaternion(),
          wheels: [0, 0, 0, 0]
        };
      }

      if (t <= frames[0].t || frames.length === 1) {
        const f = frames[0];
        return {
          pos: simPosToThree(f.p, new THREE.Vector3()),
          quat: simQuatToThree(f.q, new THREE.Quaternion()),
          wheels: f.w ? [...f.w] : [0, 0, 0, 0]
        };
      }

      const last = frames[frames.length - 1];
      if (t >= last.t) {
        return {
          pos: simPosToThree(last.p, new THREE.Vector3()),
          quat: simQuatToThree(last.q, new THREE.Quaternion()),
          wheels: last.w ? [...last.w] : [0, 0, 0, 0]
        };
      }

      let lo = 0;
      let hi = frames.length - 1;
      while (lo + 1 < hi) {
        const mid = (lo + hi) >>> 1;
        if (frames[mid].t <= t) lo = mid;
        else hi = mid;
      }

      const f0 = frames[lo];
      const f1 = frames[hi];
      const dt = f1.t - f0.t;
      const alpha = dt > 1e-6 ? THREE.MathUtils.clamp((t - f0.t) / dt, 0, 1) : 0;

      const pos = new THREE.Vector3().lerpVectors(
        simPosToThree(f0.p, _pos0),
        simPosToThree(f1.p, _pos1),
        alpha
      );
      const quat = new THREE.Quaternion().slerpQuaternions(
        simQuatToThree(f0.q, _quat0),
        simQuatToThree(f1.q, _quat1),
        alpha
      );

      const w0 = f0.w || [0, 0, 0, 0];
      const w1 = f1.w || [0, 0, 0, 0];
      const wheels = [
        w0[0] + alpha * (w1[0] - w0[0]),
        w0[1] + alpha * (w1[1] - w0[1]),
        w0[2] + alpha * (w1[2] - w0[2]),
        w0[3] + alpha * (w1[3] - w0[3])
      ];

      return { pos, quat, wheels };
    }

    function computeChaseCameraPose(t, curbHeight = 0.2) {
      const frames = trajectoryData?.frames;
      if (!frames || frames.length === 0) {
        return {
          camPos: new THREE.Vector3(-3.6, 1.05, 1.65),
          lookAt: new THREE.Vector3(-1.8, 0.38, 0.0)
        };
      }

      const f0 = frames[0];
      const smoothPos = simPosToThree(f0.p, new THREE.Vector3());
      const initQuat = simQuatToThree(f0.q, new THREE.Quaternion());
      const forward = new THREE.Vector3(1, 0, 0).applyQuaternion(initQuat);
      forward.y = 0;
      if (forward.lengthSq() < 1e-4) forward.set(1, 0, 0);
      forward.normalize();
      const smoothFwd = forward.clone();

      let prevT = f0.t;
      for (let i = 1; i < frames.length; i++) {
        const fi = frames[i];
        const segEndT = Math.min(fi.t, t);
        const dt = segEndT - prevT;
        if (dt <= 0) break;

        const pose = (t < fi.t) ? sampleTrajectoryAtTime(t) : {
          pos: simPosToThree(fi.p, _pos0),
          quat: simQuatToThree(fi.q, _quat0)
        };

        const kPos = 1.0 - Math.exp(-dt * 6.5);
        smoothPos.lerp(pose.pos, kPos);

        const fwdNow = new THREE.Vector3(1, 0, 0).applyQuaternion(pose.quat);
        if (fwdNow.x * fwdNow.x + fwdNow.z * fwdNow.z > 0.15) {
          fwdNow.y = 0;
          fwdNow.normalize();
          const kHeading = 1.0 - Math.exp(-dt * 3.5);
          smoothFwd.lerp(fwdNow, kHeading).normalize();
        }

        prevT = segEndT;
        if (fi.t >= t) break;
      }

      const right = new THREE.Vector3(-smoothFwd.z, 0, smoothFwd.x).normalize();

      const camPos = smoothPos.clone()
        .addScaledVector(smoothFwd, -1.62)
        .addScaledVector(right, 1.68);
      camPos.y = Math.max(smoothPos.y + 0.78, 0.55);

      const lookAt = smoothPos.clone().addScaledVector(smoothFwd, 0.30);
      lookAt.y += 0.12;

      return { camPos, lookAt };
    }

    // Quaternion helper to align Three.js camera (-Z forward, +Y up, +X right) with Robot frame (+X forward, +Y up, +Z right)
    const _qCamAlign = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2);
    const _qCamPitch = new THREE.Quaternion();
    const _localCamOffset = new THREE.Vector3();

    function computeRobotCameraTransform(pose, outPos, outQuat) {
      const camCfg = sceneConfig.camera;
      const h = Number(camCfg.height_m ?? 0.10);
      const pitchDeg = Number(camCfg.pitch_deg ?? -8.0);

      // x = +0.27m forward, z = +height_m (Three.js +Y) above chassis center
      _localCamOffset.set(0.27, h, 0.0);
      outPos.copy(_localCamOffset).applyQuaternion(pose.quat).add(pose.pos);

      _qCamPitch.setFromAxisAngle(new THREE.Vector3(1, 0, 0), THREE.MathUtils.degToRad(pitchDeg));
      outQuat.copy(pose.quat).multiply(_qCamAlign).multiply(_qCamPitch);
    }

    const _pBefore = new THREE.Vector3();
    const _pAfter = new THREE.Vector3();
    const _qBefore = new THREE.Quaternion();
    const _qAfter = new THREE.Quaternion();
    const _qDelta = new THREE.Quaternion();

    function updateCameraForTime(t, robotPose) {
      const curbX = trajectoryData?.meta?.world?.curb_x ?? 0.0;
      const curbHeight = trajectoryData?.meta?.world?.curb_height ?? 0.2;
      const kind = activeWorldMeta.kind;

      if (activeCamMode === 'robot') {
        // Compute vertical FOV from horizontal FOV (`scene.camera.hfov_deg`, default 110) and aspect
        const hfovRad = THREE.MathUtils.degToRad(sceneConfig.camera.hfov_deg || 110);
        const aspect = Math.max(0.1, camera.aspect);
        const vfovRad = 2.0 * Math.atan(Math.tan(hfovRad * 0.5) / aspect);
        const vfovDeg = THREE.MathUtils.radToDeg(vfovRad);

        if (Math.abs(camera.fov - vfovDeg) > 0.01) {
          camera.fov = vfovDeg;
          camera.updateProjectionMatrix();
        }

        computeRobotCameraTransform(robotPose, camera.position, camera.quaternion);

        // Compute instantaneous camera linear & angular velocity for deterministic optical-flow motion blur
        const dtSample = 0.034;
        const t0 = Math.max(0, t - dtSample * 0.5);
        const t1 = Math.min(window.duration || 0.034, t + dtSample * 0.5);
        const span = Math.max(1e-4, t1 - t0);

        const pose0 = sampleTrajectoryAtTime(t0);
        const pose1 = sampleTrajectoryAtTime(t1);
        computeRobotCameraTransform(pose0, _pBefore, _qBefore);
        computeRobotCameraTransform(pose1, _pAfter, _qAfter);

        const worldVel = _pAfter.clone().sub(_pBefore).divideScalar(span);
        const invCamQuat = camera.quaternion.clone().invert();
        // Transform velocity into camera local space (+X right, +Y up, -Z forward -> flip Z so +Z is forward speed)
        const localVel = worldVel.applyQuaternion(invCamQuat);
        postMaterial.uniforms.uLinearVel.value.set(localVel.x, localVel.y, -localVel.z);

        _qDelta.copy(_qBefore).invert().multiply(_qAfter);
        if (_qDelta.w < 0) {
          _qDelta.x = -_qDelta.x;
          _qDelta.y = -_qDelta.y;
          _qDelta.z = -_qDelta.z;
          _qDelta.w = -_qDelta.w;
        }
        const sinHalf = Math.hypot(_qDelta.x, _qDelta.y, _qDelta.z);
        if (sinHalf > 1e-5) {
          const angle = 2.0 * Math.atan2(sinHalf, _qDelta.w);
          const scale = (angle / span) / sinHalf;
          postMaterial.uniforms.uAngularVel.value.set(_qDelta.x * scale, _qDelta.y * scale, _qDelta.z * scale);
        } else {
          postMaterial.uniforms.uAngularVel.value.set(0, 0, 0);
        }

        postMaterial.uniforms.uIsRobotCam.value = 1.0;
        postMaterial.uniforms.uTime.value = t;
      } else {
        if (Math.abs(camera.fov - 44) > 0.01) {
          camera.fov = 44;
          camera.updateProjectionMatrix();
        }
        postMaterial.uniforms.uIsRobotCam.value = 0.0;

        if (activeCamMode === 'side') {
          if (kind === 'drop' || kind === 'climb') {
            camera.position.set(curbX + 0.38, curbHeight + 0.20, 2.05);
            camera.lookAt(curbX - 0.08, curbHeight + 0.04, -0.35);
          } else {
            camera.position.set(robotPose.pos.x + 0.4, robotPose.pos.y + 0.45, 2.25);
            camera.lookAt(robotPose.pos.x + 0.5, robotPose.pos.y + 0.18, 0.0);
          }
        } else if (activeCamMode === 'street') {
          if (kind === 'drop' || kind === 'climb') {
            camera.position.set(curbX + 6.2, 1.65, 2.15);
            const lookX = THREE.MathUtils.lerp(curbX - 0.6, robotPose.pos.x, 0.35);
            const lookZ = THREE.MathUtils.lerp(-0.4, robotPose.pos.z, 0.35);
            camera.lookAt(lookX, curbHeight + 0.82, lookZ);
          } else {
            camera.position.set(3.8, 1.65, 3.2);
            camera.lookAt(robotPose.pos.x + 0.8, 0.55, robotPose.pos.z * 0.4);
          }
        } else {
          const { camPos, lookAt } = computeChaseCameraPose(t, curbHeight);
          camera.position.copy(camPos);
          camera.lookAt(lookAt);
        }
      }
    }

    // -------------------------------------------------------------------------
    // Contract API: window.loadScene(obj), window.seek(t), window.loadTrajectory(obj)
    // -------------------------------------------------------------------------
    window.loadScene = function(obj) {
      sceneConfig = mergeSceneConfig(obj);
      sceneVersion++;
      applySkyAndAtmosphere(sceneConfig);

      if (trajectoryData) {
        buildWorldForScenario(trajectoryData.meta?.world, trajectoryData.meta?.scenario, sceneConfig);
        window.seek(currentTime);
      }
    };

    window.seek = function(t) {
      const dur = window.duration || 0;
      currentTime = dur > 0 ? THREE.MathUtils.clamp(Number(t) || 0, 0, dur) : 0;

      const pose = sampleTrajectoryAtTime(currentTime);
      robotRoot.position.copy(pose.pos);
      robotRoot.quaternion.copy(pose.quat);

      if (wheelMeshes.fl) wheelMeshes.fl.rotation.z = -pose.wheels[0];
      if (wheelMeshes.fr) wheelMeshes.fr.rotation.z = -pose.wheels[1];
      if (wheelMeshes.rl) wheelMeshes.rl.rotation.z = -pose.wheels[2];
      if (wheelMeshes.rr) wheelMeshes.rr.rotation.z = -pose.wheels[3];

      updatePedestrianAtTime(currentTime);

      // Keep directional shadow frustum centered near robot
      sunLight.target.position.set(pose.pos.x + 1.5, 0, pose.pos.z);
      sunLight.target.updateMatrixWorld();

      updateCameraForTime(currentTime, pose);

      if (!isCapture) {
        timeReadoutEl.textContent = `${currentTime.toFixed(2)}s / ${dur.toFixed(2)}s`;
        timeSliderEl.value = dur > 0 ? (currentTime / dur).toString() : '0';
      }

      // Render 3D scene to offscreen MSAA target, then run optics + grade post-process pass
      renderer.setRenderTarget(renderTarget);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.render(postScene, postCamera);
    };

    window.loadTrajectory = function(obj) {
      if (!obj || !Array.isArray(obj.frames)) return;
      const validFrames = obj.frames.filter(f => f && typeof f === 'object' && typeof f.t === 'number');
      trajectoryData = {
        ...obj,
        frames: validFrames
      };

      const worldMeta = trajectoryData.meta?.world || {};
      const scenarioMeta = trajectoryData.meta?.scenario || {};
      const kind = (worldMeta.kind || scenarioMeta.kind || 'drop').toLowerCase();

      buildWorldForScenario(worldMeta, scenarioMeta, sceneConfig);
      buildRobotModel(trajectoryData.meta?.robot);
      preparePedestrianTrack(validFrames);

      const pedHeight = worldMeta?.pedestrian?.height ?? 1.7;
      buildPedestrianRig(pedHeight);

      window.duration = validFrames.length > 0 ? validFrames[validFrames.length - 1].t : 0;

      const outcome = (trajectoryData.meta?.outcome || 'unknown').toString();
      outcomeBadgeEl.textContent = outcome;
      outcomeBadgeEl.className = `outcome-badge ${outcome.toLowerCase()}`;
      hudTitleEl.textContent = `${kind.toUpperCase()} SIM REPLAY`;

      window.seek(0);
      window.__ready = true;
    };

    // -------------------------------------------------------------------------
    // Built-in Physics-Accurate Default Trajectory
    // -------------------------------------------------------------------------
    function generateDefaultTrajectory() {
      const meta = {
        fps: 30,
        outcome: "fell",
        event_t: 2.499999999999999,
        scenario: {
          kind: "drop",
          curb_height: 0.2,
          approach_angle_deg: 8.0,
          start_dist: 2.0,
          lateral_offset: 0.0,
          friction: 0.9,
          observed_speed: 1.1,
          name: "demo"
        },
        policy: {
          cruise_speed: 1.1,
          slow_dist: 0.0,
          slow_speed: 1.1,
          descent_angle_deg: 0.0,
          heading_gain: 0.0,
          align_tol_deg: 90.0
        },
        robot: {
          chassis_half: [0.26, 0.15, 0.06],
          cargo_half: [0.22, 0.15, 0.12],
          cargo_offset: [-0.02, 0.0, 0.18],
          wheel_radius: 0.08,
          wheel_half_width: 0.03,
          wheel_offsets: {
            fl: [0.18, 0.17, -0.07],
            fr: [0.18, -0.17, -0.07],
            rl: [-0.18, 0.17, -0.07],
            rr: [-0.18, -0.17, -0.07]
          }
        },
        world: {
          kind: "drop",
          curb_x: 0.0,
          curb_height: 0.2,
          note: "z up; x from sidewalk (x<0, top at curb_height) toward road (x>0, z=0); curb edge runs along y"
        }
      };

      const frames = [
        {
          t: 0.0,
          p: [-2.0, 0.0, 0.37],
          q: [0.99756, 0.0, 0.0, 0.06976],
          w: [0.0, 0.0, 0.0, 0.0]
        },
        {
          t: 0.034,
          p: [-1.9998, 0.0, 0.364],
          q: [0.99756, 0.0001, -0.00134, 0.06975],
          w: [0.3088, 0.3088, 0.3088, 0.3088]
        },
        {
          t: 0.068,
          p: [-1.9996, 0.0001, 0.3477],
          q: [0.99756, 0.00012, -0.00158, 0.06975],
          w: [0.738, 0.738, 0.7332, 0.7332]
        }
      ];

      const yaw = THREE.MathUtils.degToRad(8.0);
      const cosY = Math.cos(yaw);
      const sinY = Math.sin(yaw);
      const dt = 1 / 30;
      let x = -1.9996;
      let y = 0.0001;
      let z = 0.35;
      let wSpin = 0.738;

      const euler = new THREE.Euler(0, 0, 0, 'ZYX');
      const qTmp = new THREE.Quaternion();

      for (let i = 3; i <= 96; i++) {
        const t = Number((i * dt).toFixed(4));
        let speed = 1.1 * Math.min(1.0, (t - 0.04) / 0.18);
        let pitch = 0.0;
        let roll = 0.0;

        if (t > 1.68 && t <= 2.02) {
          const u = (t - 1.68) / 0.34;
          const ease = u * u * (3 - 2 * u);
          speed = 1.05;
          pitch = ease * 0.58;
          roll = ease * 0.14;
          z = 0.35 - 0.10 * ease;
        } else if (t > 2.02 && t <= 2.50) {
          const u = (t - 2.02) / 0.48;
          const ease = u * u * (3 - 2 * u);
          speed = 1.05 * (1.0 - 0.72 * ease);
          pitch = 0.58 + ease * 1.12;
          roll = 0.14 + ease * 0.24;
          z = 0.25 - 0.05 * ease;
        } else if (t > 2.50) {
          const settle = Math.exp(-(t - 2.50) * 6.5) * Math.cos((t - 2.50) * 18.0);
          speed = Math.max(0, 0.22 * Math.exp(-(t - 2.50) * 5.5));
          pitch = 1.70 + 0.03 * settle;
          roll = 0.38 + 0.02 * settle;
          z = 0.20 + 0.008 * Math.abs(settle);
        } else {
          z = 0.35;
        }

        x += speed * cosY * dt;
        y += speed * sinY * dt;
        wSpin += (speed * dt) / 0.08;

        euler.set(roll, pitch, yaw, 'ZYX');
        qTmp.setFromEuler(euler);

        frames.push({
          t,
          p: [Number(x.toFixed(5)), Number(y.toFixed(5)), Number(z.toFixed(5))],
          q: [
            Number(qTmp.w.toFixed(5)),
            Number(qTmp.x.toFixed(5)),
            Number(qTmp.y.toFixed(5)),
            Number(qTmp.z.toFixed(5))
          ],
          w: [
            Number(wSpin.toFixed(4)),
            Number((wSpin * 0.995).toFixed(4)),
            Number((wSpin * 0.99).toFixed(4)),
            Number((wSpin * 0.99).toFixed(4))
          ]
        });
      }

      return { meta, frames };
    }

    // -------------------------------------------------------------------------
    // Window Resize & Animation Loop
    // -------------------------------------------------------------------------
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      const pr = renderer.getPixelRatio();
      renderTarget.setSize(Math.max(1, Math.floor(w * pr)), Math.max(1, Math.floor(h * pr)));
      postMaterial.uniforms.uAspect.value = w / h;
      if (window.__ready) {
        window.seek(currentTime);
      }
    });

    let lastRafTime = performance.now();
    let endPauseTimer = 0;

    function animate(now) {
      requestAnimationFrame(animate);
      if (isCapture || !isPlaying || !window.__ready) {
        lastRafTime = now;
        return;
      }

      const dt = Math.min((now - lastRafTime) / 1000, 0.1);
      lastRafTime = now;

      const dur = window.duration || 0;
      if (dur > 0) {
        if (currentTime >= dur) {
          endPauseTimer += dt;
          if (endPauseTimer >= 0.85) {
            endPauseTimer = 0;
            window.seek(0);
          }
        } else {
          window.seek(Math.min(dur, currentTime + dt));
        }
      }
    }

    // -------------------------------------------------------------------------
    // Initialization (Fetch ?scene= first if present, then ?traj= or fallback)
    // -------------------------------------------------------------------------
    async function init() {
      if (sceneParam) {
        try {
          const sRes = await fetch(sceneParam);
          if (!sRes.ok) throw new Error(`HTTP ${sRes.status}`);
          const sData = await sRes.json();
          window.loadScene(sData);
        } catch (err) {
          console.warn('Failed to fetch scene from URL param, using default scene:', err);
          applySkyAndAtmosphere(sceneConfig);
        }
      } else {
        applySkyAndAtmosphere(sceneConfig);
      }

      if (trajParam) {
        try {
          const response = await fetch(trajParam);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          window.loadTrajectory(data);
        } catch (err) {
          console.warn('Failed to fetch trajectory from URL param, using fallback trajectory:', err);
          window.loadTrajectory(generateDefaultTrajectory());
        }
      } else {
        window.loadTrajectory(generateDefaultTrajectory());
      }
      requestAnimationFrame(animate);
    }

    init();
  </script>
</body>
