    function createBrickFacadeTexture(baseHex = '#8c4638', mortarHex = '#b5aea3') {
      const W = 512, H = 512;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = mortarHex;
      ctx.fillRect(0, 0, W, H);

      const heightMap = new Float32Array(W * H);
      const rng = mulberry32(4242);
      const rows = 32;
      const cols = 16;
      const bH = H / rows;
      const bW = W / cols;
      const baseCol = parseHexRGB(baseHex, '#8c4638').color;

      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (bW * 0.5);
        for (let c = -1; c <= cols; c++) {
          const x = c * bW + offset;
          const y = r * bH;
          const delta = (rng() - 0.5) * 0.12;
          const col = baseCol.clone().offsetHSL((rng() - 0.5) * 0.02, (rng() - 0.5) * 0.06, delta);
          ctx.fillStyle = `#${col.getHexString()}`;
          ctx.fillRect(x + 1.5, y + 1.5, bW - 3, bH - 3);
        }
      }

      const img = ctx.getImageData(0, 0, W, H);
      for (let i = 0; i < W * H; i++) {
        heightMap[i] = (img.data[i * 4] + img.data[i * 4 + 1] + img.data[i * 4 + 2]) / (3 * 255);
      }

      const map = new THREE.CanvasTexture(canvas);
      map.wrapS = THREE.RepeatWrapping;
      map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = maxAnisotropy;

      const normalMap = heightToNormalTexture(heightMap, W, H, 2.8);
      normalMap.anisotropy = maxAnisotropy;
      return { map, normalMap };
    }

    function createLimestoneFacadeTexture(baseL = 186) {
      const W = 512, H = 512;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const n1 = createNoise2D(717, 64);
      const rng = mulberry32(718);

      const img = ctx.createImageData(W, H);
      const heightMap = new Float32Array(W * H);
      const blockH = 64;
      const blockW = 128;

      for (let y = 0; y < H; y++) {
        const row = Math.floor(y / blockH);
        const dy = Math.min(y % blockH, blockH - (y % blockH));
        for (let x = 0; x < W; x++) {
          const xShift = x + (row % 2) * (blockW / 2);
          const dx = Math.min(xShift % blockW, blockW - (xShift % blockW));
          const joint = Math.min(dx, dy) < 2 ? 0.74 : 1.0;

          const noise = fbm2D(n1, (x / W) * 8, (y / H) * 8, 3);
          const grain = (rng() - 0.5) * 0.05;
          const v = (baseL + (noise - 0.5) * 20 + grain * 25) * joint;

          const idx = (y * W + x) * 4;
          img.data[idx] = Math.min(240, v + 5);
          img.data[idx + 1] = Math.min(240, v + 1);
          img.data[idx + 2] = Math.min(240, v - 6);
          img.data[idx + 3] = 255;

          heightMap[y * W + x] = joint < 1.0 ? 0.2 : 0.6 + (noise - 0.5) * 0.2;
        }
      }
      ctx.putImageData(img, 0, 0);

      const map = new THREE.CanvasTexture(canvas);
      map.wrapS = THREE.RepeatWrapping;
      map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = maxAnisotropy;

      const normalMap = heightToNormalTexture(heightMap, W, H, 3.0);
      normalMap.anisotropy = maxAnisotropy;
      return { map, normalMap };
    }

    function createDistantBuildingTexture(seed = 77) {
      const W = 512, H = 512;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const rng = mulberry32(seed);

      const palettes = [
        { wall: '#8e8479', spandrel: '#58524b', frame: '#363330', ground: '#383532' },
        { wall: '#78828c', spandrel: '#485058', frame: '#2a3036', ground: '#2c3138' },
        { wall: '#8f6c58', spandrel: '#594336', frame: '#362820', ground: '#3b2e26' },
        { wall: '#9c9284', spandrel: '#665f55', frame: '#3d3934', ground: '#403c36' }
      ];
      const pal = palettes[seed % palettes.length];

      ctx.fillStyle = pal.wall;
      ctx.fillRect(0, 0, W, H);

      const cols = 8;
      const rows = 10;
      const cellW = W / cols;
      const cellH = H / rows;

      for (let r = 0; r < rows; r++) {
        const isGroundRow = (r === rows - 1);
        ctx.fillStyle = isGroundRow ? pal.ground : pal.spandrel;
        ctx.fillRect(0, r * cellH, W, isGroundRow ? cellH : 6);

        for (let c = 0; c < cols; c++) {
          const wx = c * cellW + (isGroundRow ? 5 : 8);
          const wy = r * cellH + (isGroundRow ? 8 : 10);
          const ww = cellW - (isGroundRow ? 10 : 16);
          const wh = cellH - (isGroundRow ? 10 : 16);

          ctx.fillStyle = pal.frame;
          ctx.fillRect(wx - 2, wy - 2, ww + 4, wh + 4);

          const gGrad = ctx.createLinearGradient(wx, wy, wx, wy + wh);
          const refl = rng();
          if (isGroundRow) {
            gGrad.addColorStop(0, '#1e2832');
            gGrad.addColorStop(0.6, '#2e2722');
            gGrad.addColorStop(1, '#181512');
          } else if (refl > 0.70) {
            gGrad.addColorStop(0, '#586e82');
            gGrad.addColorStop(1, '#2b3947');
          } else {
            gGrad.addColorStop(0, '#2c3d4f');
            gGrad.addColorStop(1, '#18222c');
          }
          ctx.fillStyle = gGrad;
          ctx.fillRect(wx, wy, ww, wh);

          if (!isGroundRow && rng() > 0.45) {
            ctx.fillStyle = 'rgba(195, 190, 180, 0.22)';
            ctx.fillRect(wx + 2, wy + 2, ww - 4, wh * (0.25 + rng() * 0.35));
          }
          ctx.fillStyle = pal.frame;
          ctx.fillRect(wx, wy + wh * (isGroundRow ? 0.28 : 0.48), ww, 2);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAnisotropy;
      return tex;
    }

    function createClothTexture(baseHex = '#2c3e50', weaveScale = 32) {
      const W = 128, H = 128;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(W, H);
      const base = parseHexRGB(baseHex, '#2c3e50');
      const n1 = createNoise2D(313, 32);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const weave = ((x + y) % 2 === 0 ? 4 : -4) + Math.sin(x * weaveScale) * 2;
          const fold = (fbm2D(n1, (x / W) * 6, (y / H) * 6, 3) - 0.5) * 18;
          const idx = (y * W + x) * 4;
          img.data[idx]     = Math.max(10, Math.min(245, base.r + weave + fold));
          img.data[idx + 1] = Math.max(10, Math.min(245, base.g + weave + fold));
          img.data[idx + 2] = Math.max(10, Math.min(245, base.b + weave + fold));
          img.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Shared static textures
    const whitePaintTex = createRoadPaintTexture('#e8ecf0');
    const yellowPaintTex = createRoadPaintTexture('#eab308');
    const stormGrateTex = createStormDrainGrateTexture();
    const barkTex = createBarkTextures();
    const leafSprigTex = createLeafSprigTexture();
    const contactShadowTex = createSoftContactShadowTexture();

    // -------------------------------------------------------------------------
    // World Height Function & Scenario Geometry Builder
    // -------------------------------------------------------------------------
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    let lastWorldBuildKey = '';
    let activeWorldMeta = {
      kind: 'drop',
      curbX: 0.0,
      curbHeight: 0.2,
      slopeDeg: 0.0,
      slopeLen: 3.0,
      sidewalkWidth: 4.5
    };

    // Evaluates the exact ground elevation (sim Z / Three.js Y) at any sim (x, y)
    function getGroundHeight(simX, simY) {
      const { kind, curbX, curbHeight, slopeDeg, slopeLen } = activeWorldMeta;
      if (kind === 'drop') {
        return simX <= curbX ? curbHeight : 0.0;
      } else if (kind === 'climb') {
        return simX >= curbX ? curbHeight : 0.0;
      } else if (kind === 'slope') {
        const slopeRad = THREE.MathUtils.degToRad(slopeDeg);
        const rise = Math.tan(slopeRad);
        if (simX <= curbX) return 0.0;
        if (simX >= curbX + slopeLen) return slopeLen * rise;
        return (simX - curbX) * rise;
      }
      // For obstacle & pedestrian, main sidewalk is at z = 0.0
      return 0.0;
    }

    function createClonedPBRMaterial(texBundle, repeatX, repeatY, wet = 0.0, tintHex = null) {
      const mMap = texBundle.map.clone();
      mMap.repeat.set(repeatX, repeatY);
      mMap.needsUpdate = true;

      const mRough = texBundle.roughnessMap.clone();
      mRough.repeat.set(repeatX, repeatY);
      mRough.needsUpdate = true;

      const mNorm = texBundle.normalMap.clone();
      mNorm.repeat.set(repeatX, repeatY);
      mNorm.needsUpdate = true;

      const mat = new THREE.MeshStandardMaterial({
        map: mMap,
        roughnessMap: mRough,
        normalMap: mNorm,
        normalScale: new THREE.Vector2(0.85, 0.85),
        roughness: wet > 0.01 ? Math.max(0.25, 0.92 - wet * 0.55) : 0.92,
        metalness: wet > 0.2 ? 0.08 : 0.02
      });
      if (tintHex) mat.color.set(tintHex);
      return mat;
    }

    function buildWorldForScenario(worldMeta, scenarioMeta, cfg) {
      const kind = (worldMeta?.kind || scenarioMeta?.kind || 'drop').toLowerCase();
      const curbX = Number(worldMeta?.curb_x ?? 0.0);
      const curbHeight = Number(worldMeta?.curb_height ?? scenarioMeta?.curb_height ?? 0.2);
      const slopeDeg = Number(worldMeta?.slope_deg ?? scenarioMeta?.slope_deg ?? (kind === 'slope' ? 8.0 : 0.0));
      const slopeLen = Number(worldMeta?.slope_len ?? 3.0);
      const obsData = worldMeta?.obstacle || (kind === 'obstacle' ? {
        x: Number(scenarioMeta?.obs_x ?? 2.0),
        y: Number(scenarioMeta?.obs_y ?? 0.0),
        r: Number(scenarioMeta?.obs_r ?? 0.15)
      } : null);

      const buildKey = JSON.stringify({
        kind, curbX, curbHeight, slopeDeg, slopeLen, obsData, sceneVersion
      });
      if (buildKey === lastWorldBuildKey) return;
      lastWorldBuildKey = buildKey;

      activeWorldMeta = { kind, curbX, curbHeight, slopeDeg, slopeLen, sidewalkWidth: 4.5 };

      while (worldGroup.children.length > 0) {
        worldGroup.remove(worldGroup.children[0]);
      }

      applySkyAndAtmosphere(cfg);

      const groundTex = createGroundTextures(cfg.ground);
      const curbTex = createCurbTextures(cfg.curb);
      const asphaltTex = createAsphaltTextures(cfg.road.color, cfg.ground.wet);
      const tileScale = Math.max(0.25, (cfg.ground.tile_size_m || 1.2) * 2.0);
      const streetLength = 180;
      const curbStoneW = 0.18;

      // Curb Face & Top Materials
      const cMapFace = curbTex.map.clone();
      cMapFace.repeat.set(streetLength / 2.4, 1);
      cMapFace.needsUpdate = true;
      const cNormFace = curbTex.normalMap.clone();
      cNormFace.repeat.copy(cMapFace.repeat);
      cNormFace.needsUpdate = true;

      const cMapTop = curbTex.map.clone();
      cMapTop.rotation = Math.PI / 2;
      cMapTop.center.set(0.5, 0.5);
      cMapTop.repeat.set(streetLength / 2.4, 0.8);
      cMapTop.needsUpdate = true;
      const cNormTop = curbTex.normalMap.clone();
      cNormTop.rotation = Math.PI / 2;
      cNormTop.center.set(0.5, 0.5);
      cNormTop.repeat.copy(cMapTop.repeat);
      cNormTop.needsUpdate = true;

      const curbFaceMat = new THREE.MeshStandardMaterial({
        map: cMapFace,
        normalMap: cNormFace,
        normalScale: new THREE.Vector2(1.0, 1.0),
        roughness: 0.80,
        metalness: 0.04
      });
      const curbTopMat = new THREE.MeshStandardMaterial({
        map: cMapTop,
        normalMap: cNormTop,
        normalScale: new THREE.Vector2(0.85, 0.85),
        roughness: 0.82,
        metalness: 0.04
      });
      const curbMats = [curbFaceMat, curbFaceMat, curbTopMat, curbTopMat, curbFaceMat, curbFaceMat];

      // -----------------------------------------------------------------------
      // CASE 1 & 2: DROP and CLIMB (Curb runs along Y at x = curbX)
      // -----------------------------------------------------------------------
      if (kind === 'drop' || kind === 'climb') {
        const isClimb = kind === 'climb';
        const dirSign = isClimb ? -1 : 1; // +1: sidewalk x<curbX, road x>curbX; -1: road x<curbX, sidewalk x>curbX
        const sidewalkW = 16.0;
        const sidewalkMat = createClonedPBRMaterial(
          groundTex,
          sidewalkW / tileScale,
          streetLength / tileScale,
          cfg.ground.wet
        );

        // Raised Sidewalk
        const swCenterX = isClimb
          ? (curbX + curbStoneW + sidewalkW / 2)
          : (curbX - curbStoneW - sidewalkW / 2);
        const sidewalkMesh = new THREE.Mesh(
          new THREE.BoxGeometry(sidewalkW, curbHeight + 0.2, streetLength),
          sidewalkMat
        );
        sidewalkMesh.position.set(swCenterX, (curbHeight - 0.2) / 2, 0);
        sidewalkMesh.receiveShadow = true;
        worldGroup.add(sidewalkMesh);

        // Curb Block & Bullnose
        const curbCenterX = isClimb ? (curbX + curbStoneW / 2) : (curbX - curbStoneW / 2);
        const curbMesh = new THREE.Mesh(
          new THREE.BoxGeometry(curbStoneW, curbHeight + 0.08, streetLength),
          curbMats
        );
        curbMesh.position.set(curbCenterX, (curbHeight - 0.08) / 2, 0);
        curbMesh.castShadow = true;
        curbMesh.receiveShadow = true;
        worldGroup.add(curbMesh);

        const bullnoseGeo = new THREE.CylinderGeometry(0.014, 0.014, streetLength, 10);
        bullnoseGeo.rotateX(Math.PI / 2);
        const bullnoseMesh = new THREE.Mesh(bullnoseGeo, curbTopMat);
        bullnoseMesh.position.set(curbX - dirSign * 0.013, curbHeight - 0.013, 0);
        bullnoseMesh.receiveShadow = true;
        worldGroup.add(bullnoseMesh);

        // Road surface (or lower ground if road.present === false)
        const roadW = 40.0;
        const roadSurfTex = cfg.road.present ? asphaltTex : groundTex;
        const roadScale = cfg.road.present ? 2.6 : tileScale;
        const roadMat = createClonedPBRMaterial(
          roadSurfTex,
          roadW / roadScale,
          streetLength / roadScale,
          cfg.ground.wet
        );
        const roadGeo = new THREE.PlaneGeometry(roadW, streetLength);
        roadGeo.rotateX(-Math.PI / 2);
        const roadMesh = new THREE.Mesh(roadGeo, roadMat);
        roadMesh.position.set(curbX + dirSign * (roadW / 2), 0.0, 0.0);
        roadMesh.receiveShadow = true;
        worldGroup.add(roadMesh);

        // Concrete Gutter & Moisture Seam at Curb Base
        const gutterW = 0.40;
        const gutterMat = createClonedPBRMaterial(groundTex, gutterW / 1.4, streetLength / 3.0, cfg.ground.wet, '#94908a');
        const gutterMesh = new THREE.Mesh(new THREE.PlaneGeometry(gutterW, streetLength).rotateX(-Math.PI / 2), gutterMat);
        gutterMesh.position.set(curbX + dirSign * (gutterW / 2), 0.0015, 0);
        gutterMesh.receiveShadow = true;
        worldGroup.add(gutterMesh);

        const seamMat = new THREE.MeshBasicMaterial({ color: 0x1a1917, transparent: true, opacity: 0.56, depthWrite: false });
        const cornerSeam = new THREE.Mesh(new THREE.PlaneGeometry(0.06, streetLength).rotateX(-Math.PI / 2), seamMat);
        cornerSeam.position.set(curbX + dirSign * 0.03, 0.0025, 0);
        worldGroup.add(cornerSeam);

        // Storm Drain at Curb Base
        const drainGroup = new THREE.Group();
        drainGroup.position.set(curbX, 0, -2.45);
        if (isClimb) drainGroup.rotation.y = Math.PI;
        const grateMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(0.38, 0.68).rotateX(-Math.PI / 2),
          new THREE.MeshStandardMaterial({ map: stormGrateTex, roughness: 0.65, metalness: 0.55 })
        );
        grateMesh.position.set(0.20, 0.0035, 0);
        grateMesh.receiveShadow = true;
        drainGroup.add(grateMesh);
        const hoodTop = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, 0.016, 0.70),
          new THREE.MeshStandardMaterial({ color: 0x3e3732, roughness: 0.62, metalness: 0.60 })
        );
        hoodTop.position.set(-0.09, curbHeight + 0.002, 0);
        drainGroup.add(hoodTop);
        worldGroup.add(drainGroup);

        // Lane Markings & Crosswalk
        if (cfg.road.present && cfg.road.lane_markings) {
          addRoadMarkings(curbX, dirSign, roadMat.normalMap, curbHeight);
        }

        // Far Sidewalk & Background Buildings across the road so horizon is complete
        const farCurbX = curbX + dirSign * 11.2;
        const farSidewalk = new THREE.Mesh(new THREE.BoxGeometry(14, curbHeight + 0.2, streetLength), sidewalkMat);
        farSidewalk.position.set(farCurbX + dirSign * 7.0, (curbHeight - 0.2) / 2, 0);
        farSidewalk.receiveShadow = true;
        worldGroup.add(farSidewalk);

        const farCurb = new THREE.Mesh(new THREE.BoxGeometry(curbStoneW, curbHeight + 0.08, streetLength), curbMats);
        farCurb.position.set(farCurbX + dirSign * (curbStoneW / 2), (curbHeight - 0.08) / 2, 0);
        farCurb.receiveShadow = true;
        worldGroup.add(farCurb);

        const bldgFar = createHeroBuildingRow(curbHeight, true, '#8c6d58');
        bldgFar.rotation.y = isClimb ? 0 : Math.PI;
        bldgFar.position.set(curbX + dirSign * 16.7, 0, 3.0);
        worldGroup.add(bldgFar);

        const bldgNear = createHeroBuildingRow(curbHeight, false, '#864133');
        bldgNear.rotation.y = isClimb ? Math.PI : 0;
        bldgNear.position.set(curbX - dirSign * 5.8, 0, 0);
        worldGroup.add(bldgNear);
      }

      // -----------------------------------------------------------------------
      // CASE 3: SLOPE (Flat x < curbX, Ramp rising at slopeDeg for slopeLen, then Plateau)
      // -----------------------------------------------------------------------
      else if (kind === 'slope') {
        const slopeRad = THREE.MathUtils.degToRad(slopeDeg);
        const plateauH = slopeLen * Math.tan(slopeRad);
        const hypLen = slopeLen / Math.cos(slopeRad);
        const corridorW = 9.0;

        // 1. Flat approach (x < curbX)
        const flatLen = 60.0;
        const flatMat = createClonedPBRMaterial(groundTex, flatLen / tileScale, corridorW / tileScale, cfg.ground.wet);
        const flatMesh = new THREE.Mesh(new THREE.BoxGeometry(flatLen, 0.3, corridorW), flatMat);
        flatMesh.position.set(curbX - flatLen / 2, -0.15, 0);
        flatMesh.receiveShadow = true;
        worldGroup.add(flatMesh);

        // 2. Inclined Ramp (curbX <= x <= curbX + slopeLen)
        const rampMat = createClonedPBRMaterial(groundTex, hypLen / tileScale, corridorW / tileScale, cfg.ground.wet);
        const rampThick = 0.25;
        const rampGeo = new THREE.BoxGeometry(hypLen, rampThick, corridorW);
        // Offset box down by rampThick/2 so its top face pivots cleanly through (curbX, 0) to (curbX + slopeLen, plateauH)
        rampGeo.translate(0, -rampThick / 2, 0);
        const rampMesh = new THREE.Mesh(rampGeo, rampMat);
        rampMesh.position.set(curbX + slopeLen / 2, plateauH / 2, 0);
        rampMesh.rotation.z = slopeRad;
        rampMesh.receiveShadow = true;
        worldGroup.add(rampMesh);

        // 3. Upper Plateau (x > curbX + slopeLen)
        const platLen = 70.0;
        const platMat = createClonedPBRMaterial(groundTex, platLen / tileScale, corridorW / tileScale, cfg.ground.wet);
        const platMesh = new THREE.Mesh(new THREE.BoxGeometry(platLen, plateauH + 0.3, corridorW), platMat);
        platMesh.position.set(curbX + slopeLen + platLen / 2, (plateauH - 0.3) / 2, 0);
        platMesh.receiveShadow = true;
        worldGroup.add(platMesh);

        // Tactile warning strips at bottom & top of ramp + low concrete cheek curbs
        const adaMat = new THREE.MeshStandardMaterial({ color: 0xd99b06, roughness: 0.62 });
        const bottomAda = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.008, 2.6), adaMat);
        bottomAda.position.set(curbX - 0.25, 0.004, 0);
        bottomAda.receiveShadow = true;
        worldGroup.add(bottomAda);

        const topAda = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.008, 2.6), adaMat);
        topAda.position.set(curbX + slopeLen + 0.25, plateauH + 0.004, 0);
        topAda.receiveShadow = true;
        worldGroup.add(topAda);

        // Stainless steel ramp handrails on left & right of the ramp
        const railMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.25, metalness: 0.85 });
        [-1.85, 1.85].forEach(rz => {
          const railGroup = new THREE.Group();
          for (let f = 0; f <= 1.0; f += 0.5) {
            const px = curbX + f * slopeLen;
            const py = f * plateauH;
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.92, 12), railMat);
            post.position.set(px, py + 0.46, rz);
            post.castShadow = true;
            railGroup.add(post);
          }
          const topBar = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, hypLen + 0.2, 12).rotateZ(Math.PI / 2), railMat);
          topBar.position.set(curbX + slopeLen / 2, plateauH / 2 + 0.90, rz);
          topBar.rotation.z = slopeRad;
          topBar.castShadow = true;
          railGroup.add(topBar);
          worldGroup.add(railGroup);
        });

        if (cfg.road.present) {
          addParallelSideRoad(cfg, groundTex, asphaltTex, curbMats, curbTopMat, streetLength);
        }
      }

      // -----------------------------------------------------------------------
      // CASE 4 & 5: OBSTACLE and PEDESTRIAN (Sidewalk corridor along X at z = 0)
      // -----------------------------------------------------------------------
      else {
        const swWidth = 8.5;
        const swLen = 180;
        const swMat = createClonedPBRMaterial(groundTex, swLen / tileScale, swWidth / tileScale, cfg.ground.wet);
        const swMesh = new THREE.Mesh(new THREE.BoxGeometry(swLen, 0.3, swWidth), swMat);
        swMesh.position.set(0, -0.15, 0);
        swMesh.receiveShadow = true;
        worldGroup.add(swMesh);

        if (cfg.road.present) {
          addParallelSideRoad(cfg, groundTex, asphaltTex, curbMats, curbTopMat, swLen);
        }
      }

      // -----------------------------------------------------------------------
      // Sidewalk Micro-Details (Fallen leaves, utility covers, expansion seams)
      // -----------------------------------------------------------------------
      addSidewalkMicroDetails(kind, curbX, curbHeight);

      // -----------------------------------------------------------------------
      // Populate `scene.left` (sim y > 0 -> Three.js z < 0) and `scene.right` (sim y < 0 -> Three.js z > 0)
      // -----------------------------------------------------------------------
      buildCorridorSideElements(cfg.left, +1, cfg);
      buildCorridorSideElements(cfg.right, -1, cfg);

      // -----------------------------------------------------------------------
      // Populate `scene.props` at exact (x, y, getGroundHeight(x, y))
      // -----------------------------------------------------------------------
      if (Array.isArray(cfg.props)) {
        cfg.props.forEach((p, idx) => {
          if (!p || typeof p.x !== 'number' || typeof p.y !== 'number') return;
          const propObj = createSceneProp(p.type, idx);
          if (propObj) {
            const gz = getGroundHeight(p.x, p.y);
            propObj.position.set(p.x, gz, -p.y);
            worldGroup.add(propObj);
          }
        });
      }

      // -----------------------------------------------------------------------
      // Scenario Obstacle (meta.world.obstacle: { x, y, r })
      // -----------------------------------------------------------------------
      if (obsData && typeof obsData.x === 'number' && typeof obsData.y === 'number') {
        const obsRadius = Number(obsData.r ?? 0.15);
        const obsMesh = createScenarioObstacle(obsRadius);
        const gz = getGroundHeight(obsData.x, obsData.y);
        obsMesh.position.set(obsData.x, gz, -obsData.y);
        worldGroup.add(obsMesh);
      }

      // -----------------------------------------------------------------------
      // Distant Horizon Cityscape
      // -----------------------------------------------------------------------
      const distantCity = createDistantCityscape(curbX, 0.0);
      worldGroup.add(distantCity);
    }

    function addParallelSideRoad(cfg, groundTex, asphaltTex, curbMats, curbTopMat, length) {
      // Place curb & parallel asphalt street on the right side of the sidewalk (sim y < -2.3 -> Three.js z > +2.3)
      const curbZ = 2.35;
      const roadDrop = 0.14;
      const curbStoneW = 0.18;

      const curbBlock = new THREE.Mesh(new THREE.BoxGeometry(length, 0.24, curbStoneW), curbMats);
      curbBlock.position.set(0, -0.10, curbZ + curbStoneW / 2);
      curbBlock.castShadow = true;
      curbBlock.receiveShadow = true;
      worldGroup.add(curbBlock);

      const bullnose = new THREE.Mesh(
        new THREE.CylinderGeometry(0.014, 0.014, length, 10).rotateZ(Math.PI / 2),
        curbTopMat
      );
      bullnose.position.set(0, -0.012, curbZ + 0.012);
      worldGroup.add(bullnose);

      const roadW = 18.0;
      const roadMat = createClonedPBRMaterial(asphaltTex, length / 2.6, roadW / 2.6, cfg.ground.wet);
      const roadMesh = new THREE.Mesh(new THREE.PlaneGeometry(length, roadW).rotateX(-Math.PI / 2), roadMat);
      roadMesh.position.set(0, -roadDrop, curbZ + curbStoneW + roadW / 2);
      roadMesh.receiveShadow = true;
      worldGroup.add(roadMesh);

      if (cfg.road.lane_markings) {
        const whiteMat = new THREE.MeshStandardMaterial({ map: whitePaintTex, roughness: 0.72 });
        const yellowMat = new THREE.MeshStandardMaterial({ map: yellowPaintTex, roughness: 0.72 });

        const bikeLine = new THREE.Mesh(new THREE.PlaneGeometry(length, 0.10).rotateX(-Math.PI / 2), whiteMat);
        bikeLine.position.set(0, -roadDrop + 0.003, curbZ + 2.4);
        worldGroup.add(bikeLine);

        [-0.08, 0.08].forEach(off => {
          const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(length, 0.11).rotateX(-Math.PI / 2), yellowMat);
          centerLine.position.set(0, -roadDrop + 0.003, curbZ + 5.8 + off);
          worldGroup.add(centerLine);
        });

        // Crosswalk stripes across the parallel road at x = 2.0 (matching pedestrian crossing!)
        for (let s = 0; s < 6; s++) {
          const stripe = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.42).rotateX(-Math.PI / 2), whiteMat);
          stripe.position.set(2.0, -roadDrop + 0.004, curbZ + 0.65 + s * 0.85);
          stripe.receiveShadow = true;
          worldGroup.add(stripe);
        }
      }
    }

    function addRoadMarkings(curbX, dirSign, roadNormalMap, curbHeight) {
      const whitePaintMat = new THREE.MeshStandardMaterial({
        map: whitePaintTex,
        normalMap: roadNormalMap,
        normalScale: new THREE.Vector2(0.55, 0.55),
        roughness: 0.75
      });
      const yellowPaintMat = new THREE.MeshStandardMaterial({
        map: yellowPaintTex,
        normalMap: roadNormalMap,
        normalScale: new THREE.Vector2(0.55, 0.55),
        roughness: 0.75
      });

      const centerX = curbX + dirSign * 5.5;
      [-0.09, 0.09].forEach(offset => {
        const line1 = new THREE.Mesh(new THREE.PlaneGeometry(0.11, 95).rotateX(-Math.PI / 2), yellowPaintMat);
        line1.position.set(centerX + offset, 0.003, 43.7);
        line1.receiveShadow = true;
        worldGroup.add(line1);

        const line2 = new THREE.Mesh(new THREE.PlaneGeometry(0.11, 95).rotateX(-Math.PI / 2), yellowPaintMat);
        line2.position.set(centerX + offset, 0.003, -56.1);
        line2.receiveShadow = true;
        worldGroup.add(line2);
      });

      const bikeLine = new THREE.Mesh(new THREE.PlaneGeometry(0.10, 95).rotateX(-Math.PI / 2), whitePaintMat);
      bikeLine.position.set(curbX + dirSign * 2.35, 0.003, 43.7);
      bikeLine.receiveShadow = true;
      worldGroup.add(bikeLine);

      const stopBar = new THREE.Mesh(new THREE.PlaneGeometry(5.0, 0.42).rotateX(-Math.PI / 2), whitePaintMat);
      stopBar.position.set(curbX + dirSign * 2.9, 0.0035, -4.1);
      stopBar.receiveShadow = true;
      worldGroup.add(stopBar);

      for (let i = 0; i < 11; i++) {
        const cwX = curbX + dirSign * (0.65 + i * 0.98);
        const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.48, 2.7).rotateX(-Math.PI / 2), whitePaintMat);
        stripe.position.set(cwX, 0.0035, -6.3);
        stripe.receiveShadow = true;
        worldGroup.add(stripe);
      }

      const adaPad = new THREE.Mesh(
        new THREE.BoxGeometry(0.60, 0.010, 1.45),
        new THREE.MeshStandardMaterial({ color: 0xd99b06, roughness: 0.65 })
      );
      adaPad.position.set(curbX - dirSign * 0.50, curbHeight + 0.005, -6.3);
      adaPad.receiveShadow = true;
      worldGroup.add(adaPad);
    }

    function addSidewalkMicroDetails(kind, curbX, curbHeight) {
      const rng = mulberry32(7071);
      const leafColors = [0x6e5332, 0x826138, 0x5c462b, 0x946b36];
      const leafGeo = new THREE.PlaneGeometry(0.042, 0.028).rotateX(-Math.PI / 2);

      // Scatter small fallen leaves and pebbles near the sidewalk edges for low-angle robot camera realism
      for (let i = 0; i < 48; i++) {
        const lx = -3.5 + rng() * 11.0;
        const ly = (rng() - 0.5) * 3.8;
        // Avoid placing directly on the curb step edge
        if ((kind === 'drop' || kind === 'climb') && Math.abs(lx - curbX) < 0.25) continue;

        const lz = getGroundHeight(lx, ly);
        const leafMat = new THREE.MeshStandardMaterial({
          color: leafColors[i % leafColors.length],
          roughness: 0.85,
          side: THREE.DoubleSide
        });
        const leaf = new THREE.Mesh(leafGeo, leafMat);
        leaf.position.set(lx, lz + 0.0025, -ly);
        leaf.rotation.y = rng() * Math.PI * 2;
        if (kind === 'slope' && lx > curbX && lx < curbX + activeWorldMeta.slopeLen) {
          leaf.rotation.z = THREE.MathUtils.degToRad(activeWorldMeta.slopeDeg);
        }
        worldGroup.add(leaf);
      }

      // Flush cast-iron utility handhole box on sidewalk
      const utilX = -0.85, utilY = 0.72;
      const utilZ = getGroundHeight(utilX, utilY);
      const utilBox = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.006, 0.48),
        new THREE.MeshStandardMaterial({ color: 0x3b3834, roughness: 0.68, metalness: 0.55 })
      );
      utilBox.position.set(utilX, utilZ + 0.001, -utilY);
      utilBox.receiveShadow = true;
      worldGroup.add(utilBox);
    }

    // -------------------------------------------------------------------------
    // Corridor Left & Right Elements Builder (`scene.left` / `scene.right`)
    // -------------------------------------------------------------------------
    function buildCorridorSideElements(items, sideSign, cfg) {
      if (!Array.isArray(items)) return;

      // sideSign = +1 -> Left of robot (sim +Y -> Three.js -Z)
      // sideSign = -1 -> Right of robot (sim -Y -> Three.js +Z)
      items.forEach((item, idx) => {
        if (!item || !item.type) return;
        const type = item.type.toLowerCase();
        const dist = Math.max(0.8, Number(item.distance_m ?? 4.0));
        const height = Number(item.height_m ?? 8.0);
        const colorHex = item.color || null;

        const zThree = -sideSign * dist;
        const baseY = getGroundHeight(-1.0, sideSign * dist);

        if (type === 'building') {
          const bGroup = createCorridorBuildingRow(height, colorHex, sideSign, idx);
          bGroup.position.set(0, baseY, zThree);
          worldGroup.add(bGroup);
        } else if (type === 'fence') {
          const fGroup = createCorridorFence(height || 1.6, colorHex || '#272b30', 76);
          fGroup.position.set(0, baseY, zThree);
          worldGroup.add(fGroup);
        } else if (type === 'hedge') {
          const hGroup = createCorridorHedge(height || 1.35, colorHex || '#2d5428', 72);
          hGroup.position.set(0, baseY, zThree);
          worldGroup.add(hGroup);
        } else if (type === 'grass') {
          const gTex = createGroundTextures({ type: 'grass', color: colorHex || '#487534', wear: 0.2, wet: cfg.ground.wet });
          const gMat = createClonedPBRMaterial(gTex, 45, 2.5, cfg.ground.wet);
          const gStrip = new THREE.Mesh(new THREE.BoxGeometry(90, 0.04, 2.8), gMat);
          gStrip.position.set(0, baseY + 0.01, zThree - sideSign * 1.4);
          gStrip.receiveShadow = true;
          worldGroup.add(gStrip);
        } else if (type === 'trees') {
          const treeXs = [-16, -8.5, -1.8, 5.2, 12.5, 20.0, 28.0];
          treeXs.forEach((tx, tIdx) => {
            // Keep clear of curb drop zone if too close
            if ((activeWorldMeta.kind === 'drop' || activeWorldMeta.kind === 'climb') && Math.abs(tx - activeWorldMeta.curbX) < 1.2) return;
            const ty = getGroundHeight(tx, sideSign * dist);
            const tGroup = createStreetTreeWithPit(0, 200 + idx * 31 + tIdx * 13, height || 6.0, colorHex);
            tGroup.position.set(tx, ty, zThree);
            worldGroup.add(tGroup);
          });
        } else if (type === 'parked_cars') {
          const carColors = [
            colorHex ? parseHexRGB(colorHex).color.getHex() : 0x24303f,
            0x5c646d, 0x4a1d22, 0x1e293b, 0x2e3b30, 0x6b7280
          ];
          const carXs = [-14.0, -7.2, 0.2, 6.8, 13.8, 21.0];
          carXs.forEach((cx, cIdx) => {
            if ((activeWorldMeta.kind === 'drop' || activeWorldMeta.kind === 'climb') && Math.abs(cx) < 3.5) return;
            const car = createParkedCar(carColors[cIdx % carColors.length]);
            // Align car along X axis (driving corridor direction)
            car.rotation.y = sideSign > 0 ? -Math.PI / 2 : Math.PI / 2;
            const cy = (activeWorldMeta.kind === 'drop' || activeWorldMeta.kind === 'climb')
              ? getGroundHeight(cx, sideSign * dist)
              : -0.14;
            car.position.set(cx, cy, zThree);
            worldGroup.add(car);
          });
        } else if (type === 'wall') {
          const wGroup = createCorridorWall(height || 1.8, colorHex || '#8b7d70', 76);
          wGroup.position.set(0, baseY, zThree);
          worldGroup.add(wGroup);
        } else if (type === 'open_plaza') {
          const pTex = createGroundTextures({
            type: 'checker_pavers',
            color: colorHex || '#c2bab0',
            secondary_color: '#8f887f',
            tile_size_m: 0.8,
            wear: 0.2,
            wet: cfg.ground.wet
          });
          const pMat = createClonedPBRMaterial(pTex, 40, 10, cfg.ground.wet);
          const plaza = new THREE.Mesh(new THREE.BoxGeometry(80, 0.04, 18), pMat);
          plaza.position.set(0, baseY, zThree - sideSign * 9.0);
          plaza.receiveShadow = true;
          worldGroup.add(plaza);
        } else if (type === 'canopy') {
          const cGroup = createSidewalkCanopy(height || 3.2, colorHex || '#1e293b', sideSign, 36);
          cGroup.position.set(2.0, baseY, zThree);
          worldGroup.add(cGroup);
        }
      });
    }

    function createCorridorBuildingRow(targetHeight = 12, colorHex = '#864133', sideSign = 1, seed = 0) {
      const group = new THREE.Group();
      const bBrick = createBrickFacadeTexture(colorHex || '#864133', '#b5ada2');
      bBrick.map.repeat.set(3, Math.max(2, Math.round(targetHeight / 3.2)));
      bBrick.normalMap.repeat.copy(bBrick.map.repeat);

      const stoneTex = createLimestoneFacadeTexture(172);
      stoneTex.map.repeat.set(3, Math.max(2, Math.round(targetHeight / 3.5)));
      stoneTex.normalMap.repeat.copy(stoneTex.map.repeat);

      const trimStone = createLimestoneFacadeTexture(165);
      const trimMat = new THREE.MeshStandardMaterial({ map: trimStone.map, normalMap: trimStone.normalMap, roughness: 0.78 });
      const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x202429, roughness: 0.38, metalness: 0.70 });
      const upperWinTex = createUpperWindowTexture(303 + seed);
      const upperWinMat = new THREE.MeshStandardMaterial({ map: upperWinTex, roughness: 0.12, metalness: 0.75 });
      const sfTextures = [
        createStorefrontGlassTexture(0),
        createStorefrontGlassTexture(1),
        createStorefrontGlassTexture(2),
        createStorefrontGlassTexture(3)
      ];

      const segments = [-21, -7, 7, 21];
      const segLen = 13.8;
      const depth = 10.0;
      const awningColors = [0x1e3a5f, 0x6b1d1d, 0x1b4332, 0x334155];

      segments.forEach((sx, bIdx) => {
        const h = Math.max(5.5, targetHeight + ((bIdx % 2 === 0) ? 0.8 : -0.6));
        const useTex = (bIdx % 2 === 0) ? bBrick : stoneTex;
        const wallMat = new THREE.MeshStandardMaterial({
          map: useTex.map,
          normalMap: useTex.normalMap,
          normalScale: new THREE.Vector2(0.88, 0.88),
          roughness: 0.85
        });

        const bSub = new THREE.Group();
        bSub.position.set(sx, 0, 0);

        const body = new THREE.Mesh(new THREE.BoxGeometry(segLen, h, depth), wallMat);
        body.position.set(0, h / 2, -sideSign * (depth / 2));
        body.castShadow = true;
        body.receiveShadow = true;
        bSub.add(body);

        const cornice = new THREE.Mesh(new THREE.BoxGeometry(segLen + 0.16, 0.45, 0.65), trimMat);
        cornice.position.set(0, h - 0.22, sideSign * 0.12);
        bSub.add(cornice);

        const midCornice = new THREE.Mesh(new THREE.BoxGeometry(segLen + 0.10, 0.32, 0.45), trimMat);
        midCornice.position.set(0, Math.min(h - 0.6, 3.95), sideSign * 0.08);
        bSub.add(midCornice);

        // Storefront bays facing sidewalk (along Z = 0)
        for (let w = -1; w <= 1; w++) {
          const wx = w * 4.2;
          const sfMat = new THREE.MeshStandardMaterial({
            map: sfTextures[(bIdx * 3 + w + 4) % sfTextures.length],
            roughness: 0.12,
            metalness: 0.68
          });
          const sfGlass = new THREE.Mesh(new THREE.BoxGeometry(3.15, 2.65, 0.24), sfMat);
          sfGlass.position.set(wx, 1.75, sideSign * 0.02);
          bSub.add(sfGlass);

          const awningMat = new THREE.MeshStandardMaterial({ color: awningColors[(bIdx + w + 4) % 4], roughness: 0.85 });
          const awning = new THREE.Mesh(new THREE.BoxGeometry(3.25, 0.05, 1.05), awningMat);
          awning.rotation.x = sideSign * 0.34;
          awning.position.set(wx, 3.28, sideSign * 0.52);
          awning.castShadow = true;
          bSub.add(awning);
        }

        // Upper story windows
        const floors = Math.max(0, Math.floor((h - 4.6) / 3.0));
        for (let f = 0; f < floors; f++) {
          const wy = 5.3 + f * 3.0;
          for (let c = 0; c < 4; c++) {
            const wx = -segLen / 2 + 1.9 + c * 3.35;
            const win = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.72, 0.20), upperWinMat);
            win.position.set(wx, wy, sideSign * 0.01);
            bSub.add(win);

            const sill = new THREE.Mesh(new THREE.BoxGeometry(1.36, 0.14, 0.34), trimMat);
            sill.position.set(wx, wy - 0.92, sideSign * 0.06);
            bSub.add(sill);

            const frame = new THREE.Mesh(new THREE.BoxGeometry(1.26, 1.84, 0.16), darkMetalMat);
            frame.position.set(wx, wy, -sideSign * 0.01);
            bSub.add(frame);
          }
        }

        group.add(bSub);
      });

      return group;
    }

    function createCorridorFence(height = 1.6, colorHex = '#272b30', length = 72) {
      const group = new THREE.Group();
      const metalMat = new THREE.MeshStandardMaterial({
        color: parseHexRGB(colorHex, '#272b30').color,
        roughness: 0.42,
        metalness: 0.72
      });
      const curbMat = new THREE.MeshStandardMaterial({ color: 0x8a847c, roughness: 0.85 });

      const plinth = new THREE.Mesh(new THREE.BoxGeometry(length, 0.18, 0.20), curbMat);
      plinth.position.y = 0.09;
      plinth.receiveShadow = true;
      group.add(plinth);

      const railTop = new THREE.Mesh(new THREE.BoxGeometry(length, 0.04, 0.05), metalMat);
      railTop.position.y = height - 0.06;
      railTop.castShadow = true;
      group.add(railTop);

      const railBot = new THREE.Mesh(new THREE.BoxGeometry(length, 0.04, 0.05), metalMat);
      railBot.position.y = 0.26;
      group.add(railBot);

      // Major posts every 2.4m and pickets every 0.24m near center
      for (let x = -length / 2; x <= length / 2; x += 2.4) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, height, 0.08), metalMat);
        post.position.set(x, height / 2, 0);
        post.castShadow = true;
        group.add(post);
      }

      for (let x = -22; x <= 26; x += 0.22) {
        const picket = new THREE.Mesh(new THREE.BoxGeometry(0.022, height - 0.16, 0.022), metalMat);
        picket.position.set(x, height / 2 + 0.04, 0);
        picket.castShadow = true;
        group.add(picket);
      }

      return group;
    }

    function createCorridorHedge(height = 1.35, colorHex = '#2d5428', length = 72) {
      const group = new THREE.Group();
      const baseColor = parseHexRGB(colorHex, '#2d5428').color;
      const coreMat = new THREE.MeshStandardMaterial({
        color: baseColor.clone().multiplyScalar(0.75),
        roughness: 0.92
      });
      const leafMat = new THREE.MeshStandardMaterial({
        color: baseColor.clone().lerp(new THREE.Color(0xdcfce7), 0.35),
        map: leafSprigTex,
        alphaTest: 0.42,
        side: THREE.DoubleSide,
        roughness: 0.84
      });

      const borderMat = new THREE.MeshStandardMaterial({ color: 0x7c766e, roughness: 0.88 });
      const border = new THREE.Mesh(new THREE.BoxGeometry(length, 0.14, 0.82), borderMat);
      border.position.y = 0.07;
      border.receiveShadow = true;
      group.add(border);

      const core = new THREE.Mesh(new RoundedBoxGeometry(length, height - 0.1, 0.68, 3, 0.14), coreMat);
      core.position.y = height / 2 + 0.05;
      core.castShadow = true;
      core.receiveShadow = true;
      group.add(core);

      const rng = mulberry32(616);
      const cardGeo = new THREE.PlaneGeometry(0.75, 0.75);
      for (let x = -24; x <= 28; x += 0.55) {
        for (let k = 0; k < 3; k++) {
          const card = new THREE.Mesh(cardGeo, leafMat);
          card.position.set(
            x + (rng() - 0.5) * 0.3,
            0.35 + rng() * (height - 0.35),
            (rng() - 0.5) * 0.62
          );
          card.rotation.set((rng() - 0.5) * 1.2, rng() * Math.PI * 2, (rng() - 0.5) * 1.2);
          card.castShadow = true;
          group.add(card);
        }
      }

      return group;
    }

    function createCorridorWall(height = 1.8, colorHex = '#8b7d70', length = 76) {
      const group = new THREE.Group();
      const brickTex = createBrickFacadeTexture(colorHex || '#8b7d70', '#b8b0a4');
      brickTex.map.repeat.set(length / 2.5, Math.max(1, height / 1.6));
      brickTex.normalMap.repeat.copy(brickTex.map.repeat);

      const wallMat = new THREE.MeshStandardMaterial({
        map: brickTex.map,
        normalMap: brickTex.normalMap,
        roughness: 0.86
      });
      const capMat = new THREE.MeshStandardMaterial({ color: 0xa69f95, roughness: 0.78 });

      const wall = new THREE.Mesh(new THREE.BoxGeometry(length, height, 0.36), wallMat);
      wall.position.y = height / 2;
      wall.castShadow = true;
      wall.receiveShadow = true;
      group.add(wall);

      const coping = new THREE.Mesh(new THREE.BoxGeometry(length + 0.1, 0.09, 0.44), capMat);
      coping.position.y = height + 0.045;
      coping.castShadow = true;
      group.add(coping);

      return group;
    }

    function createSidewalkCanopy(height = 3.2, colorHex = '#1e293b', sideSign = 1, length = 36) {
      const group = new THREE.Group();
      const frameMat = new THREE.MeshStandardMaterial({
        color: parseHexRGB(colorHex, '#1e293b').color,
        roughness: 0.35,
        metalness: 0.78
      });
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x94a3b8,
        roughness: 0.15,
        metalness: 0.3,
        transparent: true,
        opacity: 0.62
      });

      const overhangW = 2.4;
      const zCenter = sideSign * (overhangW / 2 - 0.2);

      const roofFrame = new THREE.Mesh(new THREE.BoxGeometry(length, 0.12, overhangW), frameMat);
      roofFrame.position.set(0, height, zCenter);
      roofFrame.castShadow = true;
      group.add(roofFrame);

      const glassPanel = new THREE.Mesh(new THREE.BoxGeometry(length - 0.2, 0.04, overhangW - 0.2), glassMat);
      glassPanel.position.set(0, height + 0.05, zCenter);
      group.add(glassPanel);

      for (let x = -length / 2 + 1.5; x <= length / 2 - 1.5; x += 4.5) {
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, height, 12), frameMat);
        col.position.set(x, height / 2, sideSign * (overhangW - 0.35));
        col.castShadow = true;
        group.add(col);
      }

      return group;
    }

    // -------------------------------------------------------------------------
    // Detailed Prop Builders (10 Scene Prop Types + Scenario Obstacles)
    // -------------------------------------------------------------------------
    function createSceneProp(typeStr, seed = 0) {
      const t = (typeStr || '').toLowerCase();
      switch (t) {
        case 'bollard': return createBollardProp(0.085);
        case 'tree': return createStreetTreeWithPit(0, 400 + seed * 19, 6.0, null);
        case 'lamp_post': return createStreetLamp();
        case 'bench': return createParkBenchProp();
        case 'trash_can': return createCityTrashBin();
        case 'planter': return createPlanterProp(seed);
        case 'bike': return createBikeProp();
        case 'sign': return createStreetSignProp(seed);
        case 'fire_hydrant': return createFireHydrant();
        case 'traffic_cone': return createTrafficConeProp();
        default: return createBollardProp(0.085);
      }
    }

    function createScenarioObstacle(radius = 0.15) {
      if (radius > 0.21) {
        // Large radius -> Heavy cylindrical municipal trash bin / planter bollard scaled to exact radius
        const bin = createCityTrashBin(radius);
        return bin;
      }
      return createBollardProp(radius);
    }

    function createBollardProp(radius = 0.12) {
      const group = new THREE.Group();
      const h = Math.max(0.82, Math.min(1.05, radius * 6.2));
      const darkSteelMat = new THREE.MeshStandardMaterial({
        color: 0x22272e,
        roughness: 0.38,
        metalness: 0.72
      });
      const reflWhiteMat = new THREE.MeshStandardMaterial({
        color: 0xf8fafc,
        emissive: 0xe2e8f0,
        emissiveIntensity: 0.22,
        roughness: 0.25
      });
      const reflRedMat = new THREE.MeshStandardMaterial({
        color: 0xdc2626,
        emissive: 0x991b1b,
        emissiveIntensity: 0.20,
        roughness: 0.28
      });

      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(radius * 4.2, radius * 4.2).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ map: contactShadowTex, transparent: true, opacity: 0.75, depthWrite: false })
      );
      shadow.position.y = 0.003;
      group.add(shadow);

      // Base mounting flange
      const flange = new THREE.Mesh(new THREE.CylinderGeometry(radius * 1.22, radius * 1.32, 0.04, 20), darkSteelMat);
      flange.position.y = 0.02;
      flange.castShadow = true;
      flange.receiveShadow = true;
      group.add(flange);

      // Main cylindrical body
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h, 24), darkSteelMat);
      shaft.position.y = h / 2 + 0.02;
      shaft.castShadow = true;
      shaft.receiveShadow = true;
      group.add(shaft);

      // Reflective warning bands near top
      const band1 = new THREE.Mesh(new THREE.CylinderGeometry(radius * 1.012, radius * 1.012, 0.075, 24), reflWhiteMat);
      band1.position.y = h - 0.14;
      group.add(band1);

      const band2 = new THREE.Mesh(new THREE.CylinderGeometry(radius * 1.014, radius * 1.014, 0.045, 24), reflRedMat);
      band2.position.y = h - 0.07;
      group.add(band2);

      // Domed top cap
      const cap = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), darkSteelMat);
      cap.scale.y = 0.45;
      cap.position.y = h + 0.02;
      cap.castShadow = true;
      group.add(cap);

      return group;
    }

        seatSlat.position.set(0, 0.44, -0.14 + i * 0.10);
        seatSlat.castShadow = true;
        seatSlat.receiveShadow = true;
        group.add(seatSlat);

        const backSlat = new THREE.Mesh(new RoundedBoxGeometry(len, 0.085, 0.026, 2, 0.006), woodMat);
        backSlat.position.set(0, 0.56 + i * 0.10, -0.22 - i * 0.018);
        backSlat.rotation.x = -0.18;
        backSlat.castShadow = true;

      }

      // Cast-iron legs & armrests
      [-len * 0.42, len * 0.42].forEach(lx => {

        frontLeg.position.set(lx, 0.22, 0.16);

        group.add(frontLeg);

        const backLeg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.88, 0.06), ironMat);
        backLeg.position.set(lx, 0.44, -0.22);
        backLeg.rotation.x = -0.10;
        backLeg.castShadow = true;
        group.add(backLeg);

        const arm = new THREE.Mesh(new RoundedBoxGeometry(0.05, 0.04, 0.46, 2, 0.01), ironMat);
        arm.position.set(lx, 0.62, -0.03);
        arm.castShadow = true;
        group.add(arm);
      });

    function createStreetSignProp(seed = 0) {
      const group = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.38, metalness: 0.78 });
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 2.55, 12), postMat);
      post.position.y = 1.275;
      post.castShadow = true;
      group.add(post);

      const isWarning = (seed % 2 === 0);

    function createStreetTreeWithPit(curbHeight, seed = 100, targetHeight = 6.2, foliageHex = null) {
      const group = new THREE.Group();
      const rng = mulberry32(seed);
      const scaleFactor = THREE.MathUtils.clamp(targetHeight / 6.2, 0.6, 1.6);

      const pitW = 1.25, pitL = 1.65;
      const borderMat = new THREE.MeshStandardMaterial({ color: 0x78746e, roughness: 0.88 });
      const soilMat = new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: 0.96 });
      const grateMat = new THREE.MeshStandardMaterial({ color: 0x27292c, roughness: 0.62, metalness: 0.55 });

      const pitFrame = new THREE.Mesh(new THREE.BoxGeometry(pitW, 0.012, pitL), borderMat);
      pitFrame.position.y = 0.002;
      pitFrame.receiveShadow = true;
      group.add(pitFrame);

      const soilBed = new THREE.Mesh(new THREE.BoxGeometry(pitW - 0.12, 0.014, pitL - 0.12), soilMat);
      soilBed.position.y = 0.003;
      soilBed.receiveShadow = true;
      group.add(soilBed);

      for (let i = -1; i <= 1; i += 2) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(pitW - 0.10, 0.075, 0.018), grateMat);
        rail.position.set(0, 0.038, i * (pitL / 2 - 0.04));
        rail.castShadow = true;
        group.add(rail);
      }

      const bMap = barkTex.map.clone();
      bMap.repeat.set(2, 6);
      bMap.needsUpdate = true;
      const bNorm = barkTex.normalMap.clone();
      bNorm.repeat.set(2, 6);
      bNorm.needsUpdate = true;

      const trunkMat = new THREE.MeshStandardMaterial({
        map: bMap,
        normalMap: bNorm,
        normalScale: new THREE.Vector2(1.1, 1.1),
        roughness: 0.92
      });

      const trunkH = (3.25 + rng() * 0.35) * scaleFactor;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.115 * scaleFactor, 0.195 * scaleFactor, trunkH, 12), trunkMat);
      trunk.position.y = trunkH / 2;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);

      const baseTint = foliageHex ? parseHexRGB(foliageHex).color : null;
      const leafTints = [0xe8f2e0, 0xd8e8ce, 0xc9dec0, 0xf2f8ea];
      const leafMaterials = leafTints.map(tint => {
        const col = new THREE.Color(tint);
        if (baseTint) col.lerp(baseTint, 0.35);
        return new THREE.MeshStandardMaterial({
          color: col,
          map: leafSprigTex,
          alphaTest: 0.45,
          side: THREE.DoubleSide,
          roughness: 0.82,
          metalness: 0.02
        });
      });

      const sprigPlaneGeo = new THREE.PlaneGeometry(1.35 * scaleFactor, 1.35 * scaleFactor);
      const bCount = 5;
      for (let b = 0; b < bCount; b++) {
        const angle = (b / bCount) * Math.PI * 2 + rng() * 0.45;
        const tilt = 0.44 + rng() * 0.25;
        const bLen = (1.65 + rng() * 0.45) * scaleFactor;

        const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.038 * scaleFactor, 0.082 * scaleFactor, bLen, 8), trunkMat);
        branch.position.set(
          Math.cos(angle) * bLen * 0.32,
          trunkH - 0.25 + Math.cos(tilt) * bLen * 0.4,
          Math.sin(angle) * bLen * 0.32
        );
        branch.rotation.z = -Math.cos(angle) * tilt;
        branch.rotation.x = Math.sin(angle) * tilt;
        branch.castShadow = true;
        group.add(branch);

        for (let c = 0; c < 10; c++) {
          const distAlong = (0.55 + (c / 10) * 1.45) * scaleFactor;
          const cx = Math.cos(angle) * distAlong + (rng() - 0.5) * 0.95 * scaleFactor;
          const cy = trunkH + (0.45 + (c / 10) * 1.35 + (rng() - 0.5) * 0.75) * scaleFactor;
          const cz = Math.sin(angle) * distAlong + (rng() - 0.5) * 0.95 * scaleFactor;

          const cardMat = leafMaterials[(b + c) % leafMaterials.length];
          const card1 = new THREE.Mesh(sprigPlaneGeo, cardMat);
          const s = 0.78 + rng() * 0.55;
          card1.scale.setScalar(s);
          card1.position.set(cx, cy, cz);
          card1.rotation.set((rng() - 0.5) * 1.8, rng() * Math.PI * 2, (rng() - 0.5) * 1.8);
          card1.castShadow = true;
          card1.receiveShadow = true;
          group.add(card1);

          const card2 = new THREE.Mesh(sprigPlaneGeo, cardMat);
          card2.scale.setScalar(s * 0.95);
          card2.position.set(cx, cy, cz);
          card2.rotation.set(card1.rotation.x + 1.1, card1.rotation.y + 1.57, card1.rotation.z - 0.8);
          card2.castShadow = true;
          card2.receiveShadow = true;
          group.add(card2);
        }
      }

      for (let k = 0; k < 14; k++) {
        const ang = rng() * Math.PI * 2;
        const rad = rng() * 1.25 * scaleFactor;
        const card = new THREE.Mesh(sprigPlaneGeo, leafMaterials[k % leafMaterials.length]);
        card.scale.setScalar(0.95 + rng() * 0.45);
        card.position.set(Math.cos(ang) * rad, trunkH + (1.45 + rng() * 1.1) * scaleFactor, Math.sin(ang) * rad);
        card.rotation.set((rng() - 0.5) * 1.6, rng() * Math.PI * 2, (rng() - 0.5) * 1.6);
        card.castShadow = true;
        card.receiveShadow = true;
        group.add(card);
      }

      return group;
    }

    // Precompute pedestrian cumulative distance & heading per frame for smooth, slip-free walk cycle
    let pedTrackCache = [];

    function preparePedestrianTrack(frames) {
      pedTrackCache = [];
      if (!frames || frames.length === 0) return;

      // Find default initial movement vector by scanning ahead to when pedestrian starts moving
      let defaultDx = 0.0, defaultDy = 1.0;
      const pStart = frames[0].ped;
      if (Array.isArray(pStart)) {
        for (let i = 1; i < frames.length; i++) {
          const pi = frames[i].ped;
          if (Array.isArray(pi)) {
            const dx = pi[0] - pStart[0];
            const dy = pi[1] - pStart[1];
            const dist = Math.hypot(dx, dy);
            if (dist > 0.05) {
              defaultDx = dx / dist;
              defaultDy = dy / dist;
              break;
            }
          }
        }
      }

      let cumDist = 0;
      let curDirX = defaultDx;
      let curDirY = defaultDy;

      for (let i = 0; i < frames.length; i++) {
        const f = frames[i];
        if (!Array.isArray(f.ped)) {
          pedTrackCache.push(null);
          continue;
        }
        let speed = 0;
        if (i > 0 && Array.isArray(frames[i - 1].ped)) {
          const dt = Math.max(1e-4, f.t - frames[i - 1].t);
          const dx = f.ped[0] - frames[i - 1].ped[0];
          const dy = f.ped[1] - frames[i - 1].ped[1];
          const stepD = Math.hypot(dx, dy);
          cumDist += stepD;
          speed = stepD / dt;
          if (stepD > 1e-4) {
            curDirX = THREE.MathUtils.lerp(curDirX, dx / stepD, 0.35);
            curDirY = THREE.MathUtils.lerp(curDirY, dy / stepD, 0.35);
            const norm = Math.hypot(curDirX, curDirY) || 1;
            curDirX /= norm;
            curDirY /= norm;
          }
        }
        pedTrackCache.push({
          x: f.ped[0],
          y: f.ped[1],
          dist: cumDist,
          speed,
          dirX: curDirX,
          dirY: curDirY
        });
      }
    }

    function updatePedestrianAtTime(t) {
      const frames = trajectoryData?.frames;
      if (!frames || frames.length === 0 || !pedTrackCache.length || !pedTrackCache[0]) {
        pedestrianRoot.visible = false;
        return;
      }

      if (!pedRig) {
        const targetH = trajectoryData?.meta?.world?.pedestrian?.height ?? 1.7;
        buildPedestrianRig(targetH);
      }

      pedestrianRoot.visible = true;

      let lo = 0;
      let hi = frames.length - 1;
      if (t <= frames[0].t) {
        lo = 0; hi = 0;
      } else if (t >= frames[hi].t) {
        lo = hi;
      } else {
        while (lo + 1 < hi) {
          const mid = (lo + hi) >>> 1;
          if (frames[mid].t <= t) lo = mid;
          else hi = mid;
        }
      }

      const p0 = pedTrackCache[lo];
      const p1 = pedTrackCache[hi] || p0;
      if (!p0) {
        pedestrianRoot.visible = false;
        return;
      }

      const dt = frames[hi].t - frames[lo].t;
      const alpha = dt > 1e-6 ? THREE.MathUtils.clamp((t - frames[lo].t) / dt, 0, 1) : 0;

      const simX = THREE.MathUtils.lerp(p0.x, p1.x, alpha);
      const simY = THREE.MathUtils.lerp(p0.y, p1.y, alpha);
      const dist = THREE.MathUtils.lerp(p0.dist, p1.dist, alpha);
      const speed = THREE.MathUtils.lerp(p0.speed, p1.speed, alpha);
      const dirX = THREE.MathUtils.lerp(p0.dirX, p1.dirX, alpha);
      const dirY = THREE.MathUtils.lerp(p0.dirY, p1.dirY, alpha);

      const groundY = getGroundHeight(simX, simY);
      pedestrianRoot.position.set(simX, groundY, -simY);

      // Convert sim direction (dirX, dirY) to Three.js (dirX, -dirY); local +Z is forward
      const yawThree = Math.atan2(dirX, -dirY);
      pedestrianRoot.rotation.set(0, yawThree, 0);

      // Stride cycle phase (1 full 2-step cycle = 1.42m of travel)
      const strideBlend = THREE.MathUtils.clamp(speed / 0.65, 0, 1);
      const phase = (dist / 1.42) * Math.PI * 2;

      const s = Math.sin(phase);
      const c = Math.cos(phase);

      // Pelvis vertical bob & subtle lateral hip sway
      pedRig.pelvis.position.y = 0.92 - 0.015 * strideBlend + Math.abs(s) * 0.028 * strideBlend;
      pedRig.pelvis.position.x = c * 0.016 * strideBlend;
      pedRig.pelvis.rotation.y = -s * 0.08 * strideBlend;

      // Torso slight forward lean & counter-rotation
      pedRig.torso.rotation.x = 0.045 * strideBlend;
      pedRig.torso.rotation.y = s * 0.11 * strideBlend;
      pedRig.headGroup.rotation.y = -s * 0.06 * strideBlend;

      // Left & Right Leg Articulation (negative X rotation swings thigh forward +Z; positive X bends knee backward -Z)
      const hipSwingL = -s * 0.50 * strideBlend;
      const hipSwingR = s * 0.50 * strideBlend;

      const kneeBendL = (Math.max(0, -Math.cos(phase + 0.35)) * 0.82 + 0.07) * strideBlend;
      const kneeBendR = (Math.max(0, Math.cos(phase + 0.35)) * 0.82 + 0.07) * strideBlend;

      const anklePitchL = (Math.sin(phase - 0.5) * 0.22) * strideBlend;
      const anklePitchR = (-Math.sin(phase - 0.5) * 0.22) * strideBlend;

      pedRig.legL.hip.rotation.x = hipSwingL;
      pedRig.legL.knee.rotation.x = kneeBendL;
      pedRig.legL.ankle.rotation.x = anklePitchL;

      pedRig.legR.hip.rotation.x = hipSwingR;
      pedRig.legR.knee.rotation.x = kneeBendR;
      pedRig.legR.ankle.rotation.x = anklePitchR;

      // Counter-swinging Arms & Elbows (negative X rotation flexes arm/forearm forward +Z)
      pedRig.armL.shoulder.rotation.x = s * 0.38 * strideBlend;
      pedRig.armL.shoulder.rotation.z = 0.06;
      pedRig.armL.elbow.rotation.x = -(0.22 + Math.max(0, -s) * 0.28 * strideBlend);

      pedRig.armR.shoulder.rotation.x = -s * 0.38 * strideBlend;
      pedRig.armR.shoulder.rotation.z = -0.06;
      pedRig.armR.elbow.rotation.x = -(0.22 + Math.max(0, s) * 0.28 * strideBlend);
    }

    // -------------------------------------------------------------------------
    // Robot Builder (Exact Physics Half-Extents + Industrial Design Details)
    // -------------------------------------------------------------------------
    const robotRoot = new THREE.Group();
    scene.add(robotRoot);

    let wheelMeshes = { fl: null, fr: null, rl: null, rr: null };

    function createTireTextures() {
      const W = 256, H = 64;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1c1e22';
      ctx.fillRect(0, 0, W, H);

      const heightMap = new Float32Array(W * H);
      ctx.fillStyle = '#0f1114';
      const lugs = 28;
      const lugW = W / lugs;
      for (let i = 0; i < lugs; i++) {
        ctx.fillRect(i * lugW + 2, 4, lugW * 0.55, H * 0.40);
        ctx.fillRect(i * lugW + lugW * 0.35, H * 0.54, lugW * 0.55, H * 0.40);
      }

      const img = ctx.getImageData(0, 0, W, H);
      for (let i = 0; i < W * H; i++) {
        heightMap[i] = img.data[i * 4] / 255;
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      const normalMap = heightToNormalTexture(heightMap, W, H, 3.5);
      return { map: tex, normalMap };
    }
    const tireTreadTex = createTireTextures();

    function buildRobotModel(robotMeta) {
      while (robotRoot.children.length > 0) {

      const ch = robotMeta?.chassis_half || [0.26, 0.15, 0.06];

      const wHalfW = robotMeta?.wheel_half_width ?? 0.03;
      const wOffsets = robotMeta?.wheel_offsets || {
        fl: [0.18, 0.17, -0.07],
        fr: [0.18, -0.17, -0.07],
        rl: [-0.18, 0.17, -0.07],
        rr: [-0.18, -0.17, -0.07]
      };

      const whiteShellMat = new THREE.MeshStandardMaterial({
        color: 0xf3f5f8,
        roughness: 0.22,
        metalness: 0.05
      });
      const darkBumperMat = new THREE.MeshStandardMaterial({
        color: 0x1c2026,
        roughness: 0.68,
        metalness: 0.12
      });
      const lidMat = new THREE.MeshStandardMaterial({
