<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Sidewalk Delivery Robot — Digital Twin & Trajectory Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0e131a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f3f5f8;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 315px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(14, 18, 25, 0.80);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      font-size: 13px;
    }
    #hud.hidden {
      display: none !important;
    }
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .hud-title {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: #dce3ec;
      text-transform: uppercase;
    }
    .outcome-badge {
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .outcome-badge.fell, .outcome-badge.tipped, .outcome-badge.failed, .outcome-badge.stuck, .outcome-badge.collision {
      background: rgba(239, 68, 68, 0.26);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.55);
    }
    .outcome-badge.near_miss, .outcome-badge.warning {
      background: rgba(245, 158, 11, 0.26);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.55);
    }
    .outcome-badge.safe, .outcome-badge.success, .outcome-badge.ok, .outcome-badge.passed, .outcome-badge.crossed, .outcome-badge.climbed {
      background: rgba(34, 197, 94, 0.26);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.55);
    }
    .hud-time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #cbd5e1;
      gap: 10px;
    }
    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .play-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 6px;
      width: 28px;
      height: 26px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: background 0.15s;
    }
    .play-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    #time-slider {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
      height: 4px;
    }
    .cam-switcher {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 2px;
    }
    .cam-btn {
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .cam-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .cam-btn.active {
      background: rgba(56, 189, 248, 0.24);
      border-color: rgba(56, 189, 248, 0.65);
      color: #e0f2fe;
      font-weight: 600;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-header">
      <span class="hud-title" id="hud-title-text">Sidewalk Sim Replay</span>
      <span id="outcome-badge" class="outcome-badge fell">fell</span>
    </div>
    <div class="hud-time-row">
      <span>Time</span>
      <span id="time-readout">0.00s / 0.00s</span>
    </div>
    <div class="scrubber-row">
      <button id="play-btn" class="play-btn" title="Play / Pause">&#10074;&#10074;</button>
      <input id="time-slider" type="range" min="0" max="1" step="0.001" value="0" />
    </div>
    <div class="cam-switcher">
      <button class="cam-btn" data-cam="chase">Chase</button>
      <button class="cam-btn" data-cam="side">Side</button>
      <button class="cam-btn" data-cam="street">Street</button>
      <button class="cam-btn" data-cam="robot">Robot</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // -------------------------------------------------------------------------
    // URL Parameters & Contract State
    // -------------------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const trajParam = urlParams.get('traj');
    const sceneParam = urlParams.get('scene');
    const camParam = (urlParams.get('cam') || 'chase').toLowerCase();
    const isCapture = urlParams.get('capture') === '1';

    window.__ready = false;
    window.duration = 0;

    let activeCamMode = ['chase', 'side', 'street', 'robot'].includes(camParam) ? camParam : 'chase';
    let isPlaying = !isCapture;
    let currentTime = 0;
    let trajectoryData = null;

    // UI Elements
    const hudEl = document.getElementById('hud');
    const hudTitleEl = document.getElementById('hud-title-text');
    const outcomeBadgeEl = document.getElementById('outcome-badge');
    const timeReadoutEl = document.getElementById('time-readout');
    const timeSliderEl = document.getElementById('time-slider');
    const playBtnEl = document.getElementById('play-btn');
    const camBtns = Array.from(document.querySelectorAll('.cam-btn'));

    if (isCapture) {
      hudEl.classList.add('hidden');
    }

    function updateCamButtons() {
      camBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cam === activeCamMode);
      });
    }
    updateCamButtons();

    camBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        activeCamMode = btn.dataset.cam;
        updateCamButtons();
        window.seek(currentTime);
      });
    });

    playBtnEl.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtnEl.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';
    });

    timeSliderEl.addEventListener('input', (e) => {
      const frac = parseFloat(e.target.value) || 0;
      window.seek(frac * (window.duration || 0));
    });

    // -------------------------------------------------------------------------
    // Scene Configuration & Sensible Defaults
    // -------------------------------------------------------------------------
    function getDefaultSceneConfig() {
      return {
        ground: {
          type: 'concrete_slabs',
          color: '#b4afa6',
          secondary_color: '#8f8980',
          tile_size_m: 1.5,
          wear: 0.35,
          wet: 0.0
        },
        road: {
          present: true,
          color: '#383b40',
          lane_markings: true
        },
        curb: {
          color: '#9c968e',
          style: 'granite'
        },
        left: [
          { type: 'trees', distance_m: 1.8, height_m: 6.2, color: '#4d7c3f' },
          { type: 'building', distance_m: 4.5, height_m: 14.0, color: '#8c4c3e' }
        ],
        right: [
          { type: 'parked_cars', distance_m: 3.4, height_m: 1.5, color: '#2b3848' },
          { type: 'building', distance_m: 14.5, height_m: 15.0, color: '#9c8f7e' }
        ],
        props: [
          { type: 'fire_hydrant', x: 2.85, y: -0.95 },
          { type: 'lamp_post', x: -3.35, y: 1.15 },
          { type: 'trash_can', x: -5.2, y: 1.1 },
          { type: 'bollard', x: 5.8, y: -1.05 }
        ],
        sky: {
          type: 'clear',
          sun_elevation_deg: 40,
          sun_azimuth_deg: 52,
          exposure: 0.98
        },
        fog: {
          density: 0.0065,
          color: '#cbd6e2'
        },
        grade: {
          saturation: 1.0,
          contrast: 1.0,
          tint: '#ffffff',
          warmth: 0.0
        },
        camera: {
          hfov_deg: 110,
          distortion: 0.15,
          noise: 0.03,
          height_m: 0.10,
          pitch_deg: -8
        }
      };
    }

    let sceneConfig = getDefaultSceneConfig();
    let sceneVersion = 0;

    function mergeSceneConfig(raw) {
      const def = getDefaultSceneConfig();
      if (!raw || typeof raw !== 'object') return def;

      const gType = raw.ground?.type || def.ground.type;
      const defaultTileSize = (gType === 'concrete_slabs') ? 1.5 : (gType === 'brick' ? 0.4 : 0.6);

      return {
        ground: {
          type: gType,
          color: raw.ground?.color || def.ground.color,
          secondary_color: raw.ground?.secondary_color || def.ground.secondary_color,
          tile_size_m: Number(raw.ground?.tile_size_m ?? defaultTileSize),
          wear: THREE.MathUtils.clamp(Number(raw.ground?.wear ?? def.ground.wear), 0, 1),
          wet: THREE.MathUtils.clamp(Number(raw.ground?.wet ?? def.ground.wet), 0, 1)
        },
        road: {
          present: raw.road?.present !== undefined ? Boolean(raw.road.present) : def.road.present,
          color: raw.road?.color || def.road.color,
          lane_markings: raw.road?.lane_markings !== undefined ? Boolean(raw.road.lane_markings) : def.road.lane_markings
        },
        curb: {
          color: raw.curb?.color || def.curb.color,
          style: raw.curb?.style || def.curb.style
        },
        left: Array.isArray(raw.left) ? raw.left : def.left,
        right: Array.isArray(raw.right) ? raw.right : def.right,
        props: Array.isArray(raw.props) ? raw.props : def.props,
        sky: {
          type: raw.sky?.type || def.sky.type,
          sun_elevation_deg: Number(raw.sky?.sun_elevation_deg ?? def.sky.sun_elevation_deg),
          sun_azimuth_deg: Number(raw.sky?.sun_azimuth_deg ?? def.sky.sun_azimuth_deg),
          exposure: Number(raw.sky?.exposure ?? def.sky.exposure)
        },
        fog: {
          density: THREE.MathUtils.clamp(Number(raw.fog?.density ?? def.fog.density), 0, 0.08),
          color: raw.fog?.color || def.fog.color
        },
        grade: {
          saturation: THREE.MathUtils.clamp(Number(raw.grade?.saturation ?? def.grade.saturation), 0.3, 1.8),
          contrast: THREE.MathUtils.clamp(Number(raw.grade?.contrast ?? def.grade.contrast), 0.5, 1.6),
          tint: raw.grade?.tint || def.grade.tint,
          warmth: THREE.MathUtils.clamp(Number(raw.grade?.warmth ?? def.grade.warmth), -1, 1)
        },
        camera: {
          hfov_deg: THREE.MathUtils.clamp(Number(raw.camera?.hfov_deg ?? def.camera.hfov_deg), 45, 160),
          distortion: THREE.MathUtils.clamp(Number(raw.camera?.distortion ?? def.camera.distortion), 0, 0.45),
          noise: THREE.MathUtils.clamp(Number(raw.camera?.noise ?? def.camera.noise), 0, 0.2),
          height_m: Number(raw.camera?.height_m ?? def.camera.height_m),
          pitch_deg: Number(raw.camera?.pitch_deg ?? def.camera.pitch_deg)
        }
      };
    }

    // -------------------------------------------------------------------------
    // Deterministic PRNG & Procedural Texture Utilities
    // -------------------------------------------------------------------------
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function() {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function createNoise2D(seed = 1337, period = 64) {
      const rng = mulberry32(seed);
      const grid = new Float32Array(period * period);
      for (let i = 0; i < grid.length; i++) grid[i] = rng();

      return function(x, y) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const xf = x - xi;
        const yf = y - yi;
        const u = xf * xf * (3 - 2 * xf);
        const v = yf * yf * (3 - 2 * yf);

        const x0 = ((xi % period) + period) % period;
        const x1 = (x0 + 1) % period;
        const y0 = ((yi % period) + period) % period;
        const y1 = (y0 + 1) % period;

        const a = grid[y0 * period + x0];
        const b = grid[y0 * period + x1];
        const c = grid[y1 * period + x0];
        const d = grid[y1 * period + x1];

        return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
      };
    }

    function fbm2D(noiseFn, x, y, octaves = 4, lacunarity = 2.0, gain = 0.5) {
      let total = 0;
      let amp = 0.5;
      let freq = 1.0;
      let norm = 0;
      for (let i = 0; i < octaves; i++) {
        total += amp * noiseFn(x * freq, y * freq);
        norm += amp;
        freq *= lacunarity;
        amp *= gain;
      }
      return total / norm;
    }

    function heightToNormalTexture(heightMap, width, height, strength = 3.0, repeatX = 1, repeatY = 1) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;

      for (let y = 0; y < height; y++) {
        const ym = (y - 1 + height) % height;
        const yp = (y + 1) % height;
        for (let x = 0; x < width; x++) {
          const xm = (x - 1 + width) % width;
          const xp = (x + 1) % width;

          const hL = heightMap[y * width + xm];
          const hR = heightMap[y * width + xp];
          const hU = heightMap[ym * width + x];
          const hD = heightMap[yp * width + x];

          const dx = (hL - hR) * strength;
          const dy = (hU - hD) * strength;
          const dz = 1.0;
          const invLen = 1.0 / Math.sqrt(dx * dx + dy * dy + dz * dz);

          const idx = (y * width + x) * 4;
          data[idx]     = Math.round(((dx * invLen) * 0.5 + 0.5) * 255);
          data[idx + 1] = Math.round(((dy * invLen) * 0.5 + 0.5) * 255);
          data[idx + 2] = Math.round(((dz * invLen) * 0.5 + 0.5) * 255);
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.needsUpdate = true;
      return tex;
    }

    function parseHexRGB(hex, fallback = '#a8a298') {
      const c = new THREE.Color();
      try {
        c.set(hex || fallback);
      } catch (e) {
        c.set(fallback);
      }
      return {
        r: Math.round(c.r * 255),
        g: Math.round(c.g * 255),
        b: Math.round(c.b * 255),
        color: c
      };
    }

    function createSoftContactShadowTexture() {
      const W = 128, H = 128;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(W / 2, H / 2, 6, W / 2, H / 2, W / 2);
      grad.addColorStop(0.0, 'rgba(8, 10, 14, 0.75)');
      grad.addColorStop(0.55, 'rgba(8, 10, 14, 0.36)');
      grad.addColorStop(1.0, 'rgba(8, 10, 14, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      return new THREE.CanvasTexture(canvas);
    }

    // -------------------------------------------------------------------------
    // Three.js Renderer, Post-Process Pipeline, Scene, Sky & Lighting
    // -------------------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.98;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy() || 8;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xcbd6e2, 0.0065);

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.02, 350);

    // Offscreen RenderTarget for Robot Camera Optics + Color Grading Post-Process
    const rtWidth = Math.max(1, Math.floor(window.innerWidth * renderer.getPixelRatio()));
    const rtHeight = Math.max(1, Math.floor(window.innerHeight * renderer.getPixelRatio()));
    const renderTarget = new THREE.WebGLRenderTarget(rtWidth, rtHeight, {
      samples: 4,
      type: THREE.HalfFloatType,
      format: THREE.RGBAFormat
    });

    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const postMaterial = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: renderTarget.texture },
        uAspect: { value: window.innerWidth / window.innerHeight },
        uIsRobotCam: { value: 0.0 },
        uDistortion: { value: 0.15 },
        uNoise: { value: 0.03 },
        uTime: { value: 0.0 },
        uSaturation: { value: 1.0 },
        uContrast: { value: 1.0 },
        uWarmth: { value: 0.0 },
        uTint: { value: new THREE.Vector3(1.0, 1.0, 1.0) },
        uLinearVel: { value: new THREE.Vector3(0, 0, 0) },
        uAngularVel: { value: new THREE.Vector3(0, 0, 0) }
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        #include <common>
        uniform sampler2D tDiffuse;
        uniform float uAspect;
        uniform float uIsRobotCam;
        uniform float uDistortion;
        uniform float uNoise;
        uniform float uTime;
        uniform float uSaturation;
        uniform float uContrast;
        uniform float uWarmth;
        uniform vec3 uTint;
        uniform vec3 uLinearVel;
        uniform vec3 uAngularVel;
        varying vec2 vUv;

        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }

        // Normalized barrel distortion that preserves full frame coverage without black corners
        vec2 distortUV(vec2 uv, float k) {
          if (k <= 0.0001) return uv;
          vec2 p = uv - 0.5;
          vec2 pa = vec2(p.x * uAspect, p.y);
          float r2 = dot(pa, pa);
          float rMax2 = 0.25 * (uAspect * uAspect + 1.0);
          float rn = r2 / max(0.0001, rMax2);
          float k1 = k * 1.45;
          float k2 = k * k * 0.85;
          float scale = (1.0 + k1 * rn + k2 * rn * rn) / (1.0 + k1 + k2);
          return 0.5 + p * scale;
        }

        // Compute optical-flow motion blur vector in screen UV space from camera linear & angular velocity
        vec2 computeOpticalFlow(vec2 uv) {
          vec2 p = uv - 0.5;
          // Ground proximity factor: lower half of wide-angle robot frame is very close to pavement (z=0.10m)
          float groundProx = smoothstep(0.06, -0.48, p.y);
          // Forward motion (uLinearVel.z) creates radial expansion out from the horizon vanishing point
          vec2 vanish = vec2(0.0, 0.12);
          vec2 radial = p - vanish;
          vec2 transFlow = radial * (uLinearVel.z * (0.004 + 0.024 * groundProx));
          transFlow.x -= uLinearVel.x * (0.004 + 0.015 * groundProx);
          transFlow.y += uLinearVel.y * (0.006 + 0.015 * groundProx);

          // Angular velocity (yaw = y, pitch = x, roll = z)
          vec2 rotFlow = vec2(
            uAngularVel.y * 0.014 - uAngularVel.z * p.y * 0.018,
            -uAngularVel.x * 0.014 + uAngularVel.z * p.x * 0.018
          );

          vec2 flow = transFlow + rotFlow;
          float maxLen = 0.022;
          float len = length(flow);
          if (len > maxLen) flow *= (maxLen / len);
          return flow;
        }

        vec3 sampleWithChromaticAberration(vec2 uv, float caAmount) {
          vec2 p = uv - 0.5;
          vec2 offset = p * caAmount;
          float r = texture2D(tDiffuse, clamp(uv + offset, 0.001, 0.999)).r;
          float g = texture2D(tDiffuse, clamp(uv, 0.001, 0.999)).g;
          float b = texture2D(tDiffuse, clamp(uv - offset, 0.001, 0.999)).b;
          return vec3(r, g, b);
        }

        void main() {
          vec2 uv = vUv;
          float isRobot = uIsRobotCam;

          if (isRobot > 0.5) {
            uv = distortUV(uv, uDistortion);
          }

          vec2 centered = uv - 0.5;
          float r2 = dot(vec2(centered.x * uAspect, centered.y), vec2(centered.x * uAspect, centered.y));
          float caStrength = isRobot * (0.0018 + uDistortion * 0.014) * r2;

          vec3 col = vec3(0.0);
          if (isRobot > 0.5) {
            vec2 blurVec = computeOpticalFlow(uv);
            // 7-tap directional motion blur along instantaneous optical flow
            const int TAPS = 7;
            float weights[7];
            weights[0] = 0.08;
            weights[1] = 0.13;
            weights[2] = 0.18;
            weights[3] = 0.22;
            weights[4] = 0.18;
            weights[5] = 0.13;
            weights[6] = 0.08;
            for (int i = 0; i < TAPS; i++) {
              float t = (float(i) / float(TAPS - 1)) - 0.5;
              vec2 sampleUV = uv + blurVec * t;
              col += sampleWithChromaticAberration(sampleUV, caStrength) * weights[i];
            }
          } else {
            col = texture2D(tDiffuse, uv).rgb;
          }

          // Color Grading: Warmth, Tint, Contrast, Saturation
          if (abs(uWarmth) > 0.001) {
            col.r *= (1.0 + uWarmth * 0.10);
            col.g *= (1.0 + uWarmth * 0.02);
            col.b *= (1.0 - uWarmth * 0.11);
          }
          col *= uTint;

          // Luma-preserving saturation
          float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
          col = mix(vec3(luma), col, uSaturation);

          // Midpoint contrast curve
          col = (col - 0.42) * uContrast + 0.42;
          col = max(col, vec3(0.0));

          if (isRobot > 0.5) {
            // Wide-angle cos^4 optical vignetting
            float rMax2 = 0.25 * (uAspect * uAspect + 1.0);
            float rn = r2 / max(0.0001, rMax2);
            float vig = 1.0 - rn * (0.28 + uDistortion * 0.45);
            col *= clamp(vig, 0.38, 1.0);

            // CMOS sensor luminance + chroma grain
            if (uNoise > 0.0001) {
              vec2 seedUV = floor(vUv * vec2(1280.0, 720.0)) + vec2(uTime * 67.3, uTime * 113.1);
              float nLuma = (hash12(seedUV) - 0.5) * 2.0;
              float nR = (hash12(seedUV + 17.1) - 0.5) * 2.0;
              float nB = (hash12(seedUV + 43.7) - 0.5) * 2.0;
              // Sensor noise is slightly more visible in shadows/midtones
              float shadowWeight = mix(1.15, 0.65, clamp(luma, 0.0, 1.0));
              col += vec3(nLuma + nR * 0.35, nLuma, nLuma + nB * 0.35) * (uNoise * 0.52 * shadowWeight);
            }
          }

          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });

    const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
    postScene.add(postQuad);

    // Physically Based Sky & Lighting
    const sky = new Sky();
    sky.scale.setScalar(1000);
    scene.add(sky);

    // Overcast / Hazy dome overlay for realistic cloud diffusion when sky.type === 'overcast'
    const overcastDomeMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      transparent: true,
      depthWrite: false,
      uniforms: {
        uOpacity: { value: 0.0 },
        uZenithColor: { value: new THREE.Color(0xc8cfd6) },
        uHorizonColor: { value: new THREE.Color(0xdce2e8) }
      },
      vertexShader: /* glsl */`
        varying vec3 vWorldPos;
        void main() {
          vWorldPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uOpacity;
        uniform vec3 uZenithColor;
        uniform vec3 uHorizonColor;
        varying vec3 vWorldPos;
        void main() {
          vec3 d = normalize(vWorldPos);
          float h = clamp(d.y, 0.0, 1.0);
          // Subtle cloud layer modulation
          float cloudWave = sin(d.x * 9.0 + d.z * 7.0) * 0.025 + cos(d.x * 19.0 - d.z * 13.0) * 0.015;
          vec3 col = mix(uHorizonColor, uZenithColor, pow(h, 0.55)) + cloudWave;
          gl_FragColor = vec4(col, uOpacity);
        }
      `
    });
    const overcastDome = new THREE.Mesh(new THREE.SphereGeometry(480, 32, 16), overcastDomeMat);
    scene.add(overcastDome);

    const sunDirection = new THREE.Vector3();
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileCubemapShader();

    const sunLight = new THREE.DirectionalLight(0xfff2dc, 3.35);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 4096;
    sunLight.shadow.mapSize.height = 4096;
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 90;
    const dShadow = 11.5;
    sunLight.shadow.camera.left = -dShadow;
    sunLight.shadow.camera.right = dShadow;
    sunLight.shadow.camera.top = dShadow;
    sunLight.shadow.camera.bottom = -dShadow;
    sunLight.shadow.bias = -0.0002;
    sunLight.shadow.normalBias = 0.008;
    scene.add(sunLight);

    const hemiLight = new THREE.HemisphereLight(0xaecaf0, 0x766c60, 0.82);
    scene.add(hemiLight);

    function applySkyAndAtmosphere(cfg) {
      const skyCfg = cfg.sky;
      const fogCfg = cfg.fog;

      const elev = THREE.MathUtils.clamp(skyCfg.sun_elevation_deg, 3, 88);
      const azim = skyCfg.sun_azimuth_deg;
      const phi = THREE.MathUtils.degToRad(90 - elev);
      const theta = THREE.MathUtils.degToRad(azim);
      sunDirection.setFromSphericalCoords(1, phi, theta);

      const skyUniforms = sky.material.uniforms;
      skyUniforms['sunPosition'].value.copy(sunDirection);

      if (skyCfg.type === 'overcast') {
        skyUniforms['turbidity'].value = 18.0;
        skyUniforms['rayleigh'].value = 0.55;
        skyUniforms['mieCoefficient'].value = 0.032;
        skyUniforms['mieDirectionalG'].value = 0.65;
        overcastDomeMat.uniforms.uOpacity.value = 0.88;
        sunLight.intensity = 1.05;
        sunLight.color.setHex(0xeef2f6);
        sunLight.shadow.normalBias = 0.014;
        hemiLight.color.setHex(0xd8e0e8);
        hemiLight.groundColor.setHex(0x6e6a64);
        hemiLight.intensity = 2.05;
      } else if (skyCfg.type === 'hazy') {
        skyUniforms['turbidity'].value = 10.5;
        skyUniforms['rayleigh'].value = 1.15;
        skyUniforms['mieCoefficient'].value = 0.018;
        skyUniforms['mieDirectionalG'].value = 0.86;
        overcastDomeMat.uniforms.uOpacity.value = 0.24;
        overcastDomeMat.uniforms.uHorizonColor.value.setHex(0xe8dfd2);
        overcastDomeMat.uniforms.uZenithColor.value.setHex(0xbfd0e0);
        sunLight.intensity = 2.55;
        sunLight.color.setHex(0xffe8c2);
        hemiLight.color.setHex(0xc8d8eb);
        hemiLight.groundColor.setHex(0x7c7266);
        hemiLight.intensity = 1.25;
      } else {
        skyUniforms['turbidity'].value = 3.4;
        skyUniforms['rayleigh'].value = 1.55;
        skyUniforms['mieCoefficient'].value = 0.004;
        skyUniforms['mieDirectionalG'].value = 0.82;
        overcastDomeMat.uniforms.uOpacity.value = 0.0;
        sunLight.intensity = 3.35;
        // Warmer sunlight at lower sun elevations
        const warmFactor = THREE.MathUtils.clamp((45 - elev) / 35, 0, 1);
        sunLight.color.setHex(0xfff2dc).lerp(new THREE.Color(0xffcfa0), warmFactor * 0.6);
        hemiLight.color.setHex(0xaecaf0);
        hemiLight.groundColor.setHex(0x766c60);
        hemiLight.intensity = 0.82;
      }

      sunLight.position.copy(sunDirection).multiplyScalar(38);
      renderer.toneMappingExposure = skyCfg.exposure ?? 0.98;

      const fogCol = parseHexRGB(fogCfg.color, '#cbd6e2').color;
      scene.fog = new THREE.FogExp2(fogCol, fogCfg.density);

      // Update environment map
      const envScene = new THREE.Scene();
      const envSky = new Sky();
      envSky.scale.setScalar(100);
      envSky.material.uniforms['turbidity'].value = skyUniforms['turbidity'].value;
      envSky.material.uniforms['rayleigh'].value = skyUniforms['rayleigh'].value;
      envSky.material.uniforms['mieCoefficient'].value = skyUniforms['mieCoefficient'].value;
      envSky.material.uniforms['mieDirectionalG'].value = skyUniforms['mieDirectionalG'].value;
      envSky.material.uniforms['sunPosition'].value.copy(sunDirection);
      envScene.add(envSky);

      const gCol = parseHexRGB(cfg.ground.color, '#7a746c').color.clone().multiplyScalar(0.5);
      const envGround = new THREE.Mesh(
        new THREE.SphereGeometry(40, 16, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: gCol, side: THREE.BackSide })
      );
      envScene.add(envGround);
      if (scene.environment) scene.environment.dispose();
      scene.environment = pmremGenerator.fromScene(envScene, 0.03).texture;
      scene.environmentIntensity = skyCfg.type === 'overcast' ? 0.85 : 0.72;

      // Update Post-Processing Color Grade Uniforms
      const tintCol = parseHexRGB(cfg.grade.tint, '#ffffff').color;
      postMaterial.uniforms.uSaturation.value = cfg.grade.saturation;
      postMaterial.uniforms.uContrast.value = cfg.grade.contrast;
      postMaterial.uniforms.uWarmth.value = cfg.grade.warmth;
      postMaterial.uniforms.uTint.value.set(tintCol.r, tintCol.g, tintCol.b);
      postMaterial.uniforms.uDistortion.value = cfg.camera.distortion;
      postMaterial.uniforms.uNoise.value = cfg.camera.noise;
    }

    // -------------------------------------------------------------------------
    // Procedural Ground, Curb, Road & Prop Textures
    // -------------------------------------------------------------------------
    function createGroundTextures(groundCfg) {
      const W = 512, H = 512;
      const diffCanvas = document.createElement('canvas');
      diffCanvas.width = W; diffCanvas.height = H;
      const diffCtx = diffCanvas.getContext('2d');
      const diffImg = diffCtx.createImageData(W, H);

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = W; roughCanvas.height = H;
      const roughCtx = roughCanvas.getContext('2d');
      const roughImg = roughCtx.createImageData(W, H);

      const heightMap = new Float32Array(W * H);
      const n1 = createNoise2D(101, 64);
      const n2 = createNoise2D(202, 128);
      const n3 = createNoise2D(309, 64);
      const rng = mulberry32(303);

      const c1 = parseHexRGB(groundCfg.color, '#b4afa6');
      const c2 = parseHexRGB(groundCfg.secondary_color, '#8f8980');
      const wear = groundCfg.wear ?? 0.35;
      const wet = groundCfg.wet ?? 0.0;
      const gType = groundCfg.type || 'concrete_slabs';

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const u = x / W;
          const v = y / H;

          const macro = fbm2D(n1, u * 5, v * 5, 4);
          const mid = fbm2D(n2, u * 22, v * 22, 3);
          const fine = (rng() - 0.5) * 0.11;
          const puddleNoise = fbm2D(n3, u * 3.5 + 4.1, v * 3.5 + 1.9, 3);
          const stainNoise = fbm2D(n1, u * 4.2 + 1.7, v * 4.2 + 2.3, 4);
          const stain = (stainNoise > (0.62 - wear * 0.22)) ? (stainNoise - (0.62 - wear * 0.22)) * (0.6 + wear * 1.1) : 0.0;

          let r = c1.r, g = c1.g, b = c1.b;
          let hVal = 0.5;
          let roughBase = 222;

          if (gType === 'square_pavers' || gType === 'checker_pavers') {
            const cells = 4;
            const cellW = W / cells;
            const cellH = H / cells;
            const cx = Math.floor(x / cellW);
            const cy = Math.floor(y / cellH);
            const lx = x % cellW;
            const ly = y % cellH;
            const wobble = (mid - 0.5) * 1.4;
            const jDist = Math.min(Math.min(lx, cellW - lx), Math.min(ly, cellH - ly)) + wobble;

            const isChecker = gType === 'checker_pavers' && ((cx + cy) % 2 === 1);
            const baseC = isChecker ? c2 : c1;
            const tileHash = ((cx * 73 + cy * 37) % 9 - 4) * 3.2;

            let jointFactor = 1.0;
            let jointDepth = 0.0;
            if (jDist < 3.2) {
              const t = Math.max(0, jDist / 3.2);
              jointFactor = 0.36 + 0.64 * (t * t);
              jointDepth = -0.42 * (1.0 - t);
            } else if (jDist < 7.0) {
              const t = (jDist - 3.2) / 3.8;
              jointFactor = 0.92 + 0.08 * t;
              jointDepth = -0.06 * (1.0 - t);
            }

            const delta = tileHash + (macro - 0.5) * 22 + (mid - 0.5) * 18 + fine * 32 - stain * 65;
            r = (baseC.r + delta) * jointFactor;
            g = (baseC.g + delta) * jointFactor;
            b = (baseC.b + delta) * jointFactor;
            hVal = 0.52 + (mid - 0.5) * 0.24 + fine * 0.30 + jointDepth;
            roughBase = 212 - stain * 35;
          } else if (gType === 'brick') {
            const rows = 8;
            const cols = 4;
            const bH = H / rows;
            const bW = W / cols;
            const row = Math.floor(y / bH);
            const xShift = (x + (row % 2) * (bW * 0.5)) % W;
            const col = Math.floor(xShift / bW);
            const lx = xShift % bW;
            const ly = y % bH;
            const wobble = (mid - 0.5) * 1.6;
            const jDist = Math.min(Math.min(lx, bW - lx), Math.min(ly, bH - ly)) + wobble;

            const brickMix = ((row * 31 + col * 17) % 10) / 10;
            const br = THREE.MathUtils.lerp(c1.r, c2.r, brickMix * 0.55);
            const bg = THREE.MathUtils.lerp(c1.g, c2.g, brickMix * 0.55);
            const bb = THREE.MathUtils.lerp(c1.b, c2.b, brickMix * 0.55);

            if (jDist < 3.4) {
              // Sandy recessed mortar
              const mNoise = (fine + (mid - 0.5) * 0.2) * 35;
              r = 148 + mNoise;
              g = 142 + mNoise;
              b = 132 + mNoise;
              hVal = 0.16 + fine * 0.15;
              roughBase = 242;
            } else {
              const delta = (macro - 0.5) * 26 + (mid - 0.5) * 22 + fine * 36 - stain * 58;
              r = br + delta;
              g = bg + delta;
              b = bb + delta;
              hVal = 0.58 + (mid - 0.5) * 0.28 + fine * 0.35;
              roughBase = 216 - stain * 30;
            }
          } else if (gType === 'asphalt') {
            const rVal = rng();
            const aggregate = rVal > 0.74 ? (rVal - 0.74) * 2.4 : (rVal < 0.20 ? -0.25 : 0.0);
            const delta = (macro - 0.5) * 22 + (mid - 0.5) * 16 + aggregate * 38 - stain * 42;
            r = c1.r * 0.55 + delta;
            g = c1.g * 0.55 + delta;
            b = c1.b * 0.56 + delta;
            hVal = 0.5 + (mid - 0.5) * 0.28 + (rVal - 0.5) * 0.58;
            roughBase = 218 - stain * 40;
          } else if (gType === 'gravel') {
            const pebble = fbm2D(n2, u * 48, v * 48, 3);
            const spark = (rng() - 0.5) * 0.35;
            const mixT = clamp01(pebble * 1.2 + spark * 0.4);
            const delta = (macro - 0.5) * 28 + spark * 48 - stain * 40;
            r = THREE.MathUtils.lerp(c1.r, c2.r, mixT) + delta;
            g = THREE.MathUtils.lerp(c1.g, c2.g, mixT) + delta;
            b = THREE.MathUtils.lerp(c1.b, c2.b, mixT) + delta;
            hVal = 0.5 + (pebble - 0.5) * 0.65 + spark * 0.45;
            roughBase = 238;
          } else if (gType === 'grass') {
            const blade = fbm2D(n2, u * 36, v * 64, 3);
            const soilPatch = wear * Math.max(0, (macro - 0.52) * 2.2);
            const gR = THREE.MathUtils.lerp(62, 112, soilPatch);
            const gG = THREE.MathUtils.lerp(106, 92, soilPatch);
            const gB = THREE.MathUtils.lerp(44, 66, soilPatch);
            const delta = (blade - 0.5) * 34 + fine * 38;
            r = gR + delta;
            g = gG + delta;
            b = gB + delta * 0.6;
            hVal = 0.5 + (blade - 0.5) * 0.55 + fine * 0.4;
            roughBase = 232;
          } else {
            // Default: concrete_slabs (2x2 slabs per tile)
            const slabW = W / 2;
            const slabH = H / 2;
            const broom = Math.sin(x * 1.9 + mid * 2.5) * 0.015;
            const jWobble = (mid - 0.5) * 0.9;
            const distX = Math.min(x % slabW, slabW - (x % slabW)) + jWobble;
            const distY = Math.min(y % slabH, slabH - (y % slabH)) + jWobble;
            const jointDist = Math.min(distX, distY);

            let jointFactor = 1.0;
            let jointDepth = 0.0;
            if (jointDist < 2.3) {
              const t = Math.max(0, jointDist / 2.3);
              jointFactor = 0.32 + 0.68 * (t * t);
              jointDepth = -0.40 * (1.0 - t);
            } else if (jointDist < 5.6) {
              const t = (jointDist - 2.3) / 3.3;
              jointFactor = 0.94 + 0.06 * t;
              jointDepth = -0.04 * (1.0 - t);
            }

            const slabId = Math.floor(x / slabW) + Math.floor(y / slabH) * 2;
            const slabTint = ((slabId * 37) % 5 - 2) * 3.8;
            const delta = slabTint + (macro - 0.5) * 26 + (mid - 0.5) * 18 + fine * 34 - stain * 64;

            r = (c1.r + delta) * jointFactor;
            g = (c1.g + delta) * jointFactor;
            b = (c1.b + delta) * jointFactor;
            hVal = 0.5 + (mid - 0.5) * 0.22 + fine * 0.34 + broom + jointDepth;
            roughBase = 220 + (0.5 - mid) * 28 - stain * 35;
          }

          // Wetness & Puddle physics
          if (wet > 0.001) {
            const dampDarken = 1.0 - wet * 0.24;
            r *= dampDarken;
            g *= dampDarken;
            b *= dampDarken;

            const puddleThresh = 0.68 - wet * 0.38;
            if (puddleNoise > puddleThresh) {
              const pMask = Math.min(1.0, (puddleNoise - puddleThresh) / 0.12);
              r *= (1.0 - pMask * 0.14);
              g *= (1.0 - pMask * 0.12);
              b *= (1.0 - pMask * 0.08);
              // Flatten normal inside puddle & drop roughness for mirror-like wet reflections
              hVal = THREE.MathUtils.lerp(hVal, 0.5, pMask * 0.92);
              roughBase = THREE.MathUtils.lerp(roughBase * (1.0 - wet * 0.45), 18, pMask);
            } else {
              roughBase *= (1.0 - wet * 0.42);
            }
          }

          const idx = (y * W + x) * 4;
          diffImg.data[idx]     = Math.max(18, Math.min(242, Math.round(r)));
          diffImg.data[idx + 1] = Math.max(18, Math.min(242, Math.round(g)));
          diffImg.data[idx + 2] = Math.max(18, Math.min(242, Math.round(b)));
          diffImg.data[idx + 3] = 255;

          heightMap[y * W + x] = Math.max(0, Math.min(1, hVal));

          const rByte = Math.max(12, Math.min(252, Math.round(roughBase)));
          roughImg.data[idx]     = rByte;
          roughImg.data[idx + 1] = rByte;
          roughImg.data[idx + 2] = rByte;
          roughImg.data[idx + 3] = 255;
        }
      }

      diffCtx.putImageData(diffImg, 0, 0);

      // Hairline cracks & chewing-gum/tar specks scaled by wear
      const crackCount = Math.round(wear * 9);
      if (crackCount > 0 && gType !== 'grass' && gType !== 'gravel') {
        diffCtx.strokeStyle = `rgba(42, 39, 36, ${0.32 + wear * 0.32})`;
        diffCtx.lineWidth = 1.1;
        const crackRng = mulberry32(909);
        for (let c = 0; c < crackCount; c++) {
          let cx = crackRng() * W;
          let cy = crackRng() * H;
          diffCtx.beginPath();
          diffCtx.moveTo(cx, cy);
          for (let s = 0; s < 15; s++) {
            cx += (crackRng() - 0.4) * 8;
            cy += crackRng() * 6.5;
            diffCtx.lineTo(cx, cy);
          }
          diffCtx.stroke();
        }

        const speckCount = Math.round(12 + wear * 28);
        for (let g = 0; g < speckCount; g++) {
          const gx = crackRng() * W;
          const gy = crackRng() * H;
          const gr = 1.0 + crackRng() * 2.5;
          diffCtx.fillStyle = `rgba(38, 35, 32, ${0.22 + crackRng() * 0.28})`;
          diffCtx.beginPath();
          diffCtx.arc(gx, gy, gr, 0, Math.PI * 2);
          diffCtx.fill();
        }
      }

      roughCtx.putImageData(roughImg, 0, 0);

      const map = new THREE.CanvasTexture(diffCanvas);
      map.wrapS = THREE.RepeatWrapping;
      map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = maxAnisotropy;

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = THREE.RepeatWrapping;
      roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.anisotropy = maxAnisotropy;

      const normalStrength = gType === 'gravel' ? 5.2 : (gType === 'asphalt' ? 4.4 : 3.5);
      const normalMap = heightToNormalTexture(heightMap, W, H, normalStrength);
      normalMap.anisotropy = maxAnisotropy;

      return { map, roughnessMap, normalMap };
    }

    function clamp01(v) {
      return Math.max(0, Math.min(1, v));
    }

    function createCurbTextures(curbCfg) {
      const W = 512, H = 256;
      const diffCanvas = document.createElement('canvas');
      diffCanvas.width = W; diffCanvas.height = H;
      const diffCtx = diffCanvas.getContext('2d');
      const diffImg = diffCtx.createImageData(W, H);
      const heightMap = new Float32Array(W * H);

      const n1 = createNoise2D(404, 64);
      const rng = mulberry32(505);

      const style = curbCfg?.style || 'granite';
      let defaultHex = '#9c968e';
      if (style === 'painted_red') defaultHex = '#b91c1c';
      else if (style === 'painted_yellow') defaultHex = '#eab308';
      else if (style === 'concrete') defaultHex = '#aba59c';

      const baseCol = parseHexRGB(curbCfg?.color || defaultHex, defaultHex);
      const isPainted = style === 'painted_red' || style === 'painted_yellow';

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const u = x / W;
          const v = y / H;

          const grain = fbm2D(n1, u * 18, v * 9, 4);
          const crystal = (rng() - 0.5) * (style === 'granite' ? 0.25 : 0.12);

          const jDist = Math.min(x % 256, 256 - (x % 256));
          const joint = jDist < 2.2 ? 0.38 : 1.0;

          const baseGrime = Math.pow(Math.max(0, (v - 0.58) / 0.42), 1.45) * 48;
          const scuffNoise = fbm2D(n1, u * 7 + 3.1, v * 4, 3);
          const tireScuff = (v > 0.18 && v < 0.82 && scuffNoise > 0.63) ? (scuffNoise - 0.63) * 145 : 0;

          let r = baseCol.r;
          let g = baseCol.g;
          let b = baseCol.b;

          // Paint chipping along curb bullnose exposing raw grey concrete underneath
          if (isPainted && (scuffNoise > 0.58 || (v > 0.42 && v < 0.58 && grain > 0.56))) {
            r = 142; g = 138; b = 132;
          }

          const delta = (grain - 0.5) * 30 + crystal * 42 - baseGrime - tireScuff;
          const idx = (y * W + x) * 4;
          diffImg.data[idx]     = Math.max(24, Math.min(235, Math.round((r + delta) * joint)));
          diffImg.data[idx + 1] = Math.max(24, Math.min(235, Math.round((g + delta) * joint)));
          diffImg.data[idx + 2] = Math.max(24, Math.min(235, Math.round((b + delta) * joint)));
          diffImg.data[idx + 3] = 255;

          heightMap[y * W + x] = Math.max(0, Math.min(1, 0.5 + (grain - 0.5) * 0.30 + crystal * 0.40 - (jDist < 2.2 ? 0.35 : 0)));
        }
      }
      diffCtx.putImageData(diffImg, 0, 0);

      const map = new THREE.CanvasTexture(diffCanvas);
      map.wrapS = THREE.RepeatWrapping;
      map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = maxAnisotropy;

      const normalMap = heightToNormalTexture(heightMap, W, H, 4.2);
      normalMap.anisotropy = maxAnisotropy;

      return { map, normalMap };
    }

    function createAsphaltTextures(roadColorHex = '#383b40', wet = 0.0) {
      const W = 512, H = 512;
      const diffCanvas = document.createElement('canvas');
      diffCanvas.width = W; diffCanvas.height = H;
      const diffCtx = diffCanvas.getContext('2d');
      const diffImg = diffCtx.createImageData(W, H);

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = W; roughCanvas.height = H;
      const roughCtx = roughCanvas.getContext('2d');
      const roughImg = roughCtx.createImageData(W, H);

      const heightMap = new Float32Array(W * H);
      const n1 = createNoise2D(606, 64);
      const n2 = createNoise2D(707, 128);
      const rng = mulberry32(808);
      const baseC = parseHexRGB(roadColorHex, '#383b40');

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const u = x / W;
          const v = y / H;

          const macro = fbm2D(n1, u * 4, v * 4, 4);
          const patch = fbm2D(n2, u * 14, v * 14, 3);
          const rVal = rng();
          const aggregate = rVal > 0.78 ? (rVal - 0.78) * 2.2 : (rVal < 0.18 ? -0.24 : 0.0);
          const repairMask = macro > 0.62 ? (macro - 0.62) * 32 : 0;

          const delta = (macro - 0.5) * 20 + (patch - 0.5) * 14 + aggregate * 35 - repairMask;
          const wetMul = 1.0 - wet * 0.25;

          const idx = (y * W + x) * 4;
          diffImg.data[idx]     = Math.max(18, Math.min(165, Math.round((baseC.r + delta) * wetMul)));
          diffImg.data[idx + 1] = Math.max(18, Math.min(165, Math.round((baseC.g + delta) * wetMul)));
          diffImg.data[idx + 2] = Math.max(18, Math.min(165, Math.round((baseC.b + delta) * wetMul)));
          diffImg.data[idx + 3] = 255;

          const hVal = Math.max(0, Math.min(1, 0.5 + (patch - 0.5) * 0.25 + (rVal - 0.5) * 0.54));
          heightMap[y * W + x] = hVal;

          let rough = 218 - (macro - 0.5) * 44 - aggregate * 22 - repairMask * 1.2;
          if (wet > 0.01) {
            rough *= (1.0 - wet * 0.55);
            if (macro > 0.66 - wet * 0.25) rough = 24;
          }
          const rByte = Math.max(20, Math.min(252, Math.round(rough)));
          roughImg.data[idx]     = rByte;
          roughImg.data[idx + 1] = rByte;
          roughImg.data[idx + 2] = rByte;
          roughImg.data[idx + 3] = 255;
        }
      }
      diffCtx.putImageData(diffImg, 0, 0);

      diffCtx.strokeStyle = 'rgba(22, 23, 26, 0.74)';
      diffCtx.lineWidth = 1.8;
      const cRng = mulberry32(1112);
      for (let i = 0; i < 4; i++) {
        let cx = cRng() * W;
        let cy = 0;
        diffCtx.beginPath();
        diffCtx.moveTo(cx, cy);
        while (cy < H) {
          cx += (cRng() - 0.5) * 15;
          cy += 12 + cRng() * 16;
          diffCtx.lineTo(cx, cy);
        }
        diffCtx.stroke();
      }

      roughCtx.putImageData(roughImg, 0, 0);

      const map = new THREE.CanvasTexture(diffCanvas);
      map.wrapS = THREE.RepeatWrapping;
      map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = maxAnisotropy;

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = THREE.RepeatWrapping;
      roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.anisotropy = maxAnisotropy;

      const normalMap = heightToNormalTexture(heightMap, W, H, 4.8);
      normalMap.anisotropy = maxAnisotropy;

      return { map, roughnessMap, normalMap };
    }

    function createRoadPaintTexture(baseColor = '#e8eaed') {
      const W = 256, H = 256;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, W, H);

      const n1 = createNoise2D(919, 32);
      const rng = mulberry32(929);
      const img = ctx.getImageData(0, 0, W, H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const wear = fbm2D(n1, (x / W) * 10, (y / H) * 10, 3);
          const grit = rng();
          const idx = (y * W + x) * 4;
          if (wear > 0.64 || grit < 0.08) {
            const darken = 0.62 + 0.28 * grit;
            img.data[idx] *= darken;
            img.data[idx + 1] *= darken;
            img.data[idx + 2] *= darken;
          }
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;

    function createStormDrainGrateTexture() {
      const W = 256, H = 256;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#322c28';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#433b35';
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, W - 14, H - 14);

      const cols = 4;
      const rows = 6;
      const padX = 24, padY = 22;
      const slotW = (W - padX * 2 - (cols - 1) * 14) / cols;
      const slotH = (H - padY * 2 - (rows - 1) * 12) / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const sx = padX + c * (slotW + 14);
          const sy = padY + r * (slotH + 12);
          ctx.fillStyle = '#090a0c';
          ctx.beginPath();
          ctx.roundRect(sx, sy, slotW, slotH, 4);
          ctx.fill();
          ctx.strokeStyle = '#4c413a';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBarkTextures() {
      const W = 256, H = 256;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(W, H);
      const heightMap = new Float32Array(W * H);
      const n1 = createNoise2D(555, 32);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const u = x / W;
          const v = y / H;
          const ridge = fbm2D(n1, u * 18, v * 4, 4);
          const detail = fbm2D(n1, u * 36, v * 12, 2);
          const h = ridge * 0.75 + detail * 0.25;
          heightMap[y * W + x] = h;

          const idx = (y * W + x) * 4;
          const base = 50 + h * 54;
          img.data[idx] = base + 12;
          img.data[idx + 1] = base + 3;
          img.data[idx + 2] = base - 7;
          img.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const map = new THREE.CanvasTexture(canvas);
      map.wrapS = THREE.RepeatWrapping;
      map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      const normalMap = heightToNormalTexture(heightMap, W, H, 5.2);
      return { map, normalMap };
    }

    function createLeafSprigTexture() {
      const W = 256, H = 256;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const rng = mulberry32(771);
      ctx.strokeStyle = '#3b2f24';
      ctx.lineWidth = 3;
      for (let b = 0; b < 6; b++) {
        const ang = (b / 6) * Math.PI * 2 + 0.2;
        ctx.beginPath();
        ctx.moveTo(W / 2, H / 2);
        ctx.lineTo(W / 2 + Math.cos(ang) * 95, H / 2 + Math.sin(ang) * 95);
        ctx.stroke();
      }

      for (let i = 0; i < 95; i++) {
        const angle = rng() * Math.PI * 2;
        const dist = Math.pow(rng(), 0.62) * 102;
        const lx = W / 2 + Math.cos(angle) * dist;
        const ly = H / 2 + Math.sin(angle) * dist;
        const lRot = angle + (rng() - 0.5) * 1.4;
        const lLen = 16 + rng() * 14;
        const lWid = 9 + rng() * 7;

        const r = Math.round(42 + rng() * 38);
        const g = Math.round(78 + rng() * 52);
        const b = Math.round(28 + rng() * 26);

        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(lRot);
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, lLen, lWid, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = `rgba(${r + 25}, ${g + 28}, ${b + 15}, 0.55)`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-lLen * 0.75, 0);
        ctx.lineTo(lLen * 0.75, 0);
        ctx.stroke();
        ctx.restore();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createStorefrontGlassTexture(styleIdx = 0) {
      const W = 512, H = 384;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      const themes = [
        { top: '#141c24', mid: '#26201b', bot: '#181412', glow: 'rgba(255, 214, 155, 0.42)', sign: 'ARTISAN BAKERY & CAFE' },
        { top: '#121a24', mid: '#1a2430', bot: '#13171d', glow: 'rgba(220, 238, 255, 0.32)', sign: 'MERCER BOOKS & DESIGN' },
        { top: '#181c20', mid: '#25292e', bot: '#15171a', glow: 'rgba(255, 228, 175, 0.36)', sign: 'APOTHECARY & GOODS' },
        { top: '#171518', mid: '#2b2220', bot: '#191413', glow: 'rgba(255, 200, 140, 0.38)', sign: 'ESPRESSO ROASTERS' }
      ];
      const th = themes[styleIdx % themes.length];

      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0.0, th.top);
      grad.addColorStop(0.55, th.mid);
      grad.addColorStop(1.0, th.bot);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      const washGrad = ctx.createLinearGradient(0, H * 0.22, 0, H * 0.78);
      washGrad.addColorStop(0.0, th.glow);
      washGrad.addColorStop(1.0, 'rgba(0,0,0,0)');
      ctx.fillStyle = washGrad;
      ctx.fillRect(28, H * 0.25, W - 56, H * 0.55);

      ctx.fillStyle = 'rgba(18, 20, 24, 0.75)';
      if (styleIdx % 2 === 0) {
        ctx.fillRect(45, H * 0.62, W - 90, H * 0.35);
        ctx.fillStyle = 'rgba(55, 42, 32, 0.65)';
        ctx.fillRect(70, H * 0.34, 120, 75);
        ctx.fillRect(310, H * 0.36, 130, 85);
      } else {
        for (let b = 0; b < 4; b++) {
          ctx.fillRect(36 + b * 115, H * 0.35, 85, H * 0.55);
        }
      }

      const reflGrad = ctx.createLinearGradient(0, 0, W, H);
      reflGrad.addColorStop(0.0, 'rgba(175, 208, 242, 0.22)');
      reflGrad.addColorStop(0.45, 'rgba(175, 208, 242, 0.06)');
      reflGrad.addColorStop(0.65, 'rgba(255, 255, 255, 0.12)');
      reflGrad.addColorStop(1.0, 'rgba(140, 170, 200, 0.04)');
      ctx.fillStyle = reflGrad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(235, 228, 212, 0.68)';
      ctx.font = '600 18px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(th.sign, W / 2, H * 0.15);

      ctx.strokeStyle = '#1e2228';
      ctx.lineWidth = 12;
      ctx.strokeRect(6, 6, W - 12, H - 12);
      ctx.beginPath();
      ctx.moveTo(0, H * 0.24);
      ctx.lineTo(W, H * 0.24);
      ctx.stroke();

      ctx.lineWidth = 9;
      for (let m = 1; m <= 2; m++) {
        ctx.beginPath();
        ctx.moveTo((W / 3) * m, H * 0.24);
        ctx.lineTo((W / 3) * m, H);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAnisotropy;
      return tex;
    }

    function createUpperWindowTexture(seed = 20) {
      const W = 256, H = 384;
