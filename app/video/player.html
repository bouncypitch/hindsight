<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Video</title>
<style>
  :root { --ink:#f5f5f7; --mute:#86868b; --accent:#2997ff; --bad:#ff453a; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1920px; height:1080px; background:#000; color:var(--ink); overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif; -webkit-font-smoothing:antialiased; }
  .scene { position:absolute; inset:0; padding:90px 120px; display:flex; flex-direction:column; opacity:0; transition:opacity .7s ease; }
  .scene.on { opacity:1; }
  .kicker { color:var(--accent); font-size:30px; font-weight:600; letter-spacing:.02em; transform:translateY(16px); opacity:0; transition:all .8s ease .15s; }
  .headline { font-size:76px; font-weight:700; letter-spacing:-.03em; line-height:1.04; margin:12px 0 0; max-width:1500px; transform:translateY(20px); opacity:0; transition:all .9s ease .3s; }
  .sub { color:var(--mute); font-size:34px; margin-top:14px; opacity:0; transition:opacity .9s ease .6s; }
  .on .kicker, .on .headline { transform:none; opacity:1; } .on .sub { opacity:1; }
  .media { flex:1; display:grid; gap:18px; margin-top:44px; min-height:0; opacity:0; transform:scale(.985); transition:all 1s ease .55s; }
  .on .media { opacity:1; transform:none; }
  .media video { width:100%; height:100%; object-fit:cover; border-radius:22px; background:#111; }
  .m1 { grid-template-columns:1fr; } .m2 { grid-template-columns:1fr 1fr; } .m4 { grid-template-columns:1fr 1fr 1fr 1fr; }
  .caps { display:grid; grid-template-columns:1fr 1fr 1fr; color:var(--mute); font-size:26px; text-align:center; margin-top:14px; }
  .stat { color:var(--mute); font-size:32px; margin-top:22px; }
  .quote { font-size:40px; line-height:1.3; color:var(--ink); max-width:1500px; margin-top:34px; border-left:4px solid var(--bad); padding-left:28px; opacity:0; transition:opacity 1s ease 1.2s; }
  .on .quote { opacity:1; }
  .quote .who { display:block; font-size:22px; color:var(--bad); font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin-bottom:10px; }
  .big { font-size:230px; font-weight:800; letter-spacing:-.05em; line-height:1; margin-top:80px; background:linear-gradient(90deg, #2997ff, #30d158); -webkit-background-clip:text; color:transparent; opacity:0; transition:opacity 1.2s ease .5s; }
  .on .big { opacity:1; }
  .bigcap { font-size:44px; color:var(--mute); margin-top:12px; }
  ul.list { list-style:none; padding:0; margin-top:56px; }
  ul.list li { font-size:42px; line-height:1.25; margin:0 0 26px; opacity:0; transform:translateX(-16px); transition:all .7s ease; }
  .on ul.list li { opacity:1; transform:none; }
  .with-quote .media { flex:0 0 560px; }
  .fit .media video { object-fit:contain; background:#000; }
</style></head>
<body>
<div id="stage"></div>
<script>
// ?scene=<id> shows one scene (for checks); otherwise window.play() runs the whole film using timing.json
const P = new URLSearchParams(location.search);
let script, timing;
function el(sc) {
  const d = document.createElement("div");
  d.className = "scene" + (sc.quote && sc.media ? " with-quote" : "") + (sc.captions || sc.fit ? " fit" : "");
  d.id = "sc-" + sc.id;
  const n = (sc.media || []).length;
  d.innerHTML = `<div class="kicker">${sc.kicker}</div><div class="headline">${sc.headline}</div>
    ${sc.sub ? `<div class="sub">${sc.sub}</div>` : ""}
    ${n ? `<div class="media m${n >= 4 ? 4 : n}">${sc.media.map(m => /\.(svg|png|jpg)$/.test(m) ? `<img src="${m}" style="width:100%;height:100%;object-fit:contain;background:#0d0d0f;border-radius:22px;padding:24px">` : `<video src="${m}" muted loop playsinline preload="auto"></video>`).join("")}</div>` : ""}
    ${sc.captions ? `<div class="caps">${sc.captions.map(c => `<span>${c}</span>`).join("")}</div>` : ""}
    ${sc.stat ? `<div class="stat">${sc.stat}</div>` : ""}
    ${sc.quote ? `<div class="quote"><span class="who">Argon</span>“${sc.quote}”</div>` : ""}
    ${sc.big ? `<div class="big">${sc.big}</div><div class="bigcap">${sc.bigcap}</div>` : ""}
    ${sc.list ? `<ul class="list">${sc.list.map((l, i) => `<li style="transition-delay:${0.6 + i * 0.35}s">${l}</li>`).join("")}</ul>` : ""}`;
  return d;
}
function show(id) {
  document.querySelectorAll(".scene").forEach(s => {
    const on = s.id === "sc-" + id;
    s.classList.toggle("on", on);
    s.querySelectorAll("video").forEach(v => { if (on) { v.currentTime = 0; v.play().catch(() => {}); } else v.pause(); });
  });
}
async function boot() {
  script = await (await fetch(P.get("script") || "script.json", { cache: "no-store" })).json();
  timing = await (await fetch(P.get("timing") || "timing.json", { cache: "no-store" })).json();
  const skip = new Set(JSON.parse(P.get("skip") || "[]"));
  script.scenes = script.scenes.filter(s => !skip.has(s.id));
  const stage = document.getElementById("stage");
  script.scenes.forEach(sc => stage.appendChild(el(sc)));
  window.__ready = true;
  if (P.get("scene")) show(P.get("scene"));
}
window.play = async () => {
  for (const sc of script.scenes) { show(sc.id); await new Promise(r => setTimeout(r, (timing[sc.id] + 0.9) * 1000)); }
};
boot();
</script></body></html>
