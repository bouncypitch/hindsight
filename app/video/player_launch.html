<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hindsight Film</title>
<style>
  :root { --bg:#000; --ink:#f5f5f7; --mute:#a1a1a6; --g1:#2ee6d6; --g2:#3b82f6; --g3:#a78bfa; --bad1:#ff6b6b; --bad2:#ff9f43; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1920px; height:1080px; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; }
  .scene { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:44px; padding:80px 110px; opacity:0; transition:opacity .8s ease; }
  .scene.on { opacity:1; }
  h1 { max-width:1700px; font-size:104px; font-weight:700; letter-spacing:-.045em; line-height:1; text-align:center; transform:translateY(24px); opacity:0; transition:all 1s cubic-bezier(.2,.7,.2,1) .1s; }
  .on h1 { transform:none; opacity:1; }
  .sub { font-size:52px; color:var(--mute); font-weight:500; letter-spacing:-.02em; text-align:center; opacity:0; transition:opacity 1s ease .6s; }
  .on .sub { opacity:1; }
  .big { font-size:200px; font-weight:800; letter-spacing:-.05em; line-height:1.08; padding-bottom:.08em; background:linear-gradient(100deg, var(--g1), var(--g2) 55%, var(--g3)); -webkit-background-clip:text; color:transparent; opacity:0; transform:scale(.96); transition:all 1.1s cubic-bezier(.2,.7,.2,1) .5s; }
  .big.bad { background:linear-gradient(100deg, var(--bad1), var(--bad2)); -webkit-background-clip:text; }
  .on .big { opacity:1; transform:none; }
  .media { display:flex; gap:28px; width:100%; justify-content:center; flex:0 1 auto; max-height:640px; opacity:0; transform:scale(.98); transition:all 1.1s ease .35s; }
  .on .media { opacity:1; transform:none; }
  .media .cell { position:relative; flex:1; max-width:1500px; }
  .wide .media { max-height:none; } .wide .media .cell { flex:0 0 auto; max-width:none; }
  .wide .media video { width:auto; height:auto; max-width:1700px; max-height:740px; aspect-ratio:auto; object-fit:contain; background:#000; }
  .media video { width:100%; height:100%; max-height:640px; object-fit:cover; border-radius:28px; background:#111; display:block; aspect-ratio:16/9; }
  .m3 .cell video { aspect-ratio:4/3; }
  .label { position:absolute; left:28px; top:24px; font-size:44px; font-weight:700; padding:6px 22px; border-radius:999px; background:rgba(0,0,0,.55); backdrop-filter:blur(8px); }
  .label.good, .label.indoor, .label.outdoor { color:var(--g1); } .label.bad, .label.parks, .label.launches { color:var(--bad1); }
  .cols { display:grid; grid-template-columns:1fr 1fr; width:1700px; font-size:48px; font-weight:700; text-align:center; margin-bottom:-24px; }
  .cols .b { color:var(--bad1); } .cols .a { color:var(--g1); }
  .verdicts { display:grid; grid-template-columns:1fr 1fr; gap:40px; width:1600px; }
  .verdict { border:1px solid #2a2a30; border-radius:36px; padding:48px 56px; background:#0c0c0f; opacity:0; transform:translateY(20px); transition:all 1s ease; }
  .on .verdict { opacity:1; transform:none; } .on .verdict:nth-child(2) { transition-delay:2.2s; } .on .verdict:nth-child(1) { transition-delay:.6s; }
  .verdict .v { font-size:110px; font-weight:800; letter-spacing:-.04em; line-height:1.1; padding-bottom:.06em; -webkit-background-clip:text; color:transparent; }
  .verdict.bad .v { background:linear-gradient(100deg, var(--bad1), var(--bad2)); -webkit-background-clip:text; }
  .verdict.good .v { background:linear-gradient(100deg, var(--g1), var(--g2) 55%, var(--g3)); -webkit-background-clip:text; }
  .verdict .k { font-size:50px; color:var(--ink); font-weight:600; margin-top:14px; letter-spacing:-.02em; }
  .row { display:flex; align-items:center; gap:70px; width:100%; justify-content:center; }
  .row .media { flex:0 0 1100px; }
  .end h1 { line-height:1.12; padding-bottom:.12em; font-size:150px; background:linear-gradient(100deg, var(--g1), var(--g2) 55%, var(--g3)); -webkit-background-clip:text; color:transparent; }
</style></head>
<body><div id="stage"></div>
<script>
const P = new URLSearchParams(location.search);
let script, timing;
function el(sc) {
  const d = document.createElement("div");
  d.className = "scene" + (sc.end ? " end" : "") + (sc.wide ? " wide" : "");
  d.id = "sc-" + sc.id;
  const n = (sc.media || []).length;
  const media = n ? `<div class="media m${n}">${sc.media.map((m, i) => `<div class="cell"><video src="${m.split("#")[0]}" data-start="${(m.split("#t=")[1] || 0)}" muted loop playsinline preload="auto"></video>${sc.labels && !sc.wide ? `<div class="label ${sc.labels[i].toLowerCase()}">${sc.labels[i]}</div>` : ""}</div>`).join("")}</div>` : "";
  const big = sc.big ? `<div class="big ${sc.bigclass || ""}">${sc.big}</div>` : "";
  d.innerHTML = `<h1>${sc.headline}</h1>` + (sc.cols ? `<div class="cols"><span class="b">${sc.cols[0]}</span><span class="a">${sc.cols[1]}</span></div>` : "") + (n && sc.big ? `<div class="row">${media}${big}</div>` : media + big) + (sc.sub ? `<div class="sub">${sc.sub}</div>` : "") + (sc.verdicts ? `<div class="verdicts">${sc.verdicts.map((v, i) => `<div class="verdict ${i ? "good" : "bad"}"><div class="v">${v[0]}</div><div class="k">${v[1]}</div></div>`).join("")}</div>` : "");
  return d;
}
function show(id) {
  document.querySelectorAll(".scene").forEach(s => {
    const on = s.id === "sc-" + id;
    s.classList.toggle("on", on);
    s.querySelectorAll("video").forEach(v => { if (on) { v.currentTime = +(v.dataset.start || 0); v.play().catch(() => {}); } else v.pause(); });
  });
}
async function boot() {
  script = await (await fetch(P.get("script") || "script_launch.json", { cache: "no-store" })).json();
  timing = await (await fetch(P.get("timing") || "timing_launch.json", { cache: "no-store" })).json();
  const stage = document.getElementById("stage");
  script.scenes.forEach(sc => stage.appendChild(el(sc)));
  window.__ready = true;
  if (P.get("scene")) show(P.get("scene"));
}
const GAP = +(P.get("gap") || 0.9);
window.play = async () => { for (const sc of script.scenes) { show(sc.id); await new Promise(r => setTimeout(r, (timing[sc.id] + GAP) * 1000)); } };
boot();
</script></body></html>
