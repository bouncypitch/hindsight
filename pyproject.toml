[project]
name = "curbsense"
version = "0.1.0"
description = "Sidewalk robot that learns from its failures with Gemini 4 Argon"
authors = [
    { name = "bouncypitch", email = "kdotmahesh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cma>=4.5.0",
    "fastapi>=0.162.0",
    "google-genai>=2.3.0",
    "huggingface-hub>=2.3.0",
    "imageio[ffmpeg]>=2.38.1",
    "mujoco>=3.17.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.0",
    "playwright>=1.64.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
